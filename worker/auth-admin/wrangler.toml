# wrangler CLI でデプロイする場合の設定例。
# 普通は Cloudflare Dashboard で Quick edit + Secrets 設定するだけで OK。
# (SETUP.md 参照)
#
# CLI 経由でやりたい場合:
#   npm i -g wrangler
#   wrangler login
#   wrangler deploy
#   wrangler secret put SUPABASE_URL
