name: 予約枠監視 (shareconnect)

on:
  schedule:
    # 毎朝 7:00 JST (= 22:00 UTC 前日)
    - cron: '0 22 * * *'
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write   # data/reservation-status.json を commit するため

jobs:
  check-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run slot check
        run: npm run check
        env:
          TZ: Asia/Tokyo

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reservation-status.json
          if git diff --cached --quiet; then
            echo "No changes to reservation-status.json"
            exit 0
          fi
          git commit -m "chore(availability): auto-update reservation-status [skip ci]"
          # 並列 Run (手動連打 + Scheduled) で push 競合が起きるため
          # rebase してリトライ。4回まで試行。
          for attempt in 1 2 3 4; do
            if git push; then
              echo "✓ Push succeeded (attempt $attempt)"
              exit 0
            fi
            echo "⚠ Push rejected (attempt $attempt). Pulling with rebase..."
            git pull --rebase origin master || true
            sleep $((attempt * 2))
          done
          echo "::error::Failed to push after 4 attempts"
          exit 1
