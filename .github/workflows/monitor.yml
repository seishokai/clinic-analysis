name: 予約枠監視 (shareconnect + apotool)

on:
  schedule:
    # 毎朝 7:00 JST (= 22:00 UTC 前日)
    - cron: '0 22 * * *'
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write   # data/reservation-status.json を commit するため

# E2 fix: 同 workflow の並列実行を完全に防ぐ
# 連打/Scheduled と手動の重複時、後発 Run は前のキャンセル待ちはせず in_progress を打ち切る
# (4分後の最新データが欲しいだけなので、走り直しのほうが速い)
concurrency:
  group: monitor-slots
  cancel-in-progress: true

jobs:
  check-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run slot check (shareconnect)
        run: npm run check
        env:
          TZ: Asia/Tokyo

      - name: Run slot check (apotool)
        run: npm run check:apotool
        env:
          TZ: Asia/Tokyo
        continue-on-error: true  # apotool 側で失敗しても shareconnect 分は保存する

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reservation-status.json data/apotool-status.json
          if git diff --cached --quiet; then
            echo "No changes to reservation-status.json"
            exit 0
          fi
          git commit -m "chore(availability): auto-update reservation-status [skip ci]"
          # 並列 Run (手動連打 + Scheduled) で push 競合が起きるため
          # rebase してリトライ。4回まで試行。
          # E1 fix: data/reservation-status.json のコンフリクト時は
          #   我々の (たった今生成した) バージョンを優先 (-X theirs during rebase)
          for attempt in 1 2 3 4; do
            if git push; then
              echo "✓ Push succeeded (attempt $attempt)"
              exit 0
            fi
            echo "⚠ Push rejected (attempt $attempt). Pulling with rebase (theirs strategy)..."
            if ! git pull --rebase -X theirs origin master; then
              echo "⚠ Rebase failed, aborting and retrying"
              git rebase --abort 2>/dev/null || true
              # 最後の手段: 完全に origin に巻き戻して我々の変更だけ再適用
              git stash --include-untracked >/dev/null 2>&1 || true
              git fetch origin master
              git reset --hard origin/master
              git stash pop >/dev/null 2>&1 || true
              git add data/reservation-status.json
              git commit -m "chore(availability): auto-update reservation-status [skip ci]" || true
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Failed to push after 4 attempts"
          exit 1
