<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>営業ポータル / Aladdin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<style>
  :root{
    --bg:#fafafa; --card:#fff; --border:#e5e7eb; --text:#1a1a1a; --text-sub:#6b7280;
    --accent:#1a1a1a; --hi-bg:#fffbea; --hi-border:#d4a010; --hi-text:#b07800;
    --danger:#dc2626;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  [hidden]{display:none !important}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',Meiryo,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:24px 20px 60px}

  /* Top bar */
  .top-bar{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:12px}
  .back-link{color:var(--text-sub); text-decoration:none}
  .back-link:hover{color:var(--text)}
  .auth-area{display:flex; align-items:center; gap:8px}
  .badge{padding:3px 10px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:1px}
  .badge.admin{background:#1a1a1a; color:#fff}
  .badge.guest{background:#e5e7eb; color:var(--text-sub)}
  .auth-btn{font-size:11px; padding:4px 10px; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--text-sub); cursor:pointer; font-family:inherit}
  .auth-btn:hover{background:var(--bg); color:var(--text)}

  header.brand-head{text-align:center; margin:32px 0 28px}
  .brand{
    font-family:'Great Vibes', cursive; font-size:64px; line-height:1;
    background:linear-gradient(135deg,#1a1a1a 0%,#555 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    margin:0;
  }
  .subtitle{font-size:13px; letter-spacing:3px; color:var(--text-sub); margin-top:6px; text-transform:uppercase}

  /* Grid layout */
  #tabs-tree{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:14px}
  .node{display:flex; flex-direction:column; gap:8px}
  .node.is-group{grid-column:1/-1}                    /* Group spans full row to allow sub-grid below */

  /* Card */
  .tab-card{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px 14px; min-height:88px;
    background:#fff; border:1px solid var(--border); border-radius:14px;
    cursor:pointer; text-decoration:none; color:var(--text);
    transition:all .15s; font-family:inherit; font-size:14px; font-weight:600;
    text-align:center; gap:6px;
    position:relative;
  }
  .tab-card:hover{
    transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.08);
    border-color:var(--accent);
  }
  .tab-card.highlight{
    background:linear-gradient(135deg, var(--hi-bg) 0%, #fff 100%);
    border-color:var(--hi-border);
    color:var(--hi-text);
  }
  .tab-card .ic{font-size:22px; line-height:1}
  .tab-card .lbl{font-size:14px; line-height:1.3; word-break:break-word}
  .tab-card .meta{font-size:10px; color:var(--text-sub); font-weight:500; letter-spacing:1px}
  .tab-card .toggle-arrow{font-size:11px; color:var(--text-sub); transition:transform .15s}
  .node.expanded .tab-card .toggle-arrow{transform:rotate(180deg)}

  /* Sub-grid for group children */
  .node-children{
    display:none;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:8px;
    padding:12px; background:#f9fafb; border-radius:12px;
    border:1px dashed var(--border);
  }
  .node.expanded > .node-children{display:grid}
  .node-children .tab-card{padding:18px 10px; min-height:60px; font-size:12px}

  /* Admin actions on card */
  .card-actions{
    position:absolute; top:6px; right:6px;
    display:flex; gap:2px; opacity:.5; transition:opacity .15s;
    background:rgba(255,255,255,.95); border-radius:6px; padding:2px;
  }
  .tab-card:hover .card-actions{opacity:1}
  /* タッチデバイスは常時表示 (ホバー無効) */
  @media (hover: none){
    .card-actions{opacity:1}
  }
  .icon-btn{
    width:30px; height:30px; border:none; background:transparent; cursor:pointer;
    border-radius:4px; font-size:13px; color:var(--text-sub); padding:0;
    display:flex; align-items:center; justify-content:center; font-family:inherit;
  }
  .icon-btn:hover{background:rgba(0,0,0,.06); color:var(--text)}
  .icon-btn.danger:hover{background:#fee2e2; color:var(--danger)}

  /* モバイル: 2カラム */
  @media (max-width: 480px){
    #tabs-tree{grid-template-columns:repeat(2, 1fr); gap:10px}
    .tab-card{padding:18px 8px; min-height:72px; font-size:13px}
    .tab-card .ic{font-size:18px}
  }

  /* Add buttons */
  .add-card{
    display:flex; align-items:center; justify-content:center;
    padding:24px; min-height:88px;
    color:var(--text-sub); background:transparent;
    border:2px dashed var(--border); border-radius:14px;
    cursor:pointer; font-family:inherit; font-size:13px; font-weight:600;
  }
  .add-card:hover{border-color:var(--accent); color:var(--text); background:#fff}
  .add-child-card{padding:14px; min-height:60px; font-size:12px}

  /* Login CTA */
  #login-cta{
    margin-top:24px; padding:14px; background:#fff; border:1px solid var(--border);
    border-radius:10px; font-size:12px; text-align:center; color:var(--text-sub);
  }
  #login-cta button{background:none; border:none; color:var(--text); font-weight:600; text-decoration:underline; cursor:pointer; font-family:inherit; font-size:12px}

  /* Loading state */
  #loading{padding:40px; text-align:center; color:var(--text-sub); font-size:13px}
  #empty{padding:40px; text-align:center; color:var(--text-sub); font-size:13px}

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay[hidden]{display:none !important}
  .modal{
    background:#fff; border-radius:14px; padding:24px; width:100%; max-width:480px;
    max-height:90vh; overflow-y:auto;
  }
  .modal h2{margin:0 0 6px; font-size:17px; font-weight:700; letter-spacing:1px}
  .modal .modal-sub{font-size:11px; color:var(--text-sub); margin-bottom:14px}
  .modal label{display:block; font-size:11px; font-weight:700; color:var(--text-sub); letter-spacing:1px; text-transform:uppercase; margin:14px 0 6px}
  .modal label.checkbox{display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:0; font-size:13px; color:var(--text); font-weight:500; cursor:pointer; margin-top:10px}
  .modal label.checkbox input{width:auto}
  .modal input[type="text"], .modal input[type="url"], .modal input[type="password"], .modal select{
    width:100%; padding:11px 13px; font-size:14px; border:1px solid var(--border);
    border-radius:8px; outline:none; background:#fff; font-family:inherit;
  }
  .modal input:focus, .modal select:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,0,0,.05)}
  .modal-actions{display:flex; gap:8px; margin-top:24px; flex-wrap:wrap}
  .modal-actions button{
    flex:1; min-width:90px; padding:11px 16px; font-size:13px; font-weight:600;
    border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text);
    cursor:pointer; font-family:inherit;
  }
  .modal-actions button:hover{background:var(--bg)}
  .modal-actions .primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .modal-actions .primary:hover{background:#000}
  .modal-actions .danger-btn{background:#fff; color:var(--danger); border-color:#fecaca}
  .modal-actions .danger-btn:hover{background:#fee2e2}
  .modal-msg{font-size:12px; margin-top:10px; min-height:16px}
  .modal-msg.error{color:var(--danger)}
  .modal-msg.success{color:#059669}

  /* Toast */
  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#1a1a1a; color:#fff; padding:11px 18px; border-radius:8px;
    font-size:13px; z-index:2000; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  #toast.show{opacity:1}
  #toast.error{background:#dc2626}

  /* hide elements when not admin */
  body:not(.is-admin) .admin-only{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a href="../" class="back-link">← ポータルへ戻る</a>
    <div class="auth-area" id="auth-area" hidden>
      <span id="auth-badge" class="badge guest">ゲスト</span>
      <button id="auth-btn" class="auth-btn">管理者ログイン</button>
    </div>
  </div>

  <header class="brand-head">
    <h1 class="brand">Aladdin</h1>
    <div class="subtitle">Sales Portal</div>
  </header>

  <div id="loading">読み込み中…</div>
  <div id="empty" hidden>タブが登録されていません。</div>
  <div id="tabs-tree" hidden></div>

  <button id="add-root-btn" class="admin-only add-card" style="margin-top:20px;width:100%">＋ トップレベルにタブを追加</button>

  <div id="login-cta" hidden>
    タブの追加・編集には <button type="button" id="login-link">管理者ログイン</button> が必要です。
  </div>
</div>

<div id="toast"></div>

<!-- Edit / Add Modal -->
<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal">
    <h2 id="modal-title">タブを追加</h2>
    <form id="tab-form">
      <input type="hidden" id="form-id">

      <label for="form-label">ラベル *</label>
      <input type="text" id="form-label" required maxlength="50" placeholder="例: 動画研修">

      <label for="form-url">URL（空欄ならグループタブ＝サブタブの親になる）</label>
      <input type="text" id="form-url" placeholder="例: https://... / qa.html / dental-loan/">

      <label for="form-parent">親タブ</label>
      <select id="form-parent">
        <option value="">（トップレベル）</option>
      </select>

      <label class="checkbox">
        <input type="checkbox" id="form-external">
        新しいタブで開く（外部リンク）
      </label>
      <label class="checkbox">
        <input type="checkbox" id="form-highlight">
        ハイライト表示（黄色強調）
      </label>
      <label class="checkbox" id="continue-add-label">
        <input type="checkbox" id="form-continue">
        🔁 保存して続けて追加（連続作業用）
      </label>

      <div class="modal-actions">
        <button type="button" id="modal-cancel">キャンセル</button>
        <button type="button" id="modal-delete" class="danger-btn" hidden>削除</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- Login Modal -->
<div id="login-modal" class="modal-overlay" hidden>
  <div class="modal" style="max-width:380px">
    <h2>管理者ログイン</h2>
    <div class="modal-sub">パスワードを入力してください。</div>
    <form id="login-form">
      <label for="login-pw">パスワード</label>
      <input type="password" id="login-pw" autocomplete="current-password" autofocus>
      <div class="modal-msg" id="login-msg"></div>
      <div class="modal-actions">
        <button type="button" id="login-cancel">キャンセル</button>
        <button type="submit" class="primary">ログイン</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
  const SUPABASE_URL = 'https://ndlfqrvoejwgqfdtghmg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kbGZxcnZvZWp3Z3FmZHRnaG1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1ODIxNjcsImV4cCI6MjA5MTE1ODE2N30.pE-l-4NgQTpEb9DvjeRptargvrsYH9YKyRLt06flPik';
  const ADMIN_PASSWORD = 'Edoyadepon1';
  const ADMIN_TOKEN_KEY = 'sales-admin-token';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let tabsFlat = [];
  let tabsTree = [];
  let isAdmin = false;
  let expandedIds;
  try { expandedIds = new Set(JSON.parse(localStorage.getItem('sales-expanded') || '[]')); }
  catch(_) { expandedIds = new Set(); localStorage.removeItem('sales-expanded'); }

  // ===== Toast =====
  let _toastTimer = null;
  function toast(msg, isError = false){
    const t = $('toast');
    t.innerHTML = '';
    t.textContent = msg;
    t.classList.toggle('error', isError);
    t.classList.add('show');
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }
  // Undoボタン付きトースト (5秒間表示、押下でundoFn 実行)
  function toastWithUndo(msg, undoFn){
    const t = $('toast');
    t.innerHTML = `<span style="margin-right:12px">${msg}</span><button id="toast-undo" style="background:#fff;color:#1a1a1a;border:none;padding:5px 12px;border-radius:14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">↩ 元に戻す</button>`;
    t.classList.remove('error');
    t.classList.add('show');
    if (_toastTimer) clearTimeout(_toastTimer);
    let used = false;
    document.getElementById('toast-undo').onclick = async () => {
      if (used) return;
      used = true;
      t.classList.remove('show');
      try { await undoFn(); } catch(e) { toast('元に戻せませんでした: ' + (e.message||e), true); }
    };
    _toastTimer = setTimeout(() => t.classList.remove('show'), 5000);
  }

  // ===== Auth (パスワード方式) =====
  function isLocalAdmin(){
    return localStorage.getItem(ADMIN_TOKEN_KEY) === 'true';
  }
  function setLocalAdmin(flag){
    if (flag) localStorage.setItem(ADMIN_TOKEN_KEY, 'true');
    else localStorage.removeItem(ADMIN_TOKEN_KEY);
  }

  function applyAuthUI(){
    isAdmin = isLocalAdmin();
    document.body.classList.toggle('is-admin', isAdmin);
    const badge = $('auth-badge');
    const btn = $('auth-btn');
    const cta = $('login-cta');
    if (isAdmin) {
      badge.textContent = '👤 admin';
      badge.className = 'badge admin';
      btn.textContent = 'ログアウト';
      btn.onclick = () => {
        setLocalAdmin(false);
        toast('ログアウトしました');
        location.reload();
      };
      cta.hidden = true;
    } else {
      badge.textContent = 'ゲスト';
      badge.className = 'badge guest';
      btn.textContent = '管理者ログイン';
      btn.onclick = openLoginModal;
      cta.hidden = false;
    }
    $('auth-area').hidden = false;
  }

  function openLoginModal(){
    $('login-msg').textContent = '';
    $('login-msg').className = 'modal-msg';
    $('login-pw').value = '';
    $('login-modal').hidden = false;
    setTimeout(() => $('login-pw').focus(), 50);
  }
  function closeLoginModal(){
    $('login-modal').hidden = true;
  }
  $('login-cancel').onclick = closeLoginModal;
  $('login-link').onclick = openLoginModal;
  $('login-modal').onclick = (e) => { if (e.target === $('login-modal')) closeLoginModal(); };
  $('login-form').onsubmit = (e) => {
    e.preventDefault();
    const pw = $('login-pw').value;
    if (pw === ADMIN_PASSWORD) {
      setLocalAdmin(true);
      toast('ログインしました');
      closeLoginModal();
      // 再読込で UI 更新 (admin ボタン表示等)
      applyAuthUI();
      renderTree();
    } else {
      const m = $('login-msg');
      m.textContent = 'パスワードが違います';
      m.className = 'modal-msg error';
      $('login-pw').select();
    }
  };

  // ===== Data =====
  function fetchTabs(){
    return sb.from('sales_tabs')
      .select('id, parent_id, label, url, external, highlight, sort_order')
      .eq('is_active', true)
      .order('sort_order');
  }

  function applyTabsResult({ data, error }){
    $('loading').hidden = true;
    $('empty').hidden = true;
    $('tabs-tree').hidden = true;
    if (error) {
      console.error('sales_tabs load error', error);
      const msg = (error.message || '') + ' ' + (error.details || '') + ' ' + (error.hint || '');
      const isMissing = error.code === '42P01'
        || error.code === 'PGRST205'
        || /relation .* does not exist/i.test(msg)
        || /could not find the table/i.test(msg);
      tabsFlat = [];
      tabsTree = [];
      const emptyEl = $('empty');
      emptyEl.textContent = isMissing
        ? 'sales_tabs テーブルが未作成です。管理者は migrations/sales_tabs.sql を Supabase で実行してください。'
        : '読み込みエラー: ' + (error.message || '');
      emptyEl.hidden = false;
      if (!isAdmin) return;
      $('tabs-tree').hidden = false;
      renderTree();
      return;
    }
    tabsFlat = data || [];
    tabsTree = buildTree(tabsFlat);
    // 削除されたタブIDを expandedIds から自動クリーンアップ
    const validIds = new Set(tabsFlat.map(t => t.id));
    let changed = false;
    for (const id of expandedIds) {
      if (!validIds.has(id)) { expandedIds.delete(id); changed = true; }
    }
    if (changed) localStorage.setItem('sales-expanded', JSON.stringify([...expandedIds]));

    if (tabsTree.length === 0 && !isAdmin) {
      $('empty').hidden = false;
    } else {
      $('tabs-tree').hidden = false;
      renderTree();
    }
  }

  async function loadTabs(){
    $('loading').hidden = false;
    const result = await fetchTabs();
    applyTabsResult(result);
  }

  function buildTree(flat){
    const byParent = new Map();
    flat.forEach(t => {
      const key = t.parent_id || 'ROOT';
      if (!byParent.has(key)) byParent.set(key, []);
      byParent.get(key).push(t);
    });
    function attach(parentKey){
      const arr = (byParent.get(parentKey) || []).slice().sort((a,b) => a.sort_order - b.sort_order);
      return arr.map(t => ({ ...t, children: attach(t.id) }));
    }
    return attach('ROOT');
  }

  // ===== Render (Grid layout) =====
  function renderTree(){
    const root = $('tabs-tree');
    root.innerHTML = '';
    tabsTree.forEach(node => root.appendChild(renderCard(node, true)));
  }

  // top: トップレベルかどうか (true=メイングリッド、false=サブグリッド内)
  function renderCard(node, top){
    const wrap = document.createElement('div');
    wrap.className = 'node';
    wrap.dataset.id = node.id;

    const hasChildren = node.children && node.children.length > 0;
    const isGroup = !node.url || hasChildren;
    if (isGroup && top) wrap.classList.add('is-group');
    if (expandedIds.has(node.id)) wrap.classList.add('expanded');

    let card;
    if (isGroup) {
      card = document.createElement('button');
      card.type = 'button';
      card.className = 'tab-card' + (node.highlight ? ' highlight' : '');
      card.innerHTML = `
        <div class="ic">📁</div>
        <div class="lbl">${esc(node.label)}</div>
        <div class="meta">${node.children.length}項目 <span class="toggle-arrow">▾</span></div>
      `;
      card.onclick = (e) => {
        if (e.target.closest('.card-actions')) return;
        toggleNode(node.id, wrap);
      };
    } else {
      card = document.createElement('a');
      card.className = 'tab-card' + (node.highlight ? ' highlight' : '');
      card.href = node.url;
      if (node.external) { card.target = '_blank'; card.rel = 'noopener noreferrer'; }
      card.innerHTML = `
        <div class="lbl">${esc(node.label)}</div>
        ${node.external ? '<div class="meta">外部リンク ↗</div>' : ''}
      `;
    }

    // Admin actions
    const actions = document.createElement('div');
    actions.className = 'card-actions admin-only';
    actions.innerHTML = `
      <button class="icon-btn" data-act="edit" title="編集">✏️</button>
      <button class="icon-btn danger" data-act="delete" title="削除">🗑</button>
    `;
    actions.querySelectorAll('button').forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        e.preventDefault();
        handleAction(b.dataset.act, node);
      };
    });
    card.appendChild(actions);
    wrap.appendChild(card);

    // Children sub-grid
    if (hasChildren || (isAdmin && isGroup)) {
      const childWrap = document.createElement('div');
      childWrap.className = 'node-children';
      (node.children || []).forEach(c => childWrap.appendChild(renderCard(c, false)));
      if (isAdmin) {
        const addBtn = document.createElement('button');
        addBtn.className = 'add-card add-child-card admin-only';
        addBtn.type = 'button';
        addBtn.textContent = '＋ サブタブを追加';
        addBtn.onclick = (e) => { e.stopPropagation(); openModal({ parent_id: node.id }); };
        childWrap.appendChild(addBtn);
      }
      wrap.appendChild(childWrap);
    }

    return wrap;
  }

  function toggleNode(id, el){
    const expanded = el.classList.toggle('expanded');
    if (expanded) expandedIds.add(id); else expandedIds.delete(id);
    localStorage.setItem('sales-expanded', JSON.stringify([...expandedIds]));
  }

  // ===== Actions =====
  async function handleAction(act, node){
    if (!isAdmin) { toast('管理者ログインが必要です', true); return; }
    if (act === 'edit') return openModal(node);
    if (act === 'delete') return deleteTab(node);
  }

  async function deleteTab(node){
    const hasChildren = (node.children || []).length > 0;
    const childCount = hasChildren ? (node.children || []).length : 0;
    const msg = hasChildren
      ? `「${node.label}」とその配下のサブタブ ${childCount} 件をすべて削除しますか？`
      : `「${node.label}」を削除しますか？`;
    if (!confirm(msg)) return;
    // 削除前に親 + 子のフルデータを保存 (Undo用)
    const savedParent = { ...node };
    delete savedParent.children;
    const savedChildren = (node.children || []).map(c => {
      const x = { ...c };
      delete x.children;
      return x;
    });
    const { error } = await sb.from('sales_tabs').delete().eq('id', node.id);
    if (error) { toast('削除失敗: ' + error.message, true); return; }
    toastWithUndo(
      hasChildren ? `「${node.label}」とサブ${childCount}件を削除` : `「${node.label}」を削除`,
      async () => {
        // 親を先に再 insert (id 維持)
        const r1 = await sb.from('sales_tabs').insert(savedParent);
        if (r1.error) throw r1.error;
        // 子を再 insert
        for (const c of savedChildren) {
          await sb.from('sales_tabs').insert(c);
        }
        toast('削除を取り消しました');
        await loadTabs();
      }
    );
    await loadTabs();
  }

  // ===== Modal =====
  let modalMode = 'add';
  let modalNode = null;

  function openModal(node){
    if (!isAdmin) { toast('管理者ログインが必要です', true); openLoginModal(); return; }
    modalNode = node;
    modalMode = node && node.id ? 'edit' : 'add';
    $('modal-title').textContent = modalMode === 'edit' ? 'タブを編集' : 'タブを追加';
    $('form-id').value = node?.id || '';
    $('form-label').value = node?.label || '';
    $('form-url').value = node?.url || '';
    $('form-external').checked = !!node?.external;
    $('form-highlight').checked = !!node?.highlight;
    const sel = $('form-parent');
    sel.innerHTML = '<option value="">（トップレベル）</option>';
    const excludeIds = new Set();
    if (node?.id) {
      const collectDescendants = (id) => {
        excludeIds.add(id);
        tabsFlat.filter(t => t.parent_id === id).forEach(c => collectDescendants(c.id));
      };
      collectDescendants(node.id);
    }
    tabsFlat
      .filter(t => !excludeIds.has(t.id))
      .forEach(t => {
        const path = buildPath(t);
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = path;
        if ((node?.parent_id || '') === t.id) opt.selected = true;
        sel.appendChild(opt);
      });
    $('modal-delete').hidden = modalMode !== 'edit';
    // 「続けて追加」チェックは新規追加時のみ表示
    $('continue-add-label').hidden = modalMode === 'edit';
    if (modalMode === 'edit') $('form-continue').checked = false;
    $('modal-overlay').hidden = false;
    setTimeout(() => $('form-label').focus(), 50);
  }

  function buildPath(t){
    const names = [];
    let cur = t;
    while (cur) {
      names.unshift(cur.label);
      cur = tabsFlat.find(x => x.id === cur.parent_id);
    }
    return names.join(' › ');
  }

  function closeModal(){ $('modal-overlay').hidden = true; modalNode = null; }

  $('modal-cancel').onclick = closeModal;
  $('modal-overlay').onclick = (e) => { if (e.target === $('modal-overlay')) closeModal(); };

  $('modal-delete').onclick = async () => {
    if (!modalNode?.id) return;
    closeModal();
    await deleteTab(modalNode);
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!$('modal-overlay').hidden) closeModal();
      else if (!$('login-modal').hidden) closeLoginModal();
    }
  });

  $('tab-form').onsubmit = async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    if (submitBtn.disabled) return;
    submitBtn.disabled = true;
    const origText = submitBtn.textContent;
    submitBtn.textContent = '保存中…';

    try {
      let url = $('form-url').value.trim();
      const ext = $('form-external').checked;

      if (url && /^(javascript|data|vbscript):/i.test(url)) {
        toast('このURLスキームは使用できません', true);
        return;
      }
      if (url && ext && !/^https?:\/\//i.test(url) && !/^\//.test(url)) {
        url = 'https://' + url;
      }

      const payload = {
        label: $('form-label').value.trim(),
        url: url || null,
        parent_id: $('form-parent').value || null,
        external: ext,
        highlight: $('form-highlight').checked,
      };
      if (!payload.label) { toast('ラベルを入力してください', true); return; }

      let res;
      if (modalMode === 'edit' && modalNode?.id) {
        res = await sb.from('sales_tabs').update(payload).eq('id', modalNode.id);
      } else {
        const siblings = tabsFlat.filter(t => (t.parent_id || null) === (payload.parent_id || null));
        const maxSort = siblings.reduce((m, t) => Math.max(m, t.sort_order || 0), 0);
        payload.sort_order = maxSort + 10;
        res = await sb.from('sales_tabs').insert(payload);
      }
      if (res.error) { toast('保存失敗: ' + res.error.message, true); return; }
      toast(modalMode === 'edit' ? '更新しました' : '追加しました');
      // 続けて追加モード (新規追加時のみ): モーダルを閉じずにラベル/URL だけリセット
      const continueAdd = modalMode === 'add' && $('form-continue')?.checked;
      if (!continueAdd) closeModal();
      if (payload.parent_id) {
        expandedIds.add(payload.parent_id);
        localStorage.setItem('sales-expanded', JSON.stringify([...expandedIds]));
      }
      await loadTabs();
      if (continueAdd) {
        // 親タブと外部/ハイライトの設定はそのまま、ラベル/URL だけクリア
        $('form-label').value = '';
        $('form-url').value = '';
        $('form-id').value = '';
        modalNode = null;
        modalMode = 'add';
        $('modal-title').textContent = 'タブを追加 (連続)';
        setTimeout(() => $('form-label').focus(), 50);
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = origText;
    }
  };

  $('add-root-btn').onclick = () => openModal({ parent_id: null });

  // ===== Init =====
  applyAuthUI();
  await loadTabs();
})();
</script>
