<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06C755">
<title>LINE グループ / Aladdin 営業ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<style>
  :root{
    --line:#06C755; --line-d:#05a848; --line-l:#e6f9ef;
    --bg:#f5f5f5; --card:#fff; --border:#e5e7eb;
    --text:#1a1a1a; --text-sub:#6b7280; --text-muted:#9ca3af;
    --gray:#e5e7eb; --danger:#dc2626;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    font-family:'Noto Sans JP','Hiragino Sans','Meiryo',sans-serif;
    background:var(--bg); color:var(--text); line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important}

  /* ヘッダー */
  header.head{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,#06C755 0%,#05a848 100%);
    color:#fff; padding:10px 14px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 8px rgba(6,199,85,.25);
  }
  .head .back{
    color:#fff; text-decoration:none; font-size:13px;
    padding:5px 10px; border:1px solid rgba(255,255,255,.4);
    border-radius:14px; white-space:nowrap; opacity:.95;
  }
  .head .title-wrap{flex:1; text-align:center; min-width:0}
  .head h1{margin:0; font-size:15px; font-weight:800; letter-spacing:.5px}
  .head .sub{font-size:10px; opacity:.85; margin-top:1px}
  .head .spacer{width:52px}

  /* メインコンテナ */
  .container{
    max-width:720px; margin:0 auto; padding:0;
  }

  /* タブ */
  .tabs{
    display:flex; background:#fff;
    position:sticky; top:48px; z-index:15;
    border-bottom:1px solid var(--border);
  }
  .tab{
    flex:1; padding:12px 8px; text-align:center;
    background:transparent; border:none;
    border-bottom:3px solid transparent;
    font-size:13px; font-weight:700; color:var(--text-sub);
    cursor:pointer; font-family:inherit;
  }
  .tab.active{color:var(--line); border-bottom-color:var(--line)}
  .tab .cnt{
    display:inline-block; background:var(--bg); color:var(--text-sub);
    font-size:10px; font-weight:700; padding:1px 7px; border-radius:9px;
    margin-left:5px; min-width:22px;
  }
  .tab.active .cnt{background:var(--line-l); color:var(--line-d)}

  /* 検索+アクションバー */
  .action-bar{
    background:#fff; padding:8px 12px;
    border-bottom:1px solid var(--border);
    display:flex; gap:8px; align-items:center;
    position:sticky; top:93px; z-index:14;
  }
  .search-box{flex:1; position:relative}
  .search-box input{
    width:100%; padding:8px 12px 8px 30px;
    border:1px solid var(--border); border-radius:20px;
    font-size:13px; font-family:inherit; background:var(--bg);
  }
  .search-box input:focus{
    outline:none; border-color:var(--line); background:#fff;
    box-shadow:0 0 0 3px rgba(6,199,85,.1);
  }
  .search-box::before{
    content:'🔍'; position:absolute; left:9px; top:50%;
    transform:translateY(-50%); font-size:11px; opacity:.5;
  }
  .action-btn{
    padding:8px 12px; border-radius:20px; font-size:12px;
    font-weight:700; cursor:pointer; font-family:inherit;
    white-space:nowrap; border:none;
  }
  .action-btn.primary{background:var(--line); color:#fff}
  .action-btn.primary:active{background:var(--line-d)}
  .action-btn.outline{background:#fff; color:var(--line-d); border:1px solid var(--line)}

  /* リスト */
  .list{background:#fff}
  .list-row{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px;
    border-bottom:1px solid #f3f4f6;
    transition:background .1s;
  }
  .list-row:last-child{border-bottom:none}
  .list-row:hover{background:#fafafa}
  .list-row.disabled{background:#fbfbfb}

  .list-row .icon{
    width:36px; height:36px; border-radius:50%;
    background:var(--line-l); color:var(--line-d);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:800; flex-shrink:0;
  }
  .list-row.disabled .icon{background:#f3f4f6; color:var(--text-muted)}

  .list-row .name{
    flex:1; font-size:14px; font-weight:600; color:var(--text);
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .list-row.disabled .name{color:var(--text-sub); font-weight:500}

  .list-row .open-btn{
    background:var(--line); color:#fff; text-decoration:none;
    padding:7px 16px; border-radius:18px;
    font-size:12px; font-weight:700; letter-spacing:.5px;
    box-shadow:0 2px 4px rgba(6,199,85,.25);
    white-space:nowrap; flex-shrink:0;
    display:inline-flex; align-items:center; gap:4px;
  }
  .list-row .open-btn:active{background:var(--line-d); transform:scale(.97)}
  .list-row .not-set{
    color:var(--text-muted); font-size:11px; font-weight:600;
    padding:7px 14px; background:#f3f4f6; border-radius:18px;
    border:1px dashed var(--gray); white-space:nowrap; flex-shrink:0;
  }

  .list-row .actions{display:flex; gap:2px; margin-left:4px}
  .list-row .actions button{
    width:32px; height:32px; border-radius:8px;
    border:none; background:transparent; cursor:pointer;
    font-size:14px; padding:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-sub);
  }
  .list-row .actions button:hover{background:var(--bg); color:var(--text)}
  .list-row .actions button.danger:hover{background:#fef2f2; color:var(--danger)}

  /* ローディング/空 */
  .loading, .empty, .error{
    padding:40px 20px; text-align:center;
    color:var(--text-sub); font-size:13px;
  }
  .empty{background:#fff}
  .error{background:#fff2f2; color:var(--danger)}
  .empty-hint{margin-top:8px; font-size:11px; color:var(--text-muted)}

  /* Modal */
  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    padding:16px; z-index:200; animation:fadein .15s;
  }
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff; border-radius:14px; padding:20px;
    max-width:440px; width:100%; max-height:90vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    animation:slideup .2s;
  }
  @keyframes slideup{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h3{margin:0 0 14px; font-size:16px; font-weight:800}
  .field{margin-bottom:12px}
  .field label{
    display:block; font-size:11px; font-weight:600;
    color:var(--text-sub); margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px;
    border:1px solid var(--border); border-radius:8px;
    font-size:14px; font-family:inherit; box-sizing:border-box;
    background:#fff;
  }
  .field textarea{
    resize:vertical; min-height:130px; line-height:1.5;
    font-family:'SF Mono','Consolas',monospace; font-size:12px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--line);
    box-shadow:0 0 0 3px rgba(6,199,85,.15);
  }
  .field input:disabled, .field select:disabled{background:#fafafa; color:var(--text-sub)}
  .m-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap}
  .btn{
    padding:10px 20px; font-size:14px; font-weight:700;
    border-radius:8px; cursor:pointer; font-family:inherit;
    border:1px solid var(--border); background:#fff; color:var(--text);
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--line); color:#fff; border-color:var(--line)}
  .btn.primary:active{background:var(--line-d)}
  .btn:disabled{opacity:.5; cursor:not-allowed}

  .hint{
    font-size:11px; color:var(--text-sub);
    background:var(--bg); border-radius:6px; padding:8px 10px;
    margin-top:6px; line-height:1.6;
  }
  .hint code{background:#fff; padding:1px 5px; border-radius:3px; font-family:'SF Mono',monospace; font-size:11px}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#1a1a1a; color:#fff; padding:11px 20px; border-radius:24px;
    font-size:13px; font-weight:700; z-index:1000;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
    animation:slideuptoast .25s; max-width:90vw; text-align:center;
  }
  .toast.error{background:var(--danger)}
  @keyframes slideuptoast{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

  @media (max-width:400px){
    .head h1{font-size:14px}
    .action-bar{padding:7px 10px; gap:6px}
    .list-row{padding:11px 12px; gap:8px}
    .list-row .icon{width:32px; height:32px; font-size:12px}
    .list-row .name{font-size:13px}
    .list-row .open-btn, .list-row .not-set{padding:6px 12px; font-size:11px}
  }
</style>
</head>
<body>

<header class="head">
  <a class="back" href="/clinic-analysis/sales/">← 戻る</a>
  <div class="title-wrap">
    <h1>💬 LINE グループ</h1>
    <div class="sub" id="head-sub">読み込み中…</div>
  </div>
  <span class="spacer"></span>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" data-cat="store">🏥 店舗<span class="cnt" id="cnt-store">0</span></button>
    <button class="tab" data-cat="solo">🎯 単独<span class="cnt" id="cnt-solo">0</span></button>
  </div>

  <div class="action-bar">
    <div class="search-box">
      <input type="text" id="search" placeholder="グループ名で検索…">
    </div>
    <button class="action-btn primary" id="add-btn">＋ 追加</button>
    <button class="action-btn outline" id="bulk-btn">📋 一括</button>
  </div>

  <div class="list" id="list">
    <div class="loading">読み込み中…</div>
  </div>
</div>

<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';
  const SUPABASE_URL = 'https://ndlfqrvoejwgqfdtghmg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kbGZxcnZvZWp3Z3FmZHRnaG1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1ODIxNjcsImV4cCI6MjA5MTE1ODE2N30.pE-l-4NgQTpEb9DvjeRptargvrsYH9YKyRLt06flPik';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let allGroups = [];
  let currentCat = 'store';
  let searchQ = '';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast = (msg, err=false) => {
    const el = document.createElement('div');
    el.className = 'toast' + (err ? ' error' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  };

  // タブ
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      currentCat = t.dataset.cat;
      render();
    });
  });

  // 検索
  $('search').addEventListener('input', (e) => {
    searchQ = e.target.value.trim().toLowerCase();
    render();
  });

  // データ取得
  async function load(){
    try {
      const { data, error } = await sb.from('line_groups')
        .select('*')
        .eq('is_active', true)
        .order('category', { ascending: true })
        .order('sort_order', { ascending: true })
        .order('created_at', { ascending: true });
      if (error) throw error;
      allGroups = data || [];
      const s = allGroups.filter(g => g.category === 'store').length;
      const so = allGroups.filter(g => g.category === 'solo').length;
      $('cnt-store').textContent = s;
      $('cnt-solo').textContent = so;
      $('head-sub').textContent = `店舗 ${s} + 単独 ${so}`;
    } catch(e){
      console.error('load failed', e);
      $('list').innerHTML = `<div class="error">読み込み失敗: ${esc(e.message||e)}<br><small style="opacity:.7">line_groups テーブル未作成の可能性</small></div>`;
      $('head-sub').textContent = 'エラー';
      return;
    }
    render();
  }

  // アイコン (名前1文字目)
  function iconText(name){
    const s = String(name||'').trim();
    return s.charAt(0) || '?';
  }

  function render(){
    const rows = allGroups
      .filter(g => g.category === currentCat)
      .filter(g => !searchQ || g.name.toLowerCase().includes(searchQ));
    const list = $('list');
    if (!rows.length) {
      const isSearch = !!searchQ;
      list.innerHTML = `<div class="empty">
        ${isSearch ? '「'+esc(searchQ)+'」に一致するグループがありません' : 'まだ登録がありません'}
        ${!isSearch ? '<div class="empty-hint">上の「＋ 追加」または「📋 一括」から登録できます</div>' : ''}
      </div>`;
      return;
    }
    list.innerHTML = rows.map(g => {
      const hasUrl = !!(g.url && g.url.trim());
      const rowCls = 'list-row' + (hasUrl ? '' : ' disabled');
      const actionHtml = hasUrl
        ? `<a class="open-btn" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">開く →</a>`
        : `<span class="not-set">未設定</span>`;
      return `<div class="${rowCls}">
        <div class="icon">${esc(iconText(g.name))}</div>
        <div class="name" title="${esc(g.name)}">${esc(g.name)}</div>
        ${actionHtml}
        <div class="actions">
          <button data-act="edit" data-id="${g.id}" title="URL 編集">✏️</button>
          <button class="danger" data-act="delete" data-id="${g.id}" title="削除">🗑</button>
        </div>
      </div>`;
    }).join('');
    // Actions
    list.querySelectorAll('.actions button').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const id = b.dataset.id;
        const g = allGroups.find(x => x.id === id);
        if (!g) return;
        if (b.dataset.act === 'edit') openEditModal(g);
        else if (b.dataset.act === 'delete') deleteGroup(g);
      });
    });
  }

  // 追加/編集
  $('add-btn').addEventListener('click', () => openEditModal(null));
  $('bulk-btn').addEventListener('click', () => openBulkModal());

  function openEditModal(g){
    const isNew = !g;
    const html = `
      <div class="backdrop">
        <div class="modal">
          <h3>${isNew ? '＋ 新規追加' : '✏️ URL 編集'}</h3>
          <div class="field">
            <label>カテゴリ</label>
            <select id="m-cat" ${isNew ? '' : 'disabled'}>
              <option value="store"${(g?.category==='store'||(isNew&&currentCat==='store'))?' selected':''}>🏥 店舗グループ</option>
              <option value="solo"${(g?.category==='solo'||(isNew&&currentCat==='solo'))?' selected':''}>🎯 単独グループ</option>
            </select>
          </div>
          <div class="field">
            <label>グループ名 <span style="color:#dc2626">*</span></label>
            <input type="text" id="m-name" value="${esc(g?.name||'')}" placeholder="例: エスカ" ${isNew ? '' : 'disabled'}>
          </div>
          <div class="field">
            <label>LINE URL <span style="color:var(--text-muted); font-weight:400">(任意)</span></label>
            <input type="url" id="m-url" value="${esc(g?.url||'')}" placeholder="https://line.me/ti/g/xxxxxxxx">
            <div class="hint">
              LINE アプリ → 対象グループ → 右上「≡」→ 招待 → リンクをコピー<br>
              空欄なら「未設定」で保存 (後から追加可)
            </div>
          </div>
          <div class="m-actions">
            <button class="btn" data-act="cancel">キャンセル</button>
            <button class="btn primary" data-act="save">保存</button>
          </div>
        </div>
      </div>`;
    $('modal-root').innerHTML = html;
    const root = $('modal-root').firstElementChild;
    const close = () => root.remove();
    root.querySelector('[data-act="cancel"]').onclick = close;
    root.addEventListener('click', (e) => { if (e.target === root) close(); });
    root.querySelector('[data-act="save"]').onclick = async () => {
      const cat = $('m-cat').value;
      const name = $('m-name').value.trim();
      const url = $('m-url').value.trim();
      if (!name) { toast('グループ名は必須です', true); return; }
      if (url && !/^https?:\/\//.test(url)) { toast('URL は http(s):// で始めてください', true); return; }
      try {
        if (isNew) {
          const maxSort = Math.max(0, ...allGroups.filter(x=>x.category===cat).map(x=>x.sort_order||0));
          const { error } = await sb.from('line_groups').insert({
            category: cat, name, url: url || null, sort_order: maxSort + 10, is_active: true
          });
          if (error) throw error;
          toast('追加しました');
        } else {
          const { error } = await sb.from('line_groups').update({ url: url || null }).eq('id', g.id);
          if (error) throw error;
          toast('保存しました');
        }
        close();
        await load();
      } catch(e){
        toast('保存失敗: ' + (e.message||e), true);
      }
    };
    setTimeout(() => (isNew ? $('m-name') : $('m-url')).focus(), 60);
  }

  function openBulkModal(){
    const sample = '店舗\tにじいろ\thttps://line.me/ti/g/xxx\n店舗\t新店\n単独\t会議室\thttps://line.me/ti/g/yyy';
    const html = `
      <div class="backdrop">
        <div class="modal">
          <h3>📋 複数一括追加</h3>
          <div class="field">
            <label>1行 = 1グループ (タブ or | 区切り)</label>
            <textarea id="m-bulk" placeholder="${esc(sample)}"></textarea>
            <div class="hint">
              形式: <code>カテゴリ ⇥ 名前 ⇥ URL(任意)</code><br>
              カテゴリ = <code>店舗</code> or <code>単独</code><br>
              Excel/スプレッドシートから 3列コピペ可
            </div>
          </div>
          <div class="m-actions">
            <button class="btn" data-act="cancel">キャンセル</button>
            <button class="btn primary" data-act="save">一括追加</button>
          </div>
        </div>
      </div>`;
    $('modal-root').innerHTML = html;
    const root = $('modal-root').firstElementChild;
    const close = () => root.remove();
    root.querySelector('[data-act="cancel"]').onclick = close;
    root.addEventListener('click', (e) => { if (e.target === root) close(); });
    root.querySelector('[data-act="save"]').onclick = async () => {
      const raw = $('m-bulk').value;
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (!lines.length) { toast('内容を入力してください', true); return; }
      const parsed = [];
      const errors = [];
      lines.forEach((line, i) => {
        const parts = line.split(/[\t|]/).map(s => s.trim());
        if (parts.length < 2) { errors.push(`行${i+1}: 区切り不足`); return; }
        const [catRaw, name, urlRaw] = parts;
        const cat = /^(店舗|store)$/i.test(catRaw) ? 'store'
                  : /^(単独|solo)$/i.test(catRaw) ? 'solo' : null;
        if (!cat) { errors.push(`行${i+1}: カテゴリ不正 (${catRaw})`); return; }
        if (!name) { errors.push(`行${i+1}: 名前が空`); return; }
        const url = (urlRaw||'').trim();
        if (url && !/^https?:\/\//.test(url)) { errors.push(`行${i+1}: URL 形式不正`); return; }
        parsed.push({ category: cat, name, url: url || null });
      });
      if (errors.length) { toast('入力エラー: ' + errors[0], true); return; }
      if (!parsed.length) { toast('有効な行がありません', true); return; }
      const maxs = { store: 0, solo: 0 };
      allGroups.forEach(g => { if ((g.sort_order||0) > maxs[g.category]) maxs[g.category] = g.sort_order||0; });
      const payload = parsed.map(p => ({
        ...p,
        sort_order: (maxs[p.category] += 10),
        is_active: true
      }));
      try {
        const { error } = await sb.from('line_groups').insert(payload);
        if (error) throw error;
        toast(`${payload.length}件 追加しました`);
        close();
        await load();
      } catch(e){
        toast('一括追加失敗: ' + (e.message||e), true);
      }
    };
    setTimeout(() => $('m-bulk').focus(), 60);
  }

  async function deleteGroup(g){
    if (!confirm(`「${g.name}」を削除しますか？\n(この操作は取り消せません)`)) return;
    try {
      const { error } = await sb.from('line_groups').delete().eq('id', g.id);
      if (error) throw error;
      toast('削除しました');
      await load();
    } catch(e){
      toast('削除失敗: ' + (e.message||e), true);
    }
  }

  load();
})();
</script>
