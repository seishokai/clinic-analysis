<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06C755">
<title>LINE グループ / Aladdin 営業ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<style>
  :root{
    --line:#06C755;
    --line-d:#05a848;
    --line-l:#e6f9ef;
    --bg:#f5f5f5;
    --card:#fff;
    --border:#e5e7eb;
    --text:#1a1a1a;
    --text-sub:#6b7280;
    --text-muted:#9ca3af;
    --gray:#e5e7eb;
    --danger:#dc2626;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    font-family:'Noto Sans JP','Hiragino Sans','Meiryo',sans-serif;
    background:var(--bg); color:var(--text);
    line-height:1.4; -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  [hidden]{display:none !important}

  /* ヘッダー */
  header.head{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,#06C755 0%,#05a848 100%);
    color:#fff; padding:12px 14px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 8px rgba(6,199,85,.25);
  }
  .head .back{
    color:rgba(255,255,255,.9); text-decoration:none;
    font-size:13px; padding:5px 10px;
    border:1px solid rgba(255,255,255,.4); border-radius:16px;
    white-space:nowrap;
  }
  .head .back:active{background:rgba(255,255,255,.15)}
  .head .title-wrap{flex:1; text-align:center; min-width:0}
  .head h1{
    margin:0; font-size:16px; font-weight:800; letter-spacing:.5px;
    line-height:1.1;
  }
  .head .sub{font-size:10px; opacity:.85; margin-top:2px}
  .head .auth-btn{
    color:#fff; background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.4); border-radius:16px;
    padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit;
    font-weight:600; white-space:nowrap;
  }
  .head .auth-btn:active{background:rgba(255,255,255,.25)}
  .head .auth-btn.is-admin{background:#fff; color:var(--line-d); font-weight:700}

  /* タブ切替 */
  .tabs{
    display:flex; gap:0; background:#fff; padding:0;
    position:sticky; top:52px; z-index:10;
    border-bottom:1px solid var(--border);
    box-shadow:0 1px 3px rgba(0,0,0,.03);
  }
  .tab{
    flex:1; padding:14px 8px; text-align:center;
    background:transparent; border:none; border-bottom:3px solid transparent;
    font-size:14px; font-weight:700; color:var(--text-sub);
    cursor:pointer; font-family:inherit;
    transition:color .15s, border-color .15s;
  }
  .tab.active{color:var(--line); border-bottom-color:var(--line)}
  .tab .cnt{
    display:inline-block; background:var(--bg); color:var(--text-sub);
    font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px;
    margin-left:6px;
  }
  .tab.active .cnt{background:var(--line-l); color:var(--line-d)}

  /* 検索バー */
  .filter-bar{
    background:#fff; padding:10px 12px;
    border-bottom:1px solid var(--border);
    display:flex; gap:8px; align-items:center;
    position:sticky; top:104px; z-index:9;
  }
  .search-box{
    flex:1; position:relative;
  }
  .search-box input{
    width:100%; padding:8px 12px 8px 32px;
    border:1px solid var(--border); border-radius:20px;
    font-size:13px; font-family:inherit;
    background:var(--bg);
  }
  .search-box input:focus{
    outline:none; border-color:var(--line); background:#fff;
    box-shadow:0 0 0 3px rgba(6,199,85,.1);
  }
  .search-box::before{
    content:'🔍'; position:absolute; left:10px; top:50%;
    transform:translateY(-50%); font-size:12px; opacity:.5;
  }
  .filter-bar .add-btn{
    background:var(--line); color:#fff; border:none;
    padding:8px 12px; border-radius:20px;
    font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;
    white-space:nowrap;
  }
  .filter-bar .add-btn:active{background:var(--line-d)}
  .filter-bar .add-btn.bulk{background:#fff; color:var(--line-d); border:1px solid var(--line)}

  /* コンテンツ */
  .wrap{max-width:900px; margin:0 auto; padding:12px}

  /* カードグリッド */
  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
  }
  @media (min-width:640px){ .grid{grid-template-columns:repeat(3, 1fr); gap:12px} }
  @media (min-width:900px){ .grid{grid-template-columns:repeat(4, 1fr)} }

  .card{
    background:#fff; border-radius:14px;
    padding:14px 12px; text-align:center;
    text-decoration:none; color:inherit;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    border:1.5px solid transparent;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; gap:10px;
    min-height:120px;
    transition:transform .1s, box-shadow .15s, border-color .15s;
  }
  .card.active{
    border-color:var(--line);
  }
  .card.active:active{
    transform:scale(.97);
    box-shadow:0 4px 12px rgba(6,199,85,.2);
  }
  .card.inactive{background:#fafafa; border-color:var(--gray)}
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg,var(--line) 0%,var(--line-d) 100%);
    opacity:0;
  }
  .card.active::before{opacity:1}

  .card .name{
    font-size:14px; font-weight:700; color:var(--text);
    line-height:1.3; margin-top:4px;
    word-break:break-word;
  }
  .card.inactive .name{color:var(--text-sub); font-weight:500}

  .card .status{
    margin-top:auto; font-size:11px; font-weight:700;
    letter-spacing:.5px;
  }
  .card.active .status{color:var(--line-d)}
  .card.inactive .status{color:var(--text-muted)}

  .card .status .arrow{margin-left:3px; font-size:12px}

  /* 管理者用 - カード右上 */
  .card-menu{
    position:absolute; top:6px; right:6px;
    display:none; gap:2px;
  }
  .card.is-admin-view .card-menu{display:flex}
  .card-menu button{
    background:rgba(255,255,255,.9); border:1px solid var(--border);
    width:26px; height:26px; border-radius:50%;
    font-size:12px; cursor:pointer; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--text-sub);
  }
  .card-menu button:active{background:var(--bg)}
  .card-menu button.danger:active{background:#fef2f2; color:var(--danger)}

  /* ローディング/空 */
  .loading, .empty, .error{
    grid-column:1/-1; padding:36px 20px;
    text-align:center; color:var(--text-sub); font-size:13px;
  }
  .error{color:var(--danger); background:#fef2f2; border-radius:12px}
  .empty{background:#fff; border-radius:12px}
  .empty-hint{margin-top:8px; font-size:11px; color:var(--text-muted)}

  /* Modal */
  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
    padding:16px; z-index:200;
    animation:fadein .15s;
  }
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff; border-radius:14px; padding:20px;
    max-width:460px; width:100%; max-height:90vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    animation:slideup .2s;
  }
  @keyframes slideup{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h3{margin:0 0 14px; font-size:16px; font-weight:800; color:#1a1a1a}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:11px; font-weight:600; color:var(--text-sub); margin-bottom:5px}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px;
    border:1px solid var(--border); border-radius:8px;
    font-size:14px; font-family:inherit; box-sizing:border-box;
    background:#fff;
  }
  .field textarea{
    resize:vertical; min-height:130px; line-height:1.5;
    font-family:'SF Mono','Consolas',monospace; font-size:12px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--line);
    box-shadow:0 0 0 3px rgba(6,199,85,.15);
  }
  .field input:disabled, .field select:disabled{background:#fafafa; color:var(--text-sub)}
  .m-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap}
  .btn{
    padding:10px 20px; font-size:14px; font-weight:700;
    border-radius:8px; cursor:pointer; font-family:inherit;
    border:1px solid var(--border); background:#fff; color:var(--text);
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--line); color:#fff; border-color:var(--line)}
  .btn.primary:active{background:var(--line-d)}
  .btn:disabled{opacity:.5; cursor:not-allowed}

  .hint{
    font-size:11px; color:var(--text-sub);
    background:var(--bg); border-radius:6px; padding:8px 10px;
    margin-top:6px; line-height:1.6;
  }
  .hint code{background:#fff; padding:1px 5px; border-radius:3px; font-family:'SF Mono',monospace; font-size:11px}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#1a1a1a; color:#fff; padding:12px 20px; border-radius:24px;
    font-size:13px; font-weight:700; z-index:1000;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
    animation:slideuptoast .25s; max-width:90vw; text-align:center;
  }
  .toast.error{background:var(--danger)}
  @keyframes slideuptoast{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

  @media (max-width:400px){
    .head h1{font-size:14px}
    .head .back, .head .auth-btn{font-size:11px; padding:4px 8px}
    .filter-bar{padding:8px 10px}
    .card{padding:12px 8px; min-height:100px}
    .card .name{font-size:13px}
  }
</style>
</head>
<body>

<header class="head">
  <a class="back" href="/clinic-analysis/sales/">← 戻る</a>
  <div class="title-wrap">
    <h1>💬 LINE グループ</h1>
    <div class="sub" id="head-sub">読み込み中…</div>
  </div>
  <span style="width:52px"></span>
</header>

<div class="tabs">
  <button class="tab active" data-cat="store">🏥 店舗<span class="cnt" id="cnt-store">0</span></button>
  <button class="tab" data-cat="solo">🎯 単独<span class="cnt" id="cnt-solo">0</span></button>
</div>

<div class="filter-bar">
  <div class="search-box">
    <input type="text" id="search" placeholder="グループ名で検索…">
  </div>
  <button class="add-btn" id="add-btn">＋ 追加</button>
  <button class="add-btn bulk" id="bulk-btn">📋 一括</button>
</div>

<div class="wrap">
  <div class="grid" id="grid">
    <div class="loading">読み込み中…</div>
  </div>
</div>

<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';
  const SUPABASE_URL = 'https://ndlfqrvoejwgqfdtghmg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kbGZxcnZvZWp3Z3FmZHRnaG1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1ODIxNjcsImV4cCI6MjA5MTE1ODE2N30.pE-l-4NgQTpEb9DvjeRptargvrsYH9YKyRLt06flPik';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let allGroups = [];
  let currentCat = 'store';
  let searchQ = '';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast = (msg, err=false) => {
    const el = document.createElement('div');
    el.className = 'toast' + (err ? ' error' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  };

  // ---- タブ ----
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      currentCat = t.dataset.cat;
      render();
    });
  });

  // ---- 検索 ----
  $('search').addEventListener('input', (e) => {
    searchQ = e.target.value.trim().toLowerCase();
    render();
  });

  // ---- データ ----
  async function load(){
    try {
      const { data, error } = await sb.from('line_groups')
        .select('*')
        .eq('is_active', true)
        .order('category', { ascending: true })
        .order('sort_order', { ascending: true })
        .order('created_at', { ascending: true });
      if (error) throw error;
      allGroups = data || [];
      const storeCount = allGroups.filter(g => g.category === 'store').length;
      const soloCount = allGroups.filter(g => g.category === 'solo').length;
      $('cnt-store').textContent = storeCount;
      $('cnt-solo').textContent = soloCount;
      $('head-sub').textContent = `店舗 ${storeCount} + 単独 ${soloCount}`;
    } catch(e){
      console.error('load failed', e);
      $('grid').innerHTML = `<div class="error">読み込み失敗: ${esc(e.message||e)}<br><small style="opacity:.7">line_groups テーブル未作成の可能性</small></div>`;
      $('head-sub').textContent = 'エラー';
      return;
    }
    render();
  }

  function render(){
    const rows = allGroups.filter(g => g.category === currentCat)
      .filter(g => !searchQ || g.name.toLowerCase().includes(searchQ));
    const grid = $('grid');
    if (!rows.length) {
      const isSearch = !!searchQ;
      grid.innerHTML = `<div class="empty">
        ${isSearch ? '「'+esc(searchQ)+'」に一致するグループがありません' : 'まだ登録がありません'}
        ${!isSearch ? '<div class="empty-hint">上の「＋ 追加」または「📋 一括」から登録できます</div>' : ''}
      </div>`;
      return;
    }
    grid.innerHTML = rows.map(g => {
      const hasUrl = !!(g.url && g.url.trim());
      const cls = 'card ' + (hasUrl ? 'active' : 'inactive') + ' is-admin-view';
      const tag = hasUrl ? 'a' : 'div';
      const attrs = hasUrl
        ? `href="${esc(g.url)}" target="_blank" rel="noopener noreferrer"`
        : '';
      const status = hasUrl
        ? `<span class="status">開く<span class="arrow">→</span></span>`
        : `<span class="status">未設定</span>`;
      const menu = `
        <div class="card-menu">
          <button data-act="edit" data-id="${g.id}" title="URL 編集">✏️</button>
          <button class="danger" data-act="delete" data-id="${g.id}" title="削除">🗑</button>
        </div>`;
      return `<${tag} class="${cls}" ${attrs}>
        ${menu}
        <div class="name">${esc(g.name)}</div>
        ${status}
      </${tag}>`;
    }).join('');
    // Admin actions
    grid.querySelectorAll('.card-menu button').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const id = b.dataset.id;
        const g = allGroups.find(x => x.id === id);
        if (!g) return;
        if (b.dataset.act === 'edit') openEditModal(g);
        else if (b.dataset.act === 'delete') deleteGroup(g);
      });
    });
  }

  // ---- 追加 ----
  $('add-btn').addEventListener('click', () => openEditModal(null));
  $('bulk-btn').addEventListener('click', () => openBulkModal());

  function openEditModal(g){
    const isNew = !g;
    const html = `
      <div class="backdrop">
        <div class="modal">
          <h3>${isNew ? '＋ 新規追加' : '✏️ URL 編集'}</h3>
          <div class="field">
            <label>カテゴリ</label>
            <select id="m-cat" ${isNew ? '' : 'disabled'}>
              <option value="store"${(g?.category==='store'||(isNew&&currentCat==='store'))?' selected':''}>🏥 店舗グループ</option>
              <option value="solo"${(g?.category==='solo'||(isNew&&currentCat==='solo'))?' selected':''}>🎯 単独グループ</option>
            </select>
          </div>
          <div class="field">
            <label>グループ名 <span style="color:#dc2626">*</span></label>
            <input type="text" id="m-name" value="${esc(g?.name||'')}" placeholder="例: エスカ" ${isNew ? '' : 'disabled'}>
          </div>
          <div class="field">
            <label>LINE URL <span style="color:var(--text-muted); font-weight:400">(任意)</span></label>
            <input type="url" id="m-url" value="${esc(g?.url||'')}" placeholder="https://line.me/ti/g/xxxxxxxx">
            <div class="hint">
              LINE アプリ → 対象グループ → 右上「≡」→ 招待 → リンクをコピー<br>
              空欄なら「未設定」で保存 (後から追加可)
            </div>
          </div>
          <div class="m-actions">
            <button class="btn" data-act="cancel">キャンセル</button>
            <button class="btn primary" data-act="save">保存</button>
          </div>
        </div>
      </div>`;
    $('modal-root').innerHTML = html;
    const root = $('modal-root').firstElementChild;
    const close = () => root.remove();
    root.querySelector('[data-act="cancel"]').onclick = close;
    root.addEventListener('click', (e) => { if (e.target === root) close(); });
    root.querySelector('[data-act="save"]').onclick = async () => {
      const cat = $('m-cat').value;
      const name = $('m-name').value.trim();
      const url = $('m-url').value.trim();
      if (!name) { toast('グループ名は必須です', true); return; }
      if (url && !/^https?:\/\//.test(url)) { toast('URL は http(s):// で始めてください', true); return; }
      try {
        if (isNew) {
          const maxSort = Math.max(0, ...allGroups.filter(x=>x.category===cat).map(x=>x.sort_order||0));
          const { error } = await sb.from('line_groups').insert({
            category: cat, name, url: url || null, sort_order: maxSort + 10, is_active: true
          });
          if (error) throw error;
          toast('追加しました');
        } else {
          const { error } = await sb.from('line_groups').update({ url: url || null }).eq('id', g.id);
          if (error) throw error;
          toast('保存しました');
        }
        close();
        await load();
      } catch(e){
        toast('保存失敗: ' + (e.message||e), true);
      }
    };
    setTimeout(() => (isNew ? $('m-name') : $('m-url')).focus(), 60);
  }

  function openBulkModal(){
    const sample = '店舗\tにじいろ\thttps://line.me/ti/g/xxx\n店舗\t新店\n単独\t会議室\thttps://line.me/ti/g/yyy';
    const html = `
      <div class="backdrop">
        <div class="modal">
          <h3>📋 複数一括追加</h3>
          <div class="field">
            <label>1行 = 1グループ (タブ or | 区切り)</label>
            <textarea id="m-bulk" placeholder="${esc(sample)}"></textarea>
            <div class="hint">
              形式: <code>カテゴリ ⇥ 名前 ⇥ URL(任意)</code><br>
              カテゴリ = <code>店舗</code> or <code>単独</code><br>
              Excel/スプレッドシートから 3列コピペ可
            </div>
          </div>
          <div class="m-actions">
            <button class="btn" data-act="cancel">キャンセル</button>
            <button class="btn primary" data-act="save">一括追加</button>
          </div>
        </div>
      </div>`;
    $('modal-root').innerHTML = html;
    const root = $('modal-root').firstElementChild;
    const close = () => root.remove();
    root.querySelector('[data-act="cancel"]').onclick = close;
    root.addEventListener('click', (e) => { if (e.target === root) close(); });
    root.querySelector('[data-act="save"]').onclick = async () => {
      const raw = $('m-bulk').value;
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (!lines.length) { toast('内容を入力してください', true); return; }
      const parsed = [];
      const errors = [];
      lines.forEach((line, i) => {
        const parts = line.split(/[\t|]/).map(s => s.trim());
        if (parts.length < 2) { errors.push(`行${i+1}: 区切り不足`); return; }
        const [catRaw, name, urlRaw] = parts;
        const cat = /^(店舗|store)$/i.test(catRaw) ? 'store'
                  : /^(単独|solo)$/i.test(catRaw) ? 'solo' : null;
        if (!cat) { errors.push(`行${i+1}: カテゴリ不正 (${catRaw})`); return; }
        if (!name) { errors.push(`行${i+1}: 名前が空`); return; }
        const url = (urlRaw||'').trim();
        if (url && !/^https?:\/\//.test(url)) { errors.push(`行${i+1}: URL 形式不正`); return; }
        parsed.push({ category: cat, name, url: url || null });
      });
      if (errors.length) { toast('入力エラー: ' + errors[0], true); return; }
      if (!parsed.length) { toast('有効な行がありません', true); return; }
      const maxs = { store: 0, solo: 0 };
      allGroups.forEach(g => { if ((g.sort_order||0) > maxs[g.category]) maxs[g.category] = g.sort_order||0; });
      const payload = parsed.map(p => ({
        ...p,
        sort_order: (maxs[p.category] += 10),
        is_active: true
      }));
      try {
        const { error } = await sb.from('line_groups').insert(payload);
        if (error) throw error;
        toast(`${payload.length}件 追加しました`);
        close();
        await load();
      } catch(e){
        toast('一括追加失敗: ' + (e.message||e), true);
      }
    };
    setTimeout(() => $('m-bulk').focus(), 60);
  }

  async function deleteGroup(g){
    if (!confirm(`「${g.name}」を削除しますか？\n(この操作は取り消せません)`)) return;
    try {
      const { error } = await sb.from('line_groups').delete().eq('id', g.id);
      if (error) throw error;
      toast('削除しました');
      await load();
    } catch(e){
      toast('削除失敗: ' + (e.message||e), true);
    }
  }

  load();
})();
</script>

</body>
</html>
