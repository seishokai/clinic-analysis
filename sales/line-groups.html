<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f172a">
<title>LINE グループ / Aladdin 営業ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#f4f5f7;
    --surface:#fff;
    --line:#06C755;
    --line-soft:#E6F9EE;
    --line-shadow:rgba(6,199,85,.18);
    --line-dark:#04A548;
    --text:#0f172a;
    --text-sub:#64748b;
    --text-muted:#94a3b8;
    --border:#e5e7eb;
    --border-strong:#cbd5e1;
    --dash:#c1c8d1;
    --hatch:#eef1f5;
    --danger:#dc2626;
    --danger-soft:#fef2f2;
    --focus:rgba(6,199,85,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0}
  html,body{background:var(--bg)}
  body{
    font-family:'Noto Sans JP','Hiragino Sans','Meiryo',sans-serif;
    color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:88px;
    min-height:100vh;
  }
  [hidden]{display:none !important}
  button{font-family:inherit}
  a{color:inherit}

  /* ヘッダー */
  header.head{
    position:sticky; top:0; z-index:20;
    background:#0f172a;
    color:#fff; padding:11px 14px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.18);
  }
  .head .back{
    color:#fff; text-decoration:none; font-size:12px;
    padding:6px 12px; border:1px solid rgba(255,255,255,.18);
    border-radius:999px; white-space:nowrap; opacity:.9;
    transition:background .15s, border-color .15s;
  }
  .head .back:hover{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.32)}
  .head .title-wrap{flex:1; text-align:center; min-width:0}
  .head h1{
    margin:0; font-size:15px; font-weight:800; letter-spacing:.5px;
    display:inline-flex; align-items:center; gap:6px; justify-content:center;
  }
  .head h1 .line-tag{
    display:inline-flex; align-items:center; justify-content:center;
    padding:2px 8px; border-radius:6px;
    background:var(--line); color:#fff; font-size:10px;
    font-weight:800; letter-spacing:.5px;
  }
  .head .sub{font-size:10px; opacity:.6; margin-top:2px; letter-spacing:.4px}
  .head .edit-toggle{
    color:#fff; font-family:inherit;
    background:transparent; border:1px solid rgba(255,255,255,.22);
    padding:6px 12px; border-radius:999px; font-size:12px;
    font-weight:700; cursor:pointer; white-space:nowrap;
    transition:all .15s;
    display:inline-flex; align-items:center; gap:4px;
  }
  .head .edit-toggle:hover{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.36)}
  body.edit-mode .head #edit-toggle,
  body.select-mode .head #select-toggle{background:var(--line); border-color:var(--line); color:#fff}
  body.edit-mode .head #edit-toggle:hover,
  body.select-mode .head #select-toggle:hover{background:var(--line-dark); border-color:var(--line-dark)}
  /* 選択モード中は編集ボタンは隠す (逆も同様) */
  body.select-mode .head #edit-toggle,
  body.edit-mode .head #select-toggle{display:none}

  /* コンテナ */
  .container{max-width:1100px; margin:0 auto; padding:12px 12px 20px}

  /* ツールバー */
  .toolbar{
    display:flex; gap:8px; align-items:center;
    margin-bottom:10px;
  }
  .search-box{flex:1; min-width:0; position:relative}
  .search-box input{
    width:100%; padding:11px 14px 11px 38px;
    border:1px solid var(--border); border-radius:999px;
    font-size:14px; font-family:inherit; background:#fff;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-box input:focus{
    outline:none; border-color:var(--line);
    box-shadow:0 0 0 4px var(--focus);
  }
  .search-box::before{
    content:'🔍'; position:absolute; left:14px; top:50%;
    transform:translateY(-50%); font-size:13px; opacity:.5;
  }

  /* 編集モード時のみのツール */
  .edit-tools{
    display:none; gap:8px; flex-wrap:wrap;
    margin-bottom:12px;
  }
  body.edit-mode .edit-tools, body.select-mode .edit-tools{display:flex}
  /* 選択モードでは「追加/一括」は不要、「全選択」だけ出す */
  body.select-mode #add-btn, body.select-mode #bulk-btn{display:none}
  .edit-tools .btn{
    padding:9px 14px; border-radius:999px; font-size:12px;
    font-weight:700; cursor:pointer; border:1px solid var(--border);
    background:#fff; color:var(--text);
    transition:all .15s;
    display:inline-flex; align-items:center; gap:6px;
  }
  .edit-tools .btn:hover{border-color:var(--border-strong); background:#fafbfc}
  .edit-tools .btn.primary{background:var(--line); color:#fff; border-color:var(--line)}
  .edit-tools .btn.primary:hover{background:var(--line-dark); border-color:var(--line-dark)}

  /* セクション */
  .section{margin-bottom:16px}
  .section-title{
    display:flex; align-items:center; gap:10px;
    font-size:11px; font-weight:800; letter-spacing:1.6px;
    color:var(--text-sub); text-transform:uppercase;
    margin:0 2px 8px;
  }
  .section-title .cnt{
    color:var(--text-muted); font-size:10px; letter-spacing:1px;
    background:var(--surface); padding:2px 8px; border-radius:999px;
    border:1px solid var(--border);
  }
  .section-title .rule{
    flex:1; height:1px; background:linear-gradient(90deg,var(--border),transparent);
  }

  /* グリッド */
  .grid{
    display:grid; gap:8px;
    grid-template-columns:1fr 1fr;
  }
  @media (min-width:560px){
    .grid{grid-template-columns:repeat(3, 1fr); gap:10px}
  }

  /* タイル */
  .tile{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 12px;
    display:flex; align-items:center; gap:11px;
    cursor:pointer;
    text-decoration:none; color:inherit;
    transition:transform .22s cubic-bezier(.2,.8,.2,1),
               box-shadow .22s cubic-bezier(.2,.8,.2,1),
               border-color .18s;
    overflow:hidden;
    min-height:60px;
  }
  .tile::before{
    content:''; position:absolute; left:0; top:10px; bottom:10px;
    width:3px; border-radius:2px; background:var(--line);
    transform:scaleY(0); transform-origin:center;
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .tile:hover:not(.unset):not(.editing){
    transform:translateY(-3px);
    box-shadow:0 12px 26px -14px var(--line-shadow),
               0 2px 8px rgba(15,23,42,.05);
    border-color:transparent;
  }
  .tile:hover:not(.unset):not(.editing)::before{transform:scaleY(1)}
  .tile:active:not(.unset):not(.editing){transform:translateY(-1px)}

  /* Monogram */
  .mono{
    width:38px; height:38px; flex-shrink:0;
    border-radius:10px;
    background:var(--line-soft);
    color:var(--line-dark);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:800; letter-spacing:.5px;
    line-height:1;
    transition:background .22s, color .22s;
  }
  .tile:hover:not(.unset):not(.editing) .mono{
    background:var(--line); color:#fff;
  }

  /* 本文 */
  .body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .name{
    font-size:14px; font-weight:700; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tap-label{
    font-size:10px; font-weight:700; color:var(--text-sub);
    letter-spacing:.6px; text-transform:uppercase;
    display:inline-flex; align-items:center; gap:6px;
  }
  .tap-label::before{
    content:''; width:6px; height:6px; border-radius:50%;
    background:var(--line);
    box-shadow:0 0 0 3px var(--line-soft);
  }

  /* シェブロン */
  .chev{
    flex-shrink:0; color:var(--text-muted);
    font-size:22px; line-height:1; opacity:.55;
    font-weight:400;
    transition:transform .2s, opacity .2s, color .2s;
  }
  .tile:hover:not(.unset):not(.editing) .chev{
    opacity:1; color:var(--line); transform:translateX(3px);
  }

  /* 未設定 (view mode) */
  .tile.unset{
    cursor:default;
    border-style:dashed; border-color:var(--dash);
    background:
      repeating-linear-gradient(135deg,
        var(--hatch) 0 6px, transparent 6px 12px),
      var(--surface);
  }
  .tile.unset .mono{
    background:transparent; color:var(--text-muted);
    border:1.5px dashed var(--dash);
  }
  .tile.unset .name{color:var(--text-sub); font-weight:600}
  .tile.unset .tap-label{color:var(--text-muted)}
  .tile.unset .tap-label::before{
    background:transparent; border:1.5px dashed var(--text-muted);
    width:8px; height:8px; box-shadow:none;
  }
  .tile.unset .chev{display:none}

  /* 選択モード: タイル全体タップで選択 (URL は開かない) */
  body.select-mode .tile{
    cursor:pointer;
    padding-right:38px;
  }
  body.select-mode .tile:hover:not(.unset){
    transform:translateY(-2px);
    box-shadow:0 8px 20px -12px var(--line-shadow), 0 1px 4px rgba(15,23,42,.04);
    border-color:var(--line-soft);
  }
  body.select-mode .tile.unset{
    cursor:pointer;
    border-style:solid; border-color:var(--border);
    background:var(--surface);
  }
  body.select-mode .tile.unset .mono{
    background:var(--line-soft); color:var(--line-dark);
    border:none;
  }
  body.select-mode .tile.unset .name{color:var(--text); font-weight:700}
  body.select-mode .tile .chev{display:none}
  /* 右上のミニチェックボックス */
  body.select-mode .tile .sel-mark{
    position:absolute; top:9px; right:10px;
    width:20px; height:20px; border-radius:6px;
    border:1.5px solid var(--border-strong);
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:12px; font-weight:800; line-height:1;
    transition:all .15s;
    pointer-events:none;
  }
  body.select-mode .tile.selected{
    border-color:var(--line);
    box-shadow:0 0 0 3px var(--focus);
  }
  body.select-mode .tile.selected .sel-mark{
    background:var(--line); border-color:var(--line);
  }
  body.select-mode .tile.selected .sel-mark::after{content:'✓'}

  /* 編集モード用タイル */
  body.edit-mode .tile{
    cursor:default;
    padding:12px 14px;
    align-items:flex-start;
    min-height:0;
  }
  body.edit-mode .tile:hover{
    transform:none; box-shadow:none; border-color:var(--border);
  }
  body.edit-mode .tile::before{display:none}
  body.edit-mode .tile.selected{
    border-color:var(--line);
    box-shadow:0 0 0 3px var(--focus);
  }
  /* 編集モードでは未設定タイルもハッチング解除 */
  body.edit-mode .tile.unset{
    background:var(--surface);
    border-style:solid; border-color:var(--border);
  }
  body.edit-mode .tile.unset .mono{
    background:var(--line-soft); color:var(--line-dark);
    border:none;
  }
  body.edit-mode .tile.unset .name{color:var(--text); font-weight:700}

  body.edit-mode .tile .mono{
    width:38px; height:38px; font-size:15px; border-radius:10px;
  }

  .edit-inner{
    display:flex; flex-direction:column; gap:8px;
    flex:1; min-width:0;
  }
  .edit-topline{
    display:flex; align-items:center; gap:8px;
  }
  .edit-topline .name{
    flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .drag-handle{
    width:26px; height:26px; border-radius:6px;
    background:transparent; border:1px solid var(--border);
    color:var(--text-muted); cursor:grab;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; padding:0; flex-shrink:0;
    letter-spacing:-2px;
    transition:all .15s;
  }
  .drag-handle:hover{color:var(--text); border-color:var(--border-strong)}
  .drag-handle:active{cursor:grabbing; background:var(--line-soft); color:var(--line); border-color:var(--line)}
  .chkbox{
    width:22px; height:22px; border-radius:6px;
    border:1.5px solid var(--border-strong);
    background:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-size:13px; color:#fff; font-weight:800;
    transition:all .15s;
  }
  .tile.selected .chkbox{
    background:var(--line); border-color:var(--line);
  }
  .tile.selected .chkbox::after{content:'✓'}

  .edit-url-row input{
    width:100%; padding:8px 10px;
    border:1px solid var(--border); border-radius:8px;
    font-size:12px; font-family:'SF Mono','Consolas',monospace;
    background:#fff; min-width:0;
    transition:border-color .15s, box-shadow .15s;
  }
  .edit-url-row input:focus{
    outline:none; border-color:var(--line);
    box-shadow:0 0 0 3px var(--focus);
  }
  .edit-url-row input.dirty{
    border-color:#f59e0b;
    background:#fffbeb;
  }
  .edit-actions{
    display:flex; gap:6px;
    justify-content:flex-end;
  }
  .edit-actions button{
    padding:6px 10px; border-radius:7px; font-size:11px; font-weight:700;
    border:1px solid var(--border); background:#fff; color:var(--text);
    cursor:pointer;
    transition:all .15s;
    display:inline-flex; align-items:center; gap:4px;
  }
  .edit-actions button.save{background:var(--line); color:#fff; border-color:var(--line)}
  .edit-actions button.save:hover{background:var(--line-dark); border-color:var(--line-dark)}
  .edit-actions button.delete{color:var(--danger); border-color:#fecaca; background:#fff}
  .edit-actions button.delete:hover{background:var(--danger-soft)}

  /* Sortable states */
  .sortable-ghost{opacity:.35; background:var(--line-soft) !important}
  .sortable-chosen{transform:scale(1.02)}
  .sortable-drag{box-shadow:0 16px 32px rgba(15,23,42,.18) !important}

  /* Loading / empty */
  .status{
    padding:60px 20px; text-align:center;
    color:var(--text-sub); font-size:14px;
    background:var(--surface); border-radius:14px;
    border:1px solid var(--border);
  }
  .status.error{color:var(--danger); background:var(--danger-soft); border-color:#fecaca}
  .status-hint{margin-top:10px; font-size:12px; color:var(--text-muted)}

  /* Fixed bottom selection bar */
  .sel-bar{
    position:fixed; bottom:14px; left:14px; right:14px;
    max-width:560px; margin:0 auto;
    background:#0f172a; color:#fff;
    padding:11px 14px; z-index:30;
    border-radius:999px;
    box-shadow:0 20px 40px -10px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:10px;
    animation:slideupbar .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideupbar{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sel-bar .cnt{flex:1; font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:8px}
  .sel-bar .cnt .num{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--line); color:#fff;
    min-width:26px; height:26px; padding:0 9px; border-radius:13px;
    font-size:12px; font-weight:800;
  }
  .sel-bar button{
    padding:8px 14px; border-radius:999px; font-size:12px;
    font-weight:800; cursor:pointer; border:none;
  }
  .sel-bar .btn-clear{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.28)}
  .sel-bar .btn-clear:hover{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.4)}
  .sel-bar .btn-issue{background:var(--line); color:#fff; letter-spacing:.4px}
  .sel-bar .btn-issue:hover{background:var(--line-dark)}

  /* Modal */
  .backdrop{
    position:fixed; inset:0; background:rgba(15,23,42,.55);
    display:flex; align-items:center; justify-content:center;
    padding:16px; z-index:200; animation:fadein .15s;
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
  }
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff; border-radius:16px; padding:22px;
    max-width:540px; width:100%; max-height:90vh; overflow-y:auto;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    animation:slideup .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideup{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h3{margin:0 0 16px; font-size:17px; font-weight:800}
  .field{margin-bottom:14px}
  .field label{
    display:block; font-size:11px; font-weight:700;
    color:var(--text-sub); margin-bottom:6px; letter-spacing:.4px;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 13px;
    border:1px solid var(--border); border-radius:10px;
    font-size:14px; font-family:inherit; box-sizing:border-box;
    background:#fff;
    transition:border-color .15s, box-shadow .15s;
  }
  .field textarea{
    resize:vertical; min-height:120px; line-height:1.55;
    font-family:'SF Mono','Consolas',monospace; font-size:12px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--line);
    box-shadow:0 0 0 3px var(--focus);
  }
  .field input:disabled, .field select:disabled{background:#fafafa; color:var(--text-sub)}
  .m-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap}
  .btn{
    padding:10px 20px; font-size:14px; font-weight:700;
    border-radius:10px; cursor:pointer;
    border:1px solid var(--border); background:#fff; color:var(--text);
    transition:all .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--line); color:#fff; border-color:var(--line)}
  .btn.primary:hover{background:var(--line-dark); border-color:var(--line-dark)}

  .hint{
    font-size:11px; color:var(--text-sub);
    background:var(--bg); border-radius:8px; padding:9px 11px;
    margin-top:6px; line-height:1.6;
  }
  .hint code{background:#fff; padding:1px 5px; border-radius:4px; font-family:'SF Mono',monospace; font-size:11px}

  .fmt-tabs{
    display:flex; gap:4px; margin-bottom:12px;
    border-bottom:1px solid var(--border); padding-bottom:4px;
  }
  .fmt-tab{
    flex:1; padding:8px 6px; background:transparent; border:none;
    font-size:12px; font-weight:700; color:var(--text-sub);
    border-radius:8px 8px 0 0; cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .fmt-tab.active{color:var(--line); border-bottom-color:var(--line)}
  .issue-out{
    width:100%; min-height:180px; padding:12px;
    border:1px solid var(--border); border-radius:10px;
    background:#fafafa; font-size:12px; font-family:'SF Mono','Consolas',monospace;
    line-height:1.7; resize:vertical; box-sizing:border-box;
  }
  .fmt-info{font-size:11px; color:var(--text-sub); margin:6px 0 10px}

  .toast{
    position:fixed; bottom:82px; left:50%; transform:translateX(-50%);
    background:#0f172a; color:#fff; padding:12px 22px; border-radius:999px;
    font-size:13px; font-weight:700; z-index:1000;
    box-shadow:0 12px 30px rgba(0,0,0,.3);
    animation:slideuptoast .25s; max-width:90vw; text-align:center;
  }
  .toast.error{background:var(--danger)}
  @keyframes slideuptoast{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

  @media (max-width:420px){
    .container{padding:14px 12px}
    .head h1{font-size:14px}
    .tile{padding:12px; min-height:68px; gap:10px}
    .mono{width:40px; height:40px; font-size:16px}
    .name{font-size:13px}
    .tap-label{font-size:9px}
  }
</style>
</head>
<body>

<header class="head">
  <a class="back" href="/clinic-analysis/sales/">← 戻る</a>
  <div class="title-wrap">
    <h1><span class="line-tag">LINE</span> グループ</h1>
    <div class="sub" id="head-sub">読み込み中…</div>
  </div>
  <button class="edit-toggle" id="select-toggle" title="複数選択して URL 発行">☑ 選択</button>
  <button class="edit-toggle" id="edit-toggle">✏️ 編集</button>
</header>

<div class="container">
  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search" placeholder="グループ名で検索…">
    </div>
  </div>

  <div class="edit-tools" id="edit-tools">
    <button class="btn primary" id="add-btn">＋ 追加</button>
    <button class="btn" id="bulk-btn">📋 一括</button>
    <button class="btn" id="select-all-btn">☑ 全選択</button>
  </div>

  <div id="sections">
    <div class="status">読み込み中…</div>
  </div>
</div>

<div class="sel-bar" id="sel-bar" hidden>
  <div class="cnt"><span class="num" id="sel-num">0</span>件選択中</div>
  <button class="btn-clear" id="clear-sel">解除</button>
  <button class="btn-issue" id="issue-btn">📤 URL 発行</button>
</div>

<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
(function(){
  'use strict';
  const SUPABASE_URL = 'https://ndlfqrvoejwgqfdtghmg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kbGZxcnZvZWp3Z3FmZHRnaG1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1ODIxNjcsImV4cCI6MjA5MTE1ODE2N30.pE-l-4NgQTpEb9DvjeRptargvrsYH9YKyRLt06flPik';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let allGroups = [];
  let searchQ = '';
  const selected = new Set();
  let sortableInstances = [];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast = (msg, err=false) => {
    const el = document.createElement('div');
    el.className = 'toast' + (err ? ' error' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  };
  const isEditMode = () => document.body.classList.contains('edit-mode');
  const isSelectMode = () => document.body.classList.contains('select-mode');

  // 検索
  $('search').addEventListener('input', (e) => {
    searchQ = e.target.value.trim().toLowerCase();
    render();
  });

  // 編集モードトグル
  $('edit-toggle').addEventListener('click', () => {
    const nextEdit = !isEditMode();
    // 他モードは解除
    document.body.classList.remove('select-mode');
    $('select-toggle').innerHTML = '☑ 選択';
    document.body.classList.toggle('edit-mode', nextEdit);
    $('edit-toggle').innerHTML = nextEdit ? '✓ 完了' : '✏️ 編集';
    selected.clear();
    updateSelBar();
    destroySortable();
    render();
  });

  // 選択モードトグル
  $('select-toggle').addEventListener('click', () => {
    const nextSel = !isSelectMode();
    document.body.classList.remove('edit-mode');
    $('edit-toggle').innerHTML = '✏️ 編集';
    document.body.classList.toggle('select-mode', nextSel);
    $('select-toggle').innerHTML = nextSel ? '✓ 完了' : '☑ 選択';
    if (!nextSel) {
      selected.clear();
      updateSelBar();
    }
    destroySortable();
    render();
  });

  $('select-all-btn').addEventListener('click', () => {
    const visible = filteredGroups();
    const allSel = visible.length > 0 && visible.every(g => selected.has(g.id));
    if (allSel) visible.forEach(g => selected.delete(g.id));
    else visible.forEach(g => selected.add(g.id));
    updateSelBar();
    render();
  });

  $('clear-sel').addEventListener('click', () => {
    selected.clear();
    updateSelBar();
    render();
  });

  $('issue-btn').addEventListener('click', () => openIssueModal());
  $('add-btn').addEventListener('click', () => openEditModal(null));
  $('bulk-btn').addEventListener('click', () => openBulkModal());

  // -------- 並び替え --------
  function initSortable(){
    destroySortable();
    document.querySelectorAll('.grid').forEach(gridEl => {
      const inst = Sortable.create(gridEl, {
        animation: 160,
        handle: '.drag-handle',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        onEnd: onReorderEnd,
      });
      sortableInstances.push(inst);
    });
  }
  function destroySortable(){
    sortableInstances.forEach(s => s.destroy());
    sortableInstances = [];
  }

  async function onReorderEnd(){
    // DOM 順から新しい sort_order を計算 (セクション横断で通し番号)
    const allTiles = [...document.querySelectorAll('.section .tile[data-id]')];
    const updates = allTiles.map((t, i) => ({
      id: t.dataset.id,
      sort_order: (i + 1) * 10,
    }));
    try {
      const results = await Promise.all(updates.map(u =>
        sb.from('line_groups').update({ sort_order: u.sort_order }).eq('id', u.id)
      ));
      const errors = results.filter(r => r.error);
      if (errors.length) throw errors[0].error;
      updates.forEach(u => {
        const g = allGroups.find(x => x.id === u.id);
        if (g) g.sort_order = u.sort_order;
      });
      allGroups.sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
      toast('順番を保存しました');
    } catch(e){
      toast('並替保存失敗: ' + (e.message||e), true);
      console.error(e);
      await load();
    }
  }

  // -------- ロード --------
  async function load(){
    try {
      const { data, error } = await sb.from('line_groups')
        .select('*')
        .eq('is_active', true)
        .order('sort_order', { ascending: true })
        .order('created_at', { ascending: true });
      if (error) throw error;
      allGroups = data || [];
      $('head-sub').textContent = `${allGroups.length}件`;
      await autoRenumberIfNeeded();
    } catch(e){
      console.error('load failed', e);
      $('sections').innerHTML = `<div class="status error">読み込み失敗: ${esc(e.message||e)}<div class="status-hint">line_groups テーブル未作成の可能性</div></div>`;
      $('head-sub').textContent = 'エラー';
      return;
    }
    render();
  }

  async function autoRenumberIfNeeded(){
    const seen = new Set();
    let hasDup = false;
    for (const g of allGroups) {
      if (seen.has(g.sort_order)) { hasDup = true; break; }
      seen.add(g.sort_order);
    }
    if (!hasDup) return;
    const stores = allGroups.filter(g => g.category === 'store')
      .sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    const solos = allGroups.filter(g => g.category === 'solo')
      .sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    const combined = [...solos, ...stores];
    const updates = combined.map((g, i) => ({ id: g.id, sort_order: (i+1)*10 }));
    try {
      await Promise.all(updates.map(u =>
        sb.from('line_groups').update({ sort_order: u.sort_order }).eq('id', u.id)
      ));
      updates.forEach(u => {
        const g = allGroups.find(x => x.id === u.id);
        if (g) g.sort_order = u.sort_order;
      });
      allGroups.sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    } catch(e){
      console.warn('auto-renumber failed', e);
    }
  }

  function filteredGroups(){
    return allGroups.filter(g => !searchQ || g.name.toLowerCase().includes(searchQ));
  }

  // -------- レンダリング --------
  const CATS = [
    { key: 'solo',  label: '全体・ドクター' },
    { key: 'store', label: '医院' },
  ];

  function render(){
    const container = $('sections');
    const visible = filteredGroups();

    if (!visible.length) {
      const isSearch = !!searchQ;
      container.innerHTML = `<div class="status">
        ${isSearch ? '「'+esc(searchQ)+'」に一致するグループがありません' : 'まだ登録がありません'}
        ${!isSearch ? '<div class="status-hint">右上の「編集」をタップして「＋ 追加」または「📋 一括」から登録できます</div>' : ''}
      </div>`;
      return;
    }

    const edit = isEditMode();
    const parts = [];
    CATS.forEach(c => {
      const items = visible.filter(g => g.category === c.key);
      if (!items.length) return;
      parts.push(`
        <section class="section" data-cat="${c.key}">
          <div class="section-title">
            <span>${esc(c.label)}</span>
            <span class="cnt">${items.length}</span>
            <span class="rule"></span>
          </div>
          <div class="grid" data-cat="${c.key}">
            ${items.map(g => renderTile(g, edit)).join('')}
          </div>
        </section>
      `);
    });
    container.innerHTML = parts.join('');

    wireTiles();
    if (edit) initSortable();
  }

  function renderTile(g, edit){
    const hasUrl = !!(g.url && g.url.trim());
    const initial = ((g.name || '?').trim().charAt(0) || '?').toUpperCase();
    const isSel = selected.has(g.id);

    if (edit) {
      return `
        <div class="tile ${isSel ? 'selected' : ''} ${hasUrl ? '' : 'unset'} editing" data-id="${g.id}">
          <div class="mono">${esc(initial)}</div>
          <div class="edit-inner">
            <div class="edit-topline">
              <div class="name" title="${esc(g.name)}">${esc(g.name)}</div>
              <div class="chkbox" data-act="toggle-sel" title="選択"></div>
              <button class="drag-handle" title="ドラッグで並び替え" type="button">⋮⋮</button>
            </div>
            <div class="edit-url-row">
              <input type="url" placeholder="https://line.me/ti/g/xxxxxxxx" value="${esc(g.url || '')}" data-act="url-input">
            </div>
            <div class="edit-actions">
              <button class="save" data-act="save-url" type="button">💾 保存</button>
              <button class="delete" data-act="delete" type="button">🗑 削除</button>
            </div>
          </div>
        </div>
      `;
    }

    // ビューモード (+ 選択モードも同じ構造・sel-mark 付き)
    const selCls = isSel ? ' selected' : '';
    const inner = `
      <div class="mono">${esc(initial)}</div>
      <div class="body">
        <div class="name" title="${esc(g.name)}">${esc(g.name)}</div>
        <div class="tap-label">${hasUrl ? 'タップで開く' : '未設定'}</div>
      </div>
      ${hasUrl ? '<div class="chev">›</div>' : ''}
      <div class="sel-mark"></div>
    `;
    if (hasUrl) {
      return `<a class="tile${selCls}" data-id="${g.id}" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
    }
    return `<div class="tile unset${selCls}" data-id="${g.id}">${inner}</div>`;
  }

  function wireTiles(){
    document.querySelectorAll('.tile[data-id]').forEach(tile => {
      const id = tile.dataset.id;
      const urlInput = tile.querySelector('[data-act="url-input"]');
      const saveBtn = tile.querySelector('[data-act="save-url"]');
      const deleteBtn = tile.querySelector('[data-act="delete"]');
      const chkbox = tile.querySelector('[data-act="toggle-sel"]');
      const originalUrl = urlInput ? urlInput.value : '';

      if (urlInput) {
        urlInput.addEventListener('click', e => e.stopPropagation());
        urlInput.addEventListener('input', () => {
          urlInput.classList.toggle('dirty', urlInput.value.trim() !== originalUrl.trim());
        });
        urlInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); saveUrlEdit(id, urlInput.value); }
        });
      }
      if (saveBtn) {
        saveBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          saveUrlEdit(id, urlInput.value);
        });
      }
      if (deleteBtn) {
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const g = allGroups.find(x => x.id === id);
          if (g) deleteGroup(g);
        });
      }
      if (chkbox) {
        chkbox.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleSel(id, tile);
        });
      }
      // 編集モードではタイル本体クリックでも選択切替
      if (isEditMode()) {
        tile.addEventListener('click', (e) => {
          if (e.target.closest('button, input, .drag-handle, .chkbox')) return;
          toggleSel(id, tile);
        });
      }
      // 選択モード: タイル/リンククリックを乗っ取って選択切替
      if (isSelectMode()) {
        tile.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          toggleSel(id, tile);
        });
      }
    });
  }

  function toggleSel(id, tile){
    if (selected.has(id)) selected.delete(id); else selected.add(id);
    tile.classList.toggle('selected');
    updateSelBar();
  }

  function updateSelBar(){
    const bar = $('sel-bar');
    $('sel-num').textContent = selected.size;
    bar.hidden = selected.size === 0;
  }

  // -------- 保存系 --------
  async function saveUrlEdit(id, rawUrl){
    const url = rawUrl.trim();
    if (url && !/^https?:\/\//.test(url)) {
      toast('URL は http(s):// で始めてください', true);
      return;
    }
    try {
      const { error } = await sb.from('line_groups').update({ url: url || null }).eq('id', id);
      if (error) throw error;
      const g = allGroups.find(x => x.id === id);
      if (g) g.url = url || null;
      toast('保存しました');
      render();
    } catch(e){ toast('保存失敗: ' + (e.message||e), true); }
  }

  async function deleteGroup(g){
    if (!confirm(`「${g.name}」を削除しますか？\n(この操作は取り消せません)`)) return;
    try {
      const { error } = await sb.from('line_groups').delete().eq('id', g.id);
      if (error) throw error;
      selected.delete(g.id);
      toast('削除しました');
      await load();
    } catch(e){ toast('削除失敗: ' + (e.message||e), true); }
  }

  // -------- モーダル: URL 発行 --------
  function openIssueModal(){
    const picked = allGroups.filter(g => selected.has(g.id));
    if (!picked.length) { toast('選択なし', true); return; }
    const formats = {
      line: (list) => list.map(g => g.url ? `${g.name}\n${g.url}` : `${g.name}\n(URL未設定)`).join('\n\n'),
      plain: (list) => list.map(g => g.url ? `${g.name}: ${g.url}` : `${g.name}: (未設定)`).join('\n'),
      urlonly: (list) => list.filter(g => g.url).map(g => g.url).join('\n'),
      markdown: (list) => list.map(g => g.url ? `- [${g.name}](${g.url})` : `- ${g.name} _(未設定)_`).join('\n'),
    };
    let curFmt = 'line';
    const html = `
      <div class="backdrop">
        <div class="modal">
          <h3>📤 URL 発行 <span style="font-weight:500;color:var(--text-sub);font-size:13px">(${picked.length}件)</span></h3>
          <div class="fmt-tabs">
            <button class="fmt-tab active" data-fmt="line">LINE 用</button>
            <button class="fmt-tab" data-fmt="plain">プレーン</button>
            <button class="fmt-tab" data-fmt="urlonly">URL のみ</button>
            <button class="fmt-tab" data-fmt="markdown">Markdown</button>
          </div>
          <div class="fmt-info" id="fmt-info">LINE トークにそのまま貼付できる形式</div>
          <textarea class="issue-out" id="issue-out" readonly></textarea>
          <div class="m-actions">
            <button class="btn" data-act="cancel">閉じる</button>
            <button class="btn primary" data-act="copy">📋 コピー</button>
          </div>
        </div>
      </div>`;
    $('modal-root').innerHTML = html;
    const root = $('modal-root').firstElementChild;
    const close = () => root.remove();
    root.querySelector('[data-act="cancel"]').onclick = close;
    root.addEventListener('click', (e) => { if (e.target === root) close(); });
    const outEl = $('issue-out');
    const infoEl = $('fmt-info');
    const fmtInfos = {
      line: 'LINE トークにそのまま貼付できる形式 (名前 → URL 改行 → 空行)',
      plain: '『名前: URL』の1行形式。メール/メモに便利',
      urlonly: 'URL のみ 1行1URL (未設定は除外)',
      markdown: 'Markdown リンク形式 (Slack/Notion 等)',
    };
    const renderOut = () => {
      outEl.value = formats[curFmt](picked);
      infoEl.textContent = fmtInfos[curFmt];
    };
    renderOut();
    root.querySelectorAll('.fmt-tab').forEach(t => {
      t.onclick = () => {
        root.querySelectorAll('.fmt-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        curFmt = t.dataset.fmt;
        renderOut();
      };
    });
    root.querySelector('[data-act="copy"]').onclick = async () => {
      try {
        await navigator.clipboard.writeText(outEl.value);
        toast('コピーしました');
      } catch(e) {
        outEl.select();
        try { document.execCommand('copy'); toast('コピーしました'); }
        catch(_) { toast('コピー失敗', true); }
      }
    };
  }

  // -------- モーダル: 追加/編集 --------
  function openEditModal(g){
    const isNew = !g;
    const html = `
      <div class="backdrop">
        <div class="modal">
          <h3>${isNew ? '＋ 新規追加' : '✏️ URL 編集'}</h3>
          <div class="field">
            <label>カテゴリ</label>
            <select id="m-cat" ${isNew ? '' : 'disabled'}>
              <option value="solo"${(g?.category==='solo'||isNew)?' selected':''}>🎯 全体・ドクター</option>
              <option value="store"${g?.category==='store'?' selected':''}>🏥 医院</option>
            </select>
          </div>
          <div class="field">
            <label>グループ名 <span style="color:#dc2626">*</span></label>
            <input type="text" id="m-name" value="${esc(g?.name||'')}" placeholder="例: エスカ" ${isNew ? '' : 'disabled'}>
          </div>
          <div class="field">
            <label>LINE URL <span style="color:var(--text-muted); font-weight:400">(任意)</span></label>
            <input type="url" id="m-url" value="${esc(g?.url||'')}" placeholder="https://line.me/ti/g/xxxxxxxx">
            <div class="hint">
              LINE アプリ → 対象グループ → 右上「≡」→ 招待 → リンクをコピー<br>
              空欄なら「未設定」で保存 (後から追加可)
            </div>
          </div>
          <div class="m-actions">
            <button class="btn" data-act="cancel">キャンセル</button>
            <button class="btn primary" data-act="save">保存</button>
          </div>
        </div>
      </div>`;
    $('modal-root').innerHTML = html;
    const root = $('modal-root').firstElementChild;
    const close = () => root.remove();
    root.querySelector('[data-act="cancel"]').onclick = close;
    root.addEventListener('click', (e) => { if (e.target === root) close(); });
    root.querySelector('[data-act="save"]').onclick = async () => {
      const cat = $('m-cat').value;
      const name = $('m-name').value.trim();
      const url = $('m-url').value.trim();
      if (!name) { toast('グループ名は必須です', true); return; }
      if (url && !/^https?:\/\//.test(url)) { toast('URL は http(s):// で始めてください', true); return; }
      try {
        if (isNew) {
          const maxSort = Math.max(0, ...allGroups.map(x => x.sort_order || 0));
          const { error } = await sb.from('line_groups').insert({
            category: cat, name, url: url || null, sort_order: maxSort + 10, is_active: true
          });
          if (error) throw error;
          toast('追加しました');
        } else {
          const { error } = await sb.from('line_groups').update({ url: url || null }).eq('id', g.id);
          if (error) throw error;
          toast('保存しました');
        }
        close();
        await load();
      } catch(e){ toast('保存失敗: ' + (e.message||e), true); }
    };
    setTimeout(() => (isNew ? $('m-name') : $('m-url')).focus(), 60);
  }

  // -------- モーダル: 一括追加 --------
  function openBulkModal(){
    const sample = '医院\tにじいろ\thttps://line.me/ti/g/xxx\n医院\t新店\n全体\t会議室\thttps://line.me/ti/g/yyy';
    const html = `
      <div class="backdrop">
        <div class="modal">
          <h3>📋 複数一括追加</h3>
          <div class="field">
            <label>1行 = 1グループ (タブ or | 区切り)</label>
            <textarea id="m-bulk" placeholder="${esc(sample)}"></textarea>
            <div class="hint">
              形式: <code>カテゴリ ⇥ 名前 ⇥ URL(任意)</code><br>
              カテゴリ = <code>医院</code>(=店舗) or <code>全体</code>(=単独/ドクター)<br>
              Excel/スプレッドシートから 3列コピペ可
            </div>
          </div>
          <div class="m-actions">
            <button class="btn" data-act="cancel">キャンセル</button>
            <button class="btn primary" data-act="save">一括追加</button>
          </div>
        </div>
      </div>`;
    $('modal-root').innerHTML = html;
    const root = $('modal-root').firstElementChild;
    const close = () => root.remove();
    root.querySelector('[data-act="cancel"]').onclick = close;
    root.addEventListener('click', (e) => { if (e.target === root) close(); });
    root.querySelector('[data-act="save"]').onclick = async () => {
      const raw = $('m-bulk').value;
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (!lines.length) { toast('内容を入力してください', true); return; }
      const parsed = [];
      const errors = [];
      lines.forEach((line, i) => {
        const parts = line.split(/[\t|]/).map(s => s.trim());
        if (parts.length < 2) { errors.push(`行${i+1}: 区切り不足`); return; }
        const [catRaw, name, urlRaw] = parts;
        const cat = /^(店舗|医院|store)$/i.test(catRaw) ? 'store'
                  : /^(単独|全体|ドクター|solo)$/i.test(catRaw) ? 'solo' : null;
        if (!cat) { errors.push(`行${i+1}: カテゴリ不正 (${catRaw})`); return; }
        if (!name) { errors.push(`行${i+1}: 名前が空`); return; }
        const url = (urlRaw||'').trim();
        if (url && !/^https?:\/\//.test(url)) { errors.push(`行${i+1}: URL 形式不正`); return; }
        parsed.push({ category: cat, name, url: url || null });
      });
      if (errors.length) { toast('入力エラー: ' + errors[0], true); return; }
      if (!parsed.length) { toast('有効な行がありません', true); return; }
      let base = Math.max(0, ...allGroups.map(g => g.sort_order || 0));
      const payload = parsed.map(p => ({
        ...p,
        sort_order: (base += 10),
        is_active: true
      }));
      try {
        const { error } = await sb.from('line_groups').insert(payload);
        if (error) throw error;
        toast(`${payload.length}件 追加しました`);
        close();
        await load();
      } catch(e){ toast('一括追加失敗: ' + (e.message||e), true); }
    };
    setTimeout(() => $('m-bulk').focus(), 60);
  }

  load();
})();
</script>

</body>
</html>
