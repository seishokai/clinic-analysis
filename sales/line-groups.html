<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1a1a">
<title>LINE グループ / Aladdin 営業ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<style>
  :root{
    --primary:#1a1a1a; --primary-l:#2d3436;
    --accent:#4a5568;
    --bg:#f7f7f8; --card:#fff; --border:#e5e7eb;
    --text:#1a1a1a; --text-sub:#6b7280; --text-muted:#9ca3af;
    --gray:#e5e7eb; --danger:#dc2626;
    --sel:#eff6ff; --sel-b:#3b82f6;
    --store:#93c5fd; --solo:#fcd34d;
    --line-accent:#059669;  /* 落ち着いたエメラルド (LINE識別用の控えめ緑) */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0}
  html,body{background:var(--bg)}
  body{
    font-family:'Noto Sans JP','Hiragino Sans','Meiryo',sans-serif;
    color:var(--text); line-height:1.4;
    -webkit-font-smoothing:antialiased;
    padding-bottom:70px;
  }
  [hidden]{display:none !important}
  button{font-family:inherit}

  /* ヘッダー: 黒基調のシック */
  header.head{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,#1a1a1a 0%,#2d3436 100%);
    color:#fff; padding:9px 14px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .head .back{
    color:#fff; text-decoration:none; font-size:12px;
    padding:5px 10px; border:1px solid rgba(255,255,255,.25);
    border-radius:14px; white-space:nowrap; opacity:.9;
  }
  .head .back:hover{background:rgba(255,255,255,.08)}
  .head .title-wrap{flex:1; text-align:center; min-width:0}
  .head h1{margin:0; font-size:15px; font-weight:800; letter-spacing:.5px}
  .head h1 .line-tag{
    display:inline-block; padding:1px 6px; border-radius:6px;
    background:var(--line-accent); color:#fff; font-size:10px;
    font-weight:700; margin-right:4px; vertical-align:middle;
  }
  .head .sub{font-size:10px; opacity:.7; margin-top:1px}
  .head .spacer{width:52px}

  .container{max-width:1100px; margin:0 auto; padding:0}

  /* アクションバー */
  .action-bar{
    background:#fff; padding:8px 12px;
    border-bottom:1px solid var(--border);
    display:flex; gap:6px; align-items:center;
    position:sticky; top:44px; z-index:15;
    flex-wrap:wrap;
  }
  .search-box{flex:1; min-width:160px; position:relative}
  .search-box input{
    width:100%; padding:7px 10px 7px 28px;
    border:1px solid var(--border); border-radius:18px;
    font-size:13px; font-family:inherit; background:var(--bg);
  }
  .search-box input:focus{
    outline:none; border-color:var(--accent); background:#fff;
    box-shadow:0 0 0 3px rgba(74,85,104,.1);
  }
  .search-box::before{
    content:'🔍'; position:absolute; left:8px; top:50%;
    transform:translateY(-50%); font-size:11px; opacity:.5;
  }
  .action-btn{
    padding:7px 11px; border-radius:18px; font-size:12px;
    font-weight:700; cursor:pointer; white-space:nowrap; border:none;
  }
  .action-btn.primary{background:var(--primary); color:#fff}
  .action-btn.primary:active{background:var(--primary-l)}
  .action-btn.outline{background:#fff; color:var(--text); border:1px solid var(--border)}
  .action-btn.gray{background:#fff; color:var(--text-sub); border:1px solid var(--border)}
  .action-btn.reorder{
    background:#fff; color:var(--accent); border:1px solid var(--border);
    display:inline-flex; align-items:center; gap:4px;
  }
  .action-btn.reorder.active{
    background:var(--sel); color:var(--sel-b); border-color:var(--sel-b);
  }

  /* リスト: 2 列 (デスクトップ) */
  .list{
    background:#fff;
    display:grid;
    grid-template-columns:1fr;
  }
  @media (min-width:720px){
    .list{grid-template-columns:1fr 1fr}
    .list > .row:nth-child(2n){border-left:1px solid #f3f4f6}
  }

  /* 行 */
  .row{
    display:flex; align-items:center; gap:8px;
    padding:9px 12px 9px 9px;
    border-bottom:1px solid #f3f4f6;
    cursor:pointer; user-select:none;
    background:#fff;
    border-left:3px solid transparent;
    transition:background .1s;
    min-height:52px;
  }
  .row:hover{background:#fafafa}
  .row.store{border-left-color:var(--store)}
  .row.solo{border-left-color:var(--solo)}
  .row.selected{background:var(--sel); border-left-color:var(--sel-b)}
  .row.disabled{background:#fbfbfb}
  .row.sortable-ghost{opacity:.4; background:#e0e7ff !important}
  .row.sortable-chosen{background:#fef3c7}

  /* ドラッグハンドル */
  .drag-handle{
    width:22px; height:24px; border-radius:4px;
    display:none; align-items:center; justify-content:center;
    color:var(--text-muted); font-size:14px;
    cursor:grab; flex-shrink:0;
    background:transparent; border:none; padding:0;
    letter-spacing:-1px;
  }
  .drag-handle:active{cursor:grabbing}
  body.reorder-mode .drag-handle{display:inline-flex; color:var(--sel-b)}
  body.reorder-mode .row{cursor:grab}
  body.reorder-mode .row:active{cursor:grabbing}
  body.reorder-mode .check, body.reorder-mode .icon-btn{display:none}

  /* チェックボックス */
  .row .check{
    width:20px; height:20px; border-radius:5px;
    border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-size:12px; color:#fff;
    background:#fff; transition:all .12s;
  }
  .row.selected .check{
    background:var(--sel-b); border-color:var(--sel-b);
  }
  .row.selected .check::after{content:'✓'; font-weight:800}

  .row .name{
    flex:1; font-size:14px; font-weight:600; color:var(--text);
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row.disabled .name{color:var(--text-sub); font-weight:500}

  /* 「開く」ボタン: 落ち着いた黒基調 + 緑テキスト */
  .row .open-btn{
    background:var(--primary); color:#fff; text-decoration:none;
    padding:6px 12px; border-radius:15px;
    font-size:11px; font-weight:700; letter-spacing:.3px;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    white-space:nowrap; flex-shrink:0;
    display:inline-flex; align-items:center; gap:4px;
  }
  .row .open-btn::before{
    content:''; width:6px; height:6px; border-radius:50%;
    background:var(--line-accent); flex-shrink:0;
  }
  .row .open-btn:active{background:var(--primary-l); transform:scale(.96)}
  .row .not-set{
    color:var(--text-muted); font-size:10px; font-weight:600;
    padding:5px 10px; background:#f3f4f6; border-radius:15px;
    border:1px dashed var(--gray); white-space:nowrap; flex-shrink:0;
  }

  .row .icon-btn{
    width:26px; height:26px; border-radius:5px;
    border:none; background:transparent; cursor:pointer;
    font-size:12px; padding:0; opacity:.55;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-sub); flex-shrink:0;
  }
  .row .icon-btn:hover{background:var(--bg); opacity:1}
  .row .icon-btn.danger:hover{background:#fef2f2; color:var(--danger)}

  /* Fixed bottom selection bar */
  .sel-bar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--primary); color:#fff;
    padding:10px 14px; z-index:30;
    box-shadow:0 -4px 14px rgba(0,0,0,.25);
    display:flex; align-items:center; gap:8px;
    animation:slideupbar .2s;
  }
  @keyframes slideupbar{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sel-bar .cnt{flex:1; font-size:13px; font-weight:700}
  .sel-bar .cnt .num{
    display:inline-block; background:var(--sel-b); color:#fff;
    padding:2px 9px; border-radius:11px; margin-right:6px;
    font-size:12px;
  }
  .sel-bar button{
    padding:7px 14px; border-radius:18px; font-size:12px;
    font-weight:700; cursor:pointer; border:none;
  }
  .sel-bar .btn-clear{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35)}
  .sel-bar .btn-issue{background:var(--line-accent); color:#fff}

  /* 並び替えモード表示バー */
  .reorder-bar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--sel-b); color:#fff;
    padding:10px 14px; z-index:30;
    display:none; align-items:center; gap:8px;
    box-shadow:0 -4px 14px rgba(0,0,0,.25);
  }
  body.reorder-mode .reorder-bar{display:flex}
  body.reorder-mode .sel-bar{display:none !important}
  .reorder-bar .msg{flex:1; font-size:13px; font-weight:700}
  .reorder-bar button{
    padding:7px 14px; border-radius:18px; font-size:12px;
    font-weight:700; cursor:pointer; border:none;
    background:#fff; color:var(--sel-b);
  }

  /* Loading / empty */
  .loading, .empty, .error{
    grid-column:1/-1;
    padding:40px 20px; text-align:center;
    color:var(--text-sub); font-size:13px;
  }
  .empty{background:#fff}
  .error{background:#fff2f2; color:var(--danger)}
  .empty-hint{margin-top:8px; font-size:11px; color:var(--text-muted)}

  /* Modal */
  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    padding:16px; z-index:200; animation:fadein .15s;
  }
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff; border-radius:14px; padding:20px;
    max-width:520px; width:100%; max-height:90vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    animation:slideup .2s;
  }
  @keyframes slideup{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h3{margin:0 0 14px; font-size:16px; font-weight:800}
  .field{margin-bottom:12px}
  .field label{
    display:block; font-size:11px; font-weight:600;
    color:var(--text-sub); margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px;
    border:1px solid var(--border); border-radius:8px;
    font-size:14px; font-family:inherit; box-sizing:border-box;
    background:#fff;
  }
  .field textarea{
    resize:vertical; min-height:120px; line-height:1.55;
    font-family:'SF Mono','Consolas',monospace; font-size:12px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(74,85,104,.12);
  }
  .field input:disabled, .field select:disabled{background:#fafafa; color:var(--text-sub)}
  .m-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap}
  .btn{
    padding:10px 20px; font-size:14px; font-weight:700;
    border-radius:8px; cursor:pointer;
    border:1px solid var(--border); background:#fff; color:var(--text);
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--primary); color:#fff; border-color:var(--primary)}
  .btn.primary:active{background:var(--primary-l)}

  .hint{
    font-size:11px; color:var(--text-sub);
    background:var(--bg); border-radius:6px; padding:8px 10px;
    margin-top:6px; line-height:1.6;
  }
  .hint code{background:#fff; padding:1px 5px; border-radius:3px; font-family:'SF Mono',monospace; font-size:11px}

  .fmt-tabs{
    display:flex; gap:4px; margin-bottom:10px;
    border-bottom:1px solid var(--border); padding-bottom:4px;
  }
  .fmt-tab{
    flex:1; padding:7px 6px; background:transparent; border:none;
    font-size:12px; font-weight:600; color:var(--text-sub);
    border-radius:6px 6px 0 0; cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .fmt-tab.active{color:var(--primary); border-bottom-color:var(--primary)}
  .issue-out{
    width:100%; min-height:180px; padding:12px;
    border:1px solid var(--border); border-radius:8px;
    background:#fafafa; font-size:12px; font-family:'SF Mono','Consolas',monospace;
    line-height:1.7; resize:vertical; box-sizing:border-box;
  }
  .fmt-info{font-size:11px; color:var(--text-sub); margin:6px 0 10px}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#1a1a1a; color:#fff; padding:11px 20px; border-radius:24px;
    font-size:13px; font-weight:700; z-index:1000;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
    animation:slideuptoast .25s; max-width:90vw; text-align:center;
  }
  .toast.error{background:var(--danger)}
  @keyframes slideuptoast{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

  .legend{
    display:flex; gap:14px; padding:6px 14px 8px;
    font-size:10px; color:var(--text-sub);
    background:#fff; border-bottom:1px solid var(--border);
  }
  .legend .dot{
    display:inline-block; width:10px; height:10px;
    border-radius:2px; margin-right:5px; vertical-align:middle;
  }
  .legend .dot.store{background:var(--store)}
  .legend .dot.solo{background:var(--solo)}

  @media (max-width:420px){
    .head h1{font-size:14px}
    .action-bar{padding:7px 10px; gap:5px}
    .action-btn{padding:6px 9px; font-size:11px}
    .row{padding:8px 10px 8px 7px; min-height:48px}
    .row .name{font-size:13px}
    .row .open-btn, .row .not-set{padding:5px 10px; font-size:10px}
  }
</style>
</head>
<body>

<header class="head">
  <a class="back" href="/clinic-analysis/sales/">← 戻る</a>
  <div class="title-wrap">
    <h1><span class="line-tag">LINE</span> グループ</h1>
    <div class="sub" id="head-sub">読み込み中…</div>
  </div>
  <span class="spacer"></span>
</header>

<div class="container">
  <div class="action-bar">
    <div class="search-box">
      <input type="text" id="search" placeholder="グループ名で検索…">
    </div>
    <button class="action-btn reorder" id="reorder-btn" title="並び替えモード">↕ 並替</button>
    <button class="action-btn gray" id="select-all-btn">☑ 全選択</button>
    <button class="action-btn primary" id="add-btn">＋ 追加</button>
    <button class="action-btn outline" id="bulk-btn">📋 一括</button>
  </div>

  <div class="legend">
    <span><span class="dot store"></span>店舗</span>
    <span><span class="dot solo"></span>単独</span>
    <span style="margin-left:auto">🖱 行クリックで選択・↕で並替</span>
  </div>

  <div class="list" id="list">
    <div class="loading">読み込み中…</div>
  </div>
</div>

<div class="sel-bar" id="sel-bar" hidden>
  <div class="cnt"><span class="num" id="sel-num">0</span>件選択中</div>
  <button class="btn-clear" id="clear-sel">解除</button>
  <button class="btn-issue" id="issue-btn">📤 URL 発行</button>
</div>

<div class="reorder-bar" id="reorder-bar">
  <div class="msg">↕ 行をドラッグして並び順を変更</div>
  <button id="reorder-done">完了</button>
</div>

<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
(function(){
  'use strict';
  const SUPABASE_URL = 'https://ndlfqrvoejwgqfdtghmg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kbGZxcnZvZWp3Z3FmZHRnaG1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1ODIxNjcsImV4cCI6MjA5MTE1ODE2N30.pE-l-4NgQTpEb9DvjeRptargvrsYH9YKyRLt06flPik';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let allGroups = [];
  let searchQ = '';
  const selected = new Set();
  let sortableInstance = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast = (msg, err=false) => {
    const el = document.createElement('div');
    el.className = 'toast' + (err ? ' error' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  };

  $('search').addEventListener('input', (e) => {
    searchQ = e.target.value.trim().toLowerCase();
    render();
  });

  $('select-all-btn').addEventListener('click', () => {
    const visible = filteredGroups();
    const allSel = visible.length > 0 && visible.every(g => selected.has(g.id));
    if (allSel) visible.forEach(g => selected.delete(g.id));
    else visible.forEach(g => selected.add(g.id));
    updateSelBar();
    render();
  });

  // 並替モード切替
  $('reorder-btn').addEventListener('click', () => toggleReorderMode(true));
  $('reorder-done').addEventListener('click', () => toggleReorderMode(false));

  function toggleReorderMode(on){
    document.body.classList.toggle('reorder-mode', on);
    $('reorder-btn').classList.toggle('active', on);
    if (on) {
      // 検索・選択をクリアして全表示に
      searchQ = '';
      $('search').value = '';
      selected.clear();
      updateSelBar();
      render();
      // Sortable を初期化
      const list = $('list');
      sortableInstance = Sortable.create(list, {
        animation: 150,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd: onReorderEnd,
      });
    } else {
      if (sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }
      render();
    }
  }

  async function onReorderEnd(evt){
    // 現在の DOM 順から新しい sort_order を計算 (1-indexed × 10)
    const list = $('list');
    const rowEls = [...list.querySelectorAll('.row')];
    const updates = rowEls.map((row, i) => ({
      id: row.dataset.id,
      sort_order: (i + 1) * 10,
    }));
    try {
      // 並列 UPDATE で高速化
      const results = await Promise.all(updates.map(u =>
        sb.from('line_groups').update({ sort_order: u.sort_order }).eq('id', u.id)
      ));
      const errors = results.filter(r => r.error);
      if (errors.length) throw errors[0].error;
      // ローカル allGroups も更新
      updates.forEach(u => {
        const g = allGroups.find(x => x.id === u.id);
        if (g) g.sort_order = u.sort_order;
      });
      toast('順番を保存しました');
    } catch(e){
      toast('並替保存失敗: ' + (e.message||e), true);
      console.error(e);
      await load();  // 失敗時は再取得で戻す
    }
  }

  async function load(){
    try {
      const { data, error } = await sb.from('line_groups')
        .select('*')
        .eq('is_active', true)
        .order('sort_order', { ascending: true })
        .order('created_at', { ascending: true });
      if (error) throw error;
      allGroups = data || [];
      $('head-sub').textContent = `${allGroups.length}件`;
      // 初期 seed の sort_order が category ごとに 10-140 で重複してるので、
      // 一意な連番になるよう自動で振り直す (1度だけ)
      await autoRenumberIfNeeded();
    } catch(e){
      console.error('load failed', e);
      $('list').innerHTML = `<div class="error">読み込み失敗: ${esc(e.message||e)}<br><small style="opacity:.7">line_groups テーブル未作成の可能性</small></div>`;
      $('head-sub').textContent = 'エラー';
      return;
    }
    render();
  }

  async function autoRenumberIfNeeded(){
    // sort_order が重複してるか調べる (店舗と単独で同じ値があると混在で表示崩れる)
    const seen = new Set();
    let hasDup = false;
    for (const g of allGroups) {
      if (seen.has(g.sort_order)) { hasDup = true; break; }
      seen.add(g.sort_order);
    }
    if (!hasDup) return;
    // 店舗 → 単独 の順で並べて 10, 20, 30… と振り直す
    const stores = allGroups.filter(g => g.category === 'store')
      .sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    const solos = allGroups.filter(g => g.category === 'solo')
      .sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    const combined = [...stores, ...solos];
    const updates = combined.map((g, i) => ({ id: g.id, sort_order: (i+1)*10 }));
    try {
      await Promise.all(updates.map(u =>
        sb.from('line_groups').update({ sort_order: u.sort_order }).eq('id', u.id)
      ));
      updates.forEach(u => {
        const g = allGroups.find(x => x.id === u.id);
        if (g) g.sort_order = u.sort_order;
      });
      // 並び順を反映
      allGroups.sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    } catch(e){
      console.warn('auto-renumber failed', e);
    }
  }

  function filteredGroups(){
    return allGroups.filter(g => !searchQ || g.name.toLowerCase().includes(searchQ));
  }

  function render(){
    const rows = filteredGroups();
    const list = $('list');
    if (!rows.length) {
      const isSearch = !!searchQ;
      list.innerHTML = `<div class="empty">
        ${isSearch ? '「'+esc(searchQ)+'」に一致するグループがありません' : 'まだ登録がありません'}
        ${!isSearch ? '<div class="empty-hint">上の「＋ 追加」または「📋 一括」から登録できます</div>' : ''}
      </div>`;
      return;
    }
    list.innerHTML = rows.map(g => {
      const hasUrl = !!(g.url && g.url.trim());
      const isSel = selected.has(g.id);
      const rowCls = 'row ' + g.category + (hasUrl ? '' : ' disabled') + (isSel ? ' selected' : '');
      const actionHtml = hasUrl
        ? `<a class="open-btn" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">開く →</a>`
        : `<span class="not-set">未設定</span>`;
      return `<div class="${rowCls}" data-id="${g.id}">
        <button class="drag-handle" title="ドラッグで並替">≡</button>
        <div class="check"></div>
        <div class="name" title="${esc(g.name)}">${esc(g.name)}</div>
        ${actionHtml}
        <button class="icon-btn" data-act="edit" data-id="${g.id}" title="URL 編集">✏️</button>
        <button class="icon-btn danger" data-act="delete" data-id="${g.id}" title="削除">🗑</button>
      </div>`;
    }).join('');
    list.querySelectorAll('.row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (document.body.classList.contains('reorder-mode')) return;
        if (e.target.closest('.open-btn') || e.target.closest('.icon-btn')) return;
        const id = row.dataset.id;
        if (selected.has(id)) selected.delete(id); else selected.add(id);
        row.classList.toggle('selected');
        updateSelBar();
      });
    });
    list.querySelectorAll('.icon-btn').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const id = b.dataset.id;
        const g = allGroups.find(x => x.id === id);
        if (!g) return;
        if (b.dataset.act === 'edit') openEditModal(g);
        else if (b.dataset.act === 'delete') deleteGroup(g);
      });
    });
    updateSelBar();
  }

  function updateSelBar(){
    const bar = $('sel-bar');
    $('sel-num').textContent = selected.size;
    bar.hidden = selected.size === 0;
  }

  $('clear-sel').addEventListener('click', () => {
    selected.clear();
    updateSelBar();
    render();
  });

  $('issue-btn').addEventListener('click', () => openIssueModal());

  function openIssueModal(){
    const picked = allGroups.filter(g => selected.has(g.id));
    if (!picked.length) { toast('選択なし', true); return; }
    const formats = {
      line: (list) => list.map(g => g.url ? `${g.name}\n${g.url}` : `${g.name}\n(URL未設定)`).join('\n\n'),
      plain: (list) => list.map(g => g.url ? `${g.name}: ${g.url}` : `${g.name}: (未設定)`).join('\n'),
      urlonly: (list) => list.filter(g => g.url).map(g => g.url).join('\n'),
      markdown: (list) => list.map(g => g.url ? `- [${g.name}](${g.url})` : `- ${g.name} _(未設定)_`).join('\n'),
    };
    let curFmt = 'line';
    const html = `
      <div class="backdrop">
        <div class="modal">
          <h3>📤 URL 発行 <span style="font-weight:500;color:var(--text-sub);font-size:13px">(${picked.length}件)</span></h3>
          <div class="fmt-tabs">
            <button class="fmt-tab active" data-fmt="line">LINE 用</button>
            <button class="fmt-tab" data-fmt="plain">プレーン</button>
            <button class="fmt-tab" data-fmt="urlonly">URL のみ</button>
            <button class="fmt-tab" data-fmt="markdown">Markdown</button>
          </div>
          <div class="fmt-info" id="fmt-info">LINE トークにそのまま貼付できる形式</div>
          <textarea class="issue-out" id="issue-out" readonly></textarea>
          <div class="m-actions">
            <button class="btn" data-act="cancel">閉じる</button>
            <button class="btn primary" data-act="copy">📋 コピー</button>
          </div>
        </div>
      </div>`;
    $('modal-root').innerHTML = html;
    const root = $('modal-root').firstElementChild;
    const close = () => root.remove();
    root.querySelector('[data-act="cancel"]').onclick = close;
    root.addEventListener('click', (e) => { if (e.target === root) close(); });
    const outEl = $('issue-out');
    const infoEl = $('fmt-info');
    const fmtInfos = {
      line: 'LINE トークにそのまま貼付できる形式 (名前 → URL 改行 → 空行)',
      plain: '『名前: URL』の1行形式。メール/メモに便利',
      urlonly: 'URL のみ 1行1URL (未設定は除外)',
      markdown: 'Markdown リンク形式 (Slack/Notion 等)',
    };
    const renderOut = () => {
      outEl.value = formats[curFmt](picked);
      infoEl.textContent = fmtInfos[curFmt];
    };
    renderOut();
    root.querySelectorAll('.fmt-tab').forEach(t => {
      t.onclick = () => {
        root.querySelectorAll('.fmt-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        curFmt = t.dataset.fmt;
        renderOut();
      };
    });
    root.querySelector('[data-act="copy"]').onclick = async () => {
      try {
        await navigator.clipboard.writeText(outEl.value);
        toast('コピーしました');
      } catch(e) {
        outEl.select();
        try { document.execCommand('copy'); toast('コピーしました'); }
        catch(_) { toast('コピー失敗', true); }
      }
    };
  }

  $('add-btn').addEventListener('click', () => openEditModal(null));
  $('bulk-btn').addEventListener('click', () => openBulkModal());

  function openEditModal(g){
    const isNew = !g;
    const html = `
      <div class="backdrop">
        <div class="modal">
          <h3>${isNew ? '＋ 新規追加' : '✏️ URL 編集'}</h3>
          <div class="field">
            <label>カテゴリ</label>
            <select id="m-cat" ${isNew ? '' : 'disabled'}>
              <option value="store"${(g?.category==='store'||isNew)?' selected':''}>🏥 店舗グループ</option>
              <option value="solo"${g?.category==='solo'?' selected':''}>🎯 単独グループ</option>
            </select>
          </div>
          <div class="field">
            <label>グループ名 <span style="color:#dc2626">*</span></label>
            <input type="text" id="m-name" value="${esc(g?.name||'')}" placeholder="例: エスカ" ${isNew ? '' : 'disabled'}>
          </div>
          <div class="field">
            <label>LINE URL <span style="color:var(--text-muted); font-weight:400">(任意)</span></label>
            <input type="url" id="m-url" value="${esc(g?.url||'')}" placeholder="https://line.me/ti/g/xxxxxxxx">
            <div class="hint">
              LINE アプリ → 対象グループ → 右上「≡」→ 招待 → リンクをコピー<br>
              空欄なら「未設定」で保存 (後から追加可)
            </div>
          </div>
          <div class="m-actions">
            <button class="btn" data-act="cancel">キャンセル</button>
            <button class="btn primary" data-act="save">保存</button>
          </div>
        </div>
      </div>`;
    $('modal-root').innerHTML = html;
    const root = $('modal-root').firstElementChild;
    const close = () => root.remove();
    root.querySelector('[data-act="cancel"]').onclick = close;
    root.addEventListener('click', (e) => { if (e.target === root) close(); });
    root.querySelector('[data-act="save"]').onclick = async () => {
      const cat = $('m-cat').value;
      const name = $('m-name').value.trim();
      const url = $('m-url').value.trim();
      if (!name) { toast('グループ名は必須です', true); return; }
      if (url && !/^https?:\/\//.test(url)) { toast('URL は http(s):// で始めてください', true); return; }
      try {
        if (isNew) {
          const maxSort = Math.max(0, ...allGroups.map(x => x.sort_order || 0));
          const { error } = await sb.from('line_groups').insert({
            category: cat, name, url: url || null, sort_order: maxSort + 10, is_active: true
          });
          if (error) throw error;
          toast('追加しました');
        } else {
          const { error } = await sb.from('line_groups').update({ url: url || null }).eq('id', g.id);
          if (error) throw error;
          toast('保存しました');
        }
        close();
        await load();
      } catch(e){ toast('保存失敗: ' + (e.message||e), true); }
    };
    setTimeout(() => (isNew ? $('m-name') : $('m-url')).focus(), 60);
  }

  function openBulkModal(){
    const sample = '店舗\tにじいろ\thttps://line.me/ti/g/xxx\n店舗\t新店\n単独\t会議室\thttps://line.me/ti/g/yyy';
    const html = `
      <div class="backdrop">
        <div class="modal">
          <h3>📋 複数一括追加</h3>
          <div class="field">
            <label>1行 = 1グループ (タブ or | 区切り)</label>
            <textarea id="m-bulk" placeholder="${esc(sample)}"></textarea>
            <div class="hint">
              形式: <code>カテゴリ ⇥ 名前 ⇥ URL(任意)</code><br>
              カテゴリ = <code>店舗</code> or <code>単独</code><br>
              Excel/スプレッドシートから 3列コピペ可
            </div>
          </div>
          <div class="m-actions">
            <button class="btn" data-act="cancel">キャンセル</button>
            <button class="btn primary" data-act="save">一括追加</button>
          </div>
        </div>
      </div>`;
    $('modal-root').innerHTML = html;
    const root = $('modal-root').firstElementChild;
    const close = () => root.remove();
    root.querySelector('[data-act="cancel"]').onclick = close;
    root.addEventListener('click', (e) => { if (e.target === root) close(); });
    root.querySelector('[data-act="save"]').onclick = async () => {
      const raw = $('m-bulk').value;
      const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (!lines.length) { toast('内容を入力してください', true); return; }
      const parsed = [];
      const errors = [];
      lines.forEach((line, i) => {
        const parts = line.split(/[\t|]/).map(s => s.trim());
        if (parts.length < 2) { errors.push(`行${i+1}: 区切り不足`); return; }
        const [catRaw, name, urlRaw] = parts;
        const cat = /^(店舗|store)$/i.test(catRaw) ? 'store'
                  : /^(単独|solo)$/i.test(catRaw) ? 'solo' : null;
        if (!cat) { errors.push(`行${i+1}: カテゴリ不正 (${catRaw})`); return; }
        if (!name) { errors.push(`行${i+1}: 名前が空`); return; }
        const url = (urlRaw||'').trim();
        if (url && !/^https?:\/\//.test(url)) { errors.push(`行${i+1}: URL 形式不正`); return; }
        parsed.push({ category: cat, name, url: url || null });
      });
      if (errors.length) { toast('入力エラー: ' + errors[0], true); return; }
      if (!parsed.length) { toast('有効な行がありません', true); return; }
      let base = Math.max(0, ...allGroups.map(g => g.sort_order || 0));
      const payload = parsed.map(p => ({
        ...p,
        sort_order: (base += 10),
        is_active: true
      }));
      try {
        const { error } = await sb.from('line_groups').insert(payload);
        if (error) throw error;
        toast(`${payload.length}件 追加しました`);
        close();
        await load();
      } catch(e){ toast('一括追加失敗: ' + (e.message||e), true); }
    };
    setTimeout(() => $('m-bulk').focus(), 60);
  }

  async function deleteGroup(g){
    if (!confirm(`「${g.name}」を削除しますか？\n(この操作は取り消せません)`)) return;
    try {
      const { error } = await sb.from('line_groups').delete().eq('id', g.id);
      if (error) throw error;
      selected.delete(g.id);
      toast('削除しました');
      await load();
    } catch(e){ toast('削除失敗: ' + (e.message||e), true); }
  }

  load();
})();
</script>

</body>
</html>
