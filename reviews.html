<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEISHOKAI 口コミ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700;900&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fafaf7;
  --ink:#1a1a1a;
  --sub:#888;
  --line:#e8e5de;
}
body{font-family:'Noto Serif JP','Hiragino Mincho ProN','YuMincho','Yu Mincho',serif;background:var(--bg);min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"palt";letter-spacing:0.02em;font-weight:400}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}

#topbar{background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:200}
#back-btn{font-size:13px;color:var(--sub);font-weight:400;transition:color .15s}
#back-btn:hover{color:var(--ink)}
.logo{font-size:19px;font-weight:700;letter-spacing:0.04em}
.spacer{flex:1}
#reload-btn{font-size:12px;font-weight:400;color:var(--sub);padding:6px 14px;border:1px solid var(--line);border-radius:2px;transition:all .2s}
#reload-btn:hover{border-color:var(--ink);color:var(--ink)}
#reload-btn:disabled{opacity:0.4;cursor:wait}

.container{max-width:780px;margin:0 auto;padding:50px 24px 80px}
.title{text-align:center;margin-bottom:44px}
.title h1{font-size:30px;font-weight:600;letter-spacing:0.08em;margin-bottom:8px}
.title p{font-size:13px;color:var(--sub);letter-spacing:0.15em;font-weight:300}

.toolbar{display:flex;align-items:center;gap:18px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.search{flex:1}
.search input{width:100%;padding:8px 0;border:none;background:transparent;font-size:14px;font-family:inherit;letter-spacing:0.03em;color:var(--ink)}
.search input::placeholder{color:#bbb;font-weight:300}
.search input:focus{outline:none}
.count{font-size:12px;color:var(--sub);font-weight:400;letter-spacing:0.08em;white-space:nowrap}
.count b{color:var(--ink);font-weight:600;font-family:'Cormorant Garamond',serif;font-size:18px;margin-right:3px}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:48px 1fr auto auto;align-items:baseline;gap:20px;padding:20px 4px;border-bottom:1px solid var(--line);transition:background .12s}
.row:hover{background:#fff}
.row .num{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--sub);text-align:center;font-style:italic}
.row .fac{font-size:18px;font-weight:500;letter-spacing:0.04em}
.row .rating{display:flex;align-items:baseline;gap:10px;min-width:160px;justify-content:flex-end}
.row .stars{color:#c9a961;font-size:13px;letter-spacing:2px;font-family:serif}
.row .score{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;min-width:64px;text-align:right;letter-spacing:0.02em}
.row .posts{font-size:12px;color:var(--sub);min-width:70px;text-align:right;font-weight:300;letter-spacing:0.06em}
.row .posts b{color:var(--ink);font-weight:500;font-family:'Cormorant Garamond',serif;font-size:16px;margin-right:3px}
.row.pinned{opacity:0.4}
.row.pinned .num{font-size:13px}

#status{text-align:center;padding:80px 20px;color:var(--sub);font-size:13px;letter-spacing:0.15em;font-weight:300}
.error{color:#8b1e1e;background:#fff;border:1px solid #e8d5d5;padding:18px 22px;margin:20px auto;max-width:520px;font-size:13px;line-height:1.8}

@media (max-width:640px){
  #topbar{padding:12px 16px}
  .container{padding:32px 16px 60px}
  .title h1{font-size:24px}
  .row{grid-template-columns:32px 1fr auto;gap:12px;padding:16px 2px}
  .row .posts{display:none}
  .row .fac{font-size:16px}
  .row .score{font-size:22px;min-width:52px}
  .row .rating{min-width:120px}
  .row .stars{font-size:11px;letter-spacing:1px}
}
</style>
</head>
<body>

<div id="topbar">
  <button id="back-btn" onclick="location.href='https://seishokai.github.io/clinic-analysis/'">← 戻る</button>
  <div class="logo">清翔会</div>
  <div class="spacer"></div>
  <button id="reload-btn" onclick="loadData()">再読込</button>
</div>

<div class="container">
  <div class="title">
    <h1>口コミ平均点</h1>
    <p>医院別 ランキング</p>
  </div>

  <div id="status">読み込み中</div>

  <div id="content" style="display:none">
    <div class="toolbar">
      <div class="search"><input type="text" id="search" placeholder="医院名で検索"></div>
      <div class="count"><b id="count">0</b>件</div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ6gRkfrqoNADOQvmOeum8kOq3QgnOV9MX9MzucD5j8s8FGeKy_uRA1Slv8aIseZ10jdJJtMRtr8y0/pub?gid=269604636&single=true&output=csv';

const CLINIC_ALIAS = [
  ['エルエル','エルエル'],['茶屋','茶屋'],['アール','アール'],['知立','知立'],
  ['エスカ','エスカ'],['ウィズ','ウィズ'],['ウイズ','ウィズ'],['ルミナス','ルミナス'],
  ['小牧','小牧'],['みなみ','みなみ'],['あおい','あおい'],['さくらい','さくらい'],
  ['大森','大森'],['京都','京都'],['銀座','銀座'],['八事','八事'],
  ['アサノ','アサノ'],['あさの','アサノ']
];

function shortClinic(s){
  const src = String(s||'');
  for(const [key, label] of CLINIC_ALIAS){
    if(src.includes(key)) return label;
  }
  return src.replace(/歯科・矯正歯科|矯正歯科・歯科|歯科・矯正|矯正・歯科|歯科医院|矯正歯科|歯科/g,'').trim();
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQ = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"' && text[i+1] === '"'){ field += '"'; i++; }
      else if(c === '"') inQ = false;
      else field += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let allData = [];
const isPinned = name => /久屋|ルーセント|ﾙｰｾﾝﾄ|lucent/i.test(name);

async function loadData(){
  const statusEl = document.getElementById('status');
  const contentEl = document.getElementById('content');
  const reloadBtn = document.getElementById('reload-btn');
  reloadBtn.disabled = true;
  statusEl.style.display = 'block';
  statusEl.textContent = '読み込み中';
  contentEl.style.display = 'none';

  try {
    const res = await fetch(CSV_URL + '&_t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text).filter(r => r.some(c => c && String(c).trim()));
    if(rows.length < 2) throw new Error('データが空です');

    const headRows = rows.slice(0, Math.min(3, rows.length));
    const dataStart = headRows.length;
    const numCols = Math.max(...rows.map(r => r.length));
    const colText = Array.from({length: numCols}, (_, c) =>
      headRows.map(r => (r[c]||'').trim()).join(' ').trim()
    );

    let facilityIdx = colText.findIndex(t => /医院|院名|店舗/i.test(t));
    if(facilityIdx < 0){
      for(let c = 0; c < numCols; c++){
        const vals = rows.slice(dataStart).map(r => r[c]||'');
        const hits = vals.filter(v => CLINIC_ALIAS.some(([k]) => String(v).includes(k)) || /歯科|矯正/.test(v)).length;
        if(hits > vals.length * 0.3){ facilityIdx = c; break; }
      }
    }

    const ratingCols = [];
    for(let c = 0; c < numCols; c++){
      if(c === facilityIdx) continue;
      if(/平均|評価|rating|スコア|score/i.test(colText[c])){ ratingCols.push(c); continue; }
      const vals = rows.slice(dataStart).map(r => parseFloat(String(r[c]||'').replace(/[^\d.-]/g,''))).filter(n => !isNaN(n));
      if(vals.length >= 3){
        const inRange = vals.filter(n => n >= 1 && n <= 5).length;
        if(inRange / vals.length > 0.8 && vals.some(n => n % 1 !== 0)) ratingCols.push(c);
      }
    }

    const countCols = [];
    for(let c = 0; c < numCols; c++){
      if(c === facilityIdx || ratingCols.includes(c)) continue;
      if(/投稿|件数|口コミ数|レビュー数|count/i.test(colText[c])) countCols.push(c);
    }

    const data = [];
    for(let r = dataStart; r < rows.length; r++){
      const row = rows[r];
      const facRaw = facilityIdx >= 0 ? (row[facilityIdx]||'').trim() : '';
      if(!facRaw) continue;
      const ratings = ratingCols.map(c => parseFloat(String(row[c]||'').replace(/[^\d.-]/g,''))).filter(n => !isNaN(n) && n >= 1 && n <= 5);
      const avg = ratings.length ? ratings.reduce((s,n)=>s+n,0)/ratings.length : null;
      const counts = countCols.map(c => parseFloat(String(row[c]||'').replace(/[^\d.-]/g,''))).filter(n => !isNaN(n));
      const totalCount = counts.reduce((s,n)=>s+n,0);
      data.push({ name: shortClinic(facRaw), raw: facRaw, avg, posts: totalCount });
    }

    allData = data;
    statusEl.style.display = 'none';
    contentEl.style.display = 'block';
    render();
  } catch(e){
    statusEl.innerHTML = `<div class="error"><b>読み込みに失敗しました</b><br>${escapeHtml(e.message)}</div>`;
  } finally {
    reloadBtn.disabled = false;
  }
}

function stars(n){
  if(n == null) return '';
  const full = Math.round(n);
  return '★'.repeat(full) + '☆'.repeat(5-full);
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let rows = allData.filter(r => !q || (r.name + ' ' + r.raw).toLowerCase().includes(q));

  rows.sort((a, b) => {
    const pa = isPinned(a.raw), pb = isPinned(b.raw);
    if(pa !== pb) return pa ? 1 : -1;
    return (b.avg||0) - (a.avg||0);
  });

  document.getElementById('count').textContent = rows.length;
  const rankable = rows.filter(r => !isPinned(r.raw));

  document.getElementById('list').innerHTML = rows.map(r => {
    const pinned = isPinned(r.raw);
    const rank = pinned ? '—' : (rankable.indexOf(r) + 1);
    return `
      <div class="row ${pinned?'pinned':''}">
        <div class="num">${rank}</div>
        <div class="fac">${escapeHtml(r.name)}</div>
        <div class="rating">
          <div class="stars">${stars(r.avg)}</div>
          <div class="score">${r.avg != null ? r.avg.toFixed(2) : '—'}</div>
        </div>
        <div class="posts">${r.posts ? `<b>${r.posts}</b>件` : ''}</div>
      </div>
    `;
  }).join('');
}

document.getElementById('search').addEventListener('input', render);
loadData();
</script>
</body>
</html>
