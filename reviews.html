<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEISHOKAI 口コミ一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;background:#f5f5f5;color:#111;-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
button{cursor:pointer;font-family:inherit;border:none;background:none}

#topbar{background:#fff;border-bottom:2px solid #111;padding:11px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200}
#back-btn{border:1.5px solid #ddd;border-radius:6px;padding:5px 12px;font-size:12px;background:#fff;color:#666;font-weight:600}
#back-btn:hover{background:#f5f5f5}
.logo{font-size:17px;font-weight:900;letter-spacing:-0.5px}
.sub{font-size:11px;color:#aaa;margin-top:1px}
.spacer{flex:1}
#reload-btn{border:1.5px solid #111;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;background:#111;color:#fff}
#reload-btn:disabled{opacity:0.5;cursor:wait}

#container{max-width:1400px;margin:0 auto;padding:16px 14px 60px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search-box{flex:1;min-width:220px;position:relative}
.search-box input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid #e5e5e5;border-radius:8px;font-size:13px;background:#fff;font-family:inherit}
.search-box input:focus{outline:none;border-color:#111}
.search-box::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.5;font-size:13px}
.count-badge{padding:6px 12px;background:#111;color:#fff;border-radius:6px;font-size:12px;font-weight:700}

#status{text-align:center;padding:60px 20px;color:#999;font-size:14px}
.error{color:#b91c1c;background:#fff0f0;border:1px solid #fecaca;padding:14px 18px;border-radius:10px;margin-bottom:18px;font-size:13px;line-height:1.6}

.table-wrap{background:#fff;border:1px solid #e5e5e5;border-radius:10px;overflow:auto;max-height:calc(100vh - 180px)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{background:#f9f9f9;position:sticky;top:0;z-index:5;border-bottom:2px solid #111;padding:10px 12px;font-weight:700;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;color:#111}
thead th:hover{background:#f0f0f0}
thead th .arrow{opacity:0.3;margin-left:4px;font-size:10px}
thead th.sorted .arrow{opacity:1;color:#111}
tbody td{padding:9px 12px;border-bottom:1px solid #f0f0f0;vertical-align:top;line-height:1.55;color:#333;max-width:420px;word-break:break-word;white-space:pre-wrap}
tbody tr:hover{background:#fafafa}
tbody td.rating-cell{color:#f5a623;font-weight:700;white-space:nowrap}
tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody td a{color:#1d4ed8;text-decoration:none}
tbody td a:hover{text-decoration:underline}

@media (max-width:640px){
  #container{padding:10px 8px 40px}
  .toolbar{gap:6px}
  .search-box{min-width:100%}
  table{font-size:11.5px}
  thead th,tbody td{padding:7px 8px}
  tbody td{max-width:260px}
}
</style>
</head>
<body>

<div id="topbar">
  <button id="back-btn" onclick="location.href='https://seishokai.github.io/clinic-analysis/'">← ポータル</button>
  <div>
    <div class="logo">SEISHOKAI</div>
    <div class="sub">口コミ一覧</div>
  </div>
  <div class="spacer"></div>
  <button id="reload-btn" onclick="loadData()">再読込</button>
</div>

<div id="container">
  <div id="status">読み込み中...</div>
  <div id="content" style="display:none">
    <div class="toolbar">
      <div class="search-box"><input type="text" id="search" placeholder="全列を検索"></div>
      <span class="count-badge" id="count">0件</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ6gRkfrqoNADOQvmOeum8kOq3QgnOV9MX9MzucD5j8s8FGeKy_uRA1Slv8aIseZ10jdJJtMRtr8y0/pub?output=csv';

let headers = [];
let allRows = [];
let sortCol = -1;
let sortDir = 1;

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQ = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"' && text[i+1] === '"'){ field += '"'; i++; }
      else if(c === '"') inQ = false;
      else field += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function linkify(s){
  return escapeHtml(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
}

function isRatingCol(name){
  return /評価|星|rating|★|score|点/i.test(name);
}
function isNumCol(name){
  return /件数|数$|金額|price|count|total|合計/i.test(name);
}
function formatRating(v){
  const s = String(v||'').trim();
  const m = s.match(/([1-5](?:\.\d)?)/);
  if(m){
    const n = parseFloat(m[1]);
    const full = Math.floor(n);
    return '★'.repeat(full) + '☆'.repeat(5-full) + ' ' + n.toFixed(1);
  }
  return s;
}

async function loadData(){
  const statusEl = document.getElementById('status');
  const contentEl = document.getElementById('content');
  const reloadBtn = document.getElementById('reload-btn');
  reloadBtn.disabled = true;
  statusEl.style.display = 'block';
  statusEl.innerHTML = '読み込み中...';
  contentEl.style.display = 'none';

  try {
    const res = await fetch(CSV_URL + '&_t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text).filter(r => r.some(c => c && String(c).trim()));
    if(rows.length < 1) throw new Error('データが空です');

    headers = rows[0].map(h => (h || '').trim());
    allRows = rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = r[i] || '');
      return obj;
    });

    statusEl.style.display = 'none';
    contentEl.style.display = 'block';
    renderHead();
    render();
  } catch(e){
    statusEl.innerHTML = `<div class="error"><b>読み込みに失敗しました</b><br>${escapeHtml(e.message)}</div>`;
  } finally {
    reloadBtn.disabled = false;
  }
}

function renderHead(){
  const thead = document.getElementById('thead');
  thead.innerHTML = headers.map((h, i) => {
    const isSorted = sortCol === i;
    const arrow = isSorted ? (sortDir === 1 ? '▲' : '▼') : '↕';
    return `<th data-col="${i}" class="${isSorted?'sorted':''}">${escapeHtml(h)}<span class="arrow">${arrow}</span></th>`;
  }).join('');
  thead.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const i = +th.dataset.col;
      if(sortCol === i) sortDir = -sortDir;
      else { sortCol = i; sortDir = 1; }
      renderHead();
      render();
    });
  });
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let rows = allRows.filter(r => {
    if(!q) return true;
    return headers.some(h => String(r[h]||'').toLowerCase().includes(q));
  });

  if(sortCol >= 0){
    const key = headers[sortCol];
    rows = [...rows].sort((a,b) => {
      const va = a[key]||'', vb = b[key]||'';
      const na = parseFloat(String(va).replace(/[^\d.-]/g,''));
      const nb = parseFloat(String(vb).replace(/[^\d.-]/g,''));
      if(!isNaN(na) && !isNaN(nb)) return (na-nb)*sortDir;
      return String(va).localeCompare(String(vb), 'ja') * sortDir;
    });
  }

  document.getElementById('count').textContent = `${rows.length}件`;

  const tbody = document.getElementById('tbody');
  if(!rows.length){
    tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align:center;padding:40px;color:#999">該当データがありません</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => {
    return '<tr>' + headers.map(h => {
      const v = r[h] || '';
      if(isRatingCol(h)) return `<td class="rating-cell">${escapeHtml(formatRating(v))}</td>`;
      if(isNumCol(h)) return `<td class="num">${escapeHtml(v)}</td>`;
      return `<td>${linkify(v)}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

document.getElementById('search').addEventListener('input', render);

loadData();
</script>
</body>
</html>
