<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>デンタルローン シミュレーション / Aladdin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<style>
  :root{
    --bg:#fafafa; --card:#fff; --border:#e5e7eb; --text:#1a1a1a; --text-sub:#6b7280;
    --accent:#1a1a1a; --hi:#fffbea; --hi-border:#d4a010; --hi-text:#b07800;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',Meiryo,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px; margin:0 auto; padding:32px 20px 60px}
  header{text-align:center; margin-bottom:32px}
  .brand{
    font-family:'Great Vibes', cursive; font-size:56px; line-height:1;
    background:linear-gradient(135deg,#1a1a1a 0%,#555 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    margin:0;
  }
  .subtitle{font-size:13px; letter-spacing:3px; color:var(--text-sub); margin-top:6px; text-transform:uppercase}
  h1{font-size:20px; font-weight:700; margin:24px 0 4px; letter-spacing:1px}
  .lead{font-size:13px; color:var(--text-sub); margin:0 0 24px}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:24px; margin-bottom:20px;
  }
  .field{margin-bottom:18px}
  .field:last-child{margin-bottom:0}
  .field label{
    display:block; font-size:12px; font-weight:600; color:var(--text-sub);
    letter-spacing:1px; text-transform:uppercase; margin-bottom:8px;
  }
  .input-row{display:flex; align-items:stretch; gap:0; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#fff}
  .input-row:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,0,0,.05)}
  .input-row input{
    flex:1; min-width:0; padding:14px 16px; font-size:18px; font-weight:600;
    border:none; outline:none; background:transparent; color:var(--text);
    text-align:right; font-family:inherit;
  }
  .input-row .unit{
    display:flex; align-items:center; padding:0 16px; font-size:13px; color:var(--text-sub);
    background:#f5f5f5; border-left:1px solid var(--border); white-space:nowrap;
  }
  .field .hint{font-size:11px; color:var(--text-sub); margin-top:6px}
  input[type="range"]{width:100%; margin-top:8px; accent-color:#1a1a1a}

  .result-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:480px){.result-grid{grid-template-columns:1fr}}
  .result-box{
    background:#fff; border:2px solid var(--accent); border-radius:12px;
    padding:20px; text-align:center;
  }
  .result-box.primary{
    background:linear-gradient(135deg,#fffbea 0%,#fff 100%);
    border-color:var(--hi-border);
  }
  .result-label{font-size:11px; font-weight:700; letter-spacing:2px; color:var(--text-sub); text-transform:uppercase}
  .result-value{font-size:32px; font-weight:800; margin-top:8px; letter-spacing:-1px; line-height:1}
  .result-value .yen{font-size:18px; font-weight:600; color:var(--text-sub); margin-right:2px}
  .result-box.primary .result-value{color:var(--hi-text)}

  .compare{margin-top:32px}
  .compare h2{font-size:14px; font-weight:700; letter-spacing:2px; margin:0 0 12px; text-transform:uppercase; color:var(--text-sub)}
  table{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; font-size:13px}
  th,td{padding:11px 10px; text-align:right; border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#f5f5f5; font-weight:700; color:var(--text-sub); font-size:11px; letter-spacing:1px; text-transform:uppercase}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.current{background:#fffbea}
  tbody tr.current td{font-weight:700; color:var(--hi-text)}

  footer{text-align:center; margin-top:40px; font-size:11px; color:var(--text-sub); letter-spacing:1px}
  .note{font-size:11px; color:var(--text-sub); margin-top:14px; line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Aladdin</div>
    <div class="subtitle">Dental Loan Simulator</div>
  </header>

  <h1>デンタルローン シミュレーション</h1>
  <p class="lead">借入金額・年利・支払年数を入力すると、月々の支払額と支払総額がリアルタイムで表示されます。</p>

  <div class="card">
    <div class="field">
      <label for="amount">借入金額（元金）</label>
      <div class="input-row">
        <input id="amount" type="number" min="10000" max="10000000" step="10000" value="660000" inputmode="numeric">
        <span class="unit">円</span>
      </div>
      <input id="amount-range" type="range" min="50000" max="3000000" step="10000" value="660000">
    </div>

    <div class="field">
      <label for="rate">年利</label>
      <div class="input-row">
        <input id="rate" type="number" min="0" max="20" step="0.1" value="3.7" inputmode="decimal">
        <span class="unit">%</span>
      </div>
      <input id="rate-range" type="range" min="0" max="15" step="0.1" value="3.7">
    </div>

    <div class="field">
      <label for="years">支払年数</label>
      <div class="input-row">
        <input id="years" type="number" min="1" max="30" step="1" value="10" inputmode="numeric">
        <span class="unit">年</span>
      </div>
      <input id="years-range" type="range" min="1" max="20" step="1" value="10">
    </div>
  </div>

  <div class="result-grid">
    <div class="result-box primary">
      <div class="result-label">月々の支払額</div>
      <div class="result-value"><span class="yen">¥</span><span id="monthly">6,588</span></div>
    </div>
    <div class="result-box">
      <div class="result-label">支払総額</div>
      <div class="result-value"><span class="yen">¥</span><span id="total">790,618</span></div>
    </div>
  </div>

  <div class="note">
    ※ 元利均等返済方式で計算。実際の返済額は提携ローン会社の審査・条件により異なります。
  </div>

  <div class="compare">
    <h2>金利別 比較</h2>
    <table>
      <thead>
        <tr>
          <th>年利</th>
          <th>月々</th>
          <th>支払総額</th>
          <th>利息</th>
        </tr>
      </thead>
      <tbody id="compare-tbody"></tbody>
    </table>
  </div>

  <footer>SEISHOKAI Group / Aladdin</footer>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ja-JP');
  const fmtFix = n => Number(n).toFixed(1);

  // 元利均等返済 月々支払額
  function calcMonthly(principal, annualRate, years){
    if (!(principal > 0) || !(years > 0)) return 0;
    const n = years * 12;
    const r = (annualRate / 100) / 12;
    if (r === 0) return principal / n;
    const factor = Math.pow(1 + r, n);
    return principal * r * factor / (factor - 1);
  }

  function update(){
    const p = Math.max(0, Number($('amount').value) || 0);
    const r = Math.max(0, Number($('rate').value) || 0);
    const y = Math.max(1, Number($('years').value) || 1);

    const m = calcMonthly(p, r, y);
    const total = m * y * 12;
    $('monthly').textContent = fmt(m);
    $('total').textContent = fmt(total);

    // 比較表 (現在金利 ± 各種)
    const rates = [...new Set([r, 3.7, 3.8, 4.5, 5.4].map(x => Math.round(x*10)/10))]
      .sort((a,b)=>a-b);
    const tb = $('compare-tbody');
    tb.innerHTML = rates.map(rt => {
      const mm = calcMonthly(p, rt, y);
      const tt = mm * y * 12;
      const interest = tt - p;
      const isCurrent = Math.abs(rt - r) < 0.05;
      return `<tr class="${isCurrent ? 'current' : ''}">
        <td>${fmtFix(rt)}%</td>
        <td>¥${fmt(mm)}</td>
        <td>¥${fmt(tt)}</td>
        <td>¥${fmt(interest)}</td>
      </tr>`;
    }).join('');
  }

  // 数値↔レンジ 双方向
  function bind(numId, rangeId){
    const num = $(numId), range = $(rangeId);
    num.addEventListener('input', () => { range.value = num.value; update(); });
    range.addEventListener('input', () => { num.value = range.value; update(); });
  }
  bind('amount','amount-range');
  bind('rate','rate-range');
  bind('years','years-range');

  update();
})();
</script>
</body>
</html>
