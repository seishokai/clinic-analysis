<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>矯正アドバンス 音声解説動画</title>
<style>
:root{
  --bg:#ffffff;--surface:#f6f8fa;--card:#ffffff;
  --border:#d0d7de;--text:#1f2328;--muted:#656d76;
  --accent:#3ecf8e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}

/* ===== LAYOUT ===== */
.wrap{display:flex;flex-direction:column;height:100vh;max-width:960px;margin:0 auto}

/* top bar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;border-bottom:1px solid var(--border);
  background:#ffffff;flex-shrink:0;height:56px;
  box-shadow:0 1px 3px rgba(0,0,0,.07);
}
.logo-wrap{display:flex;align-items:center;gap:14px}
.logo-mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,#1a6b47 0%,#3ecf8e 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;
}
.logo-text{display:flex;flex-direction:column;gap:1px}
.logo-clinic{
  font-size:10px;font-weight:700;letter-spacing:.18em;
  color:#1a6b47;text-transform:uppercase;
}
.logo-title{
  font-size:14px;font-weight:700;color:#1f2328;letter-spacing:.02em;
  white-space:nowrap;
}
.logo-sub{
  font-size:10px;color:#656d76;font-weight:400;letter-spacing:.04em;
}
.logo{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-bg{width:160px;height:3px;background:var(--border);border-radius:999px}
.prog-bar{height:3px;border-radius:999px;background:var(--accent);transition:width .5s}
.prog-num{font-size:12px;color:var(--muted)}

/* main stage */
.stage{
  flex:1;display:grid;grid-template-columns:1fr 1fr;
  overflow:hidden;
}

/* LEFT: visual */
.visual-pane{
  display:flex;flex-direction:column;
  background:var(--bg);padding:20px;gap:12px;
  border-right:1px solid var(--border);overflow:hidden;
}
.ch-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 14px;border-radius:999px;
  font-size:11px;font-weight:700;
  width:fit-content;
  transition:background .3s,color .3s,border-color .3s;
}
.scene-title-big{
  font-size:21px;font-weight:700;line-height:1.3;
  min-height:56px;
}
.img-box{
  flex:1;border-radius:12px;overflow:hidden;
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  background:var(--card);cursor:zoom-in;
  transition:transform .2s;min-height:0;
}
.img-box:hover{transform:scale(1.01)}
.img-box img{width:100%;height:100%;object-fit:cover}
.no-img{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  color:var(--muted);font-size:13px;
}
.no-img-icon{font-size:40px;opacity:.25}

/* waveform animation */
.wave{display:flex;align-items:center;gap:3px;height:28px}
.wave-bar{
  width:3px;border-radius:2px;
  background:var(--accent);
  animation:wave-anim 1.2s ease-in-out infinite;
  transform-origin:bottom;
}
.wave-bar:nth-child(2){animation-delay:.1s;height:14px}
.wave-bar:nth-child(3){animation-delay:.2s;height:20px}
.wave-bar:nth-child(4){animation-delay:.3s;height:10px}
.wave-bar:nth-child(5){animation-delay:.4s;height:18px}
.wave-bar:nth-child(6){animation-delay:.15s;height:24px}
.wave-bar:nth-child(7){animation-delay:.25s;height:12px}
.wave-bar:nth-child(1){height:16px}
@keyframes wave-anim{
  0%,100%{transform:scaleY(.4);opacity:.6}
  50%{transform:scaleY(1);opacity:1}
}
.wave.paused .wave-bar{animation-play-state:paused}

/* RIGHT: narration + points */
.narration-pane{
  display:flex;flex-direction:column;padding:20px;gap:14px;
  background:var(--surface);overflow:hidden;
}
.speaker-row{display:flex;align-items:flex-start;gap:10px;flex-shrink:0}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#3ecf8e,#60a5fa);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.bubble{
  flex:1;background:#f6f8fa;border:1px solid var(--border);
  border-radius:0 12px 12px 12px;
  padding:12px 14px;font-size:13.5px;line-height:1.85;
  color:#24292f;min-height:80px;position:relative;
}
.bubble::before{
  content:'';position:absolute;left:-8px;top:12px;
  border:5px solid transparent;border-right-color:var(--border);
}
.bubble::after{
  content:'';position:absolute;left:-6px;top:13px;
  border:4px solid transparent;border-right-color:var(--card);
}
.cursor{
  display:inline-block;width:2px;height:1.1em;
  background:var(--accent);animation:blink .7s infinite;
  vertical-align:text-bottom;margin-left:1px;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.pts-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;flex-shrink:0}
.pts-list{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1}
.pt-item{
  display:flex;align-items:flex-start;gap:8px;
  padding:9px 12px;border-radius:8px;
  background:#f6f8fa;border:1px solid var(--border);
  font-size:12.5px;color:var(--text);line-height:1.6;
  opacity:0;transform:translateY(6px);
  transition:opacity .4s,transform .4s;
}
.pt-item.show{opacity:1;transform:translateY(0)}
.pt-dot{width:6px;height:6px;min-width:6px;border-radius:50%;background:var(--accent);margin-top:6px}

/* ===== CONTROLS ===== */
.controls{
  background:var(--surface);border-top:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.nav-btn{
  padding:8px 16px;border-radius:8px;
  border:1px solid var(--border);background:var(--card);
  color:var(--text);font-size:13px;cursor:pointer;
  transition:all .2s;font-family:inherit;white-space:nowrap;
}
.nav-btn:hover:not(:disabled){background:var(--border)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.primary{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:700}
.nav-btn.primary:hover:not(:disabled){background:#2db87a}

.center-ctrl{flex:1;display:flex;align-items:center;gap:10px;justify-content:center}
.play-btn{
  width:46px;height:46px;border-radius:50%;border:none;
  background:var(--accent);color:#0d1117;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;box-shadow:0 0 0 0 rgba(62,207,142,.4);
}
.play-btn:hover{box-shadow:0 0 0 8px rgba(62,207,142,.15)}
.play-btn.playing{background:#0969da;animation:pulse 1.5s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(96,165,250,.5)}
  70%{box-shadow:0 0 0 10px rgba(96,165,250,0)}
  100%{box-shadow:0 0 0 0 rgba(96,165,250,0)}
}
.timeline{
  flex:1;height:4px;background:var(--border);border-radius:999px;
  cursor:pointer;overflow:hidden;max-width:300px;
}
.tl-fill{height:100%;background:#0969da;border-radius:999px;transition:width .2s}

.speed-wrap{display:flex;gap:4px}
.spd-btn{
  padding:4px 9px;border-radius:6px;
  border:1px solid var(--border);background:transparent;
  color:var(--muted);font-size:11px;cursor:pointer;
  transition:all .2s;font-family:inherit;
}
.spd-btn.on{color:var(--accent);border-color:var(--accent)}
.voice-select{
  padding:5px 8px;border-radius:6px;
  border:1px solid var(--border);background:var(--card);
  color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;
  max-width:90px;
}

/* Lightbox */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;
  align-items:center;justify-content:center;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:92vh;border-radius:8px}

/* TTS warning */
.tts-notice{
  font-size:11px;color:var(--muted);padding:6px 10px;
  border-radius:6px;background:var(--card);border:1px solid var(--border);
  white-space:nowrap;
}

@media(max-width:600px){
  .stage{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .timeline{max-width:140px}
}

/* ===== SPLASH (initial top screen) ===== */
.splash{
  position:fixed;inset:0;z-index:50;
  background:#ffffff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:40px;padding:40px;
  transition:opacity .4s;
}
.splash.hide{opacity:0;pointer-events:none}
.splash-logo-mark{
  width:88px;height:88px;border-radius:20px;
  background:linear-gradient(135deg,#1a6b47 0%,#3ecf8e 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;
  box-shadow:0 10px 30px rgba(26,107,71,.25);
}
.splash-clinic{
  font-size:14px;font-weight:700;letter-spacing:.28em;
  color:#1a6b47;text-transform:uppercase;
}
.splash-title{
  font-size:34px;font-weight:700;color:#1f2328;letter-spacing:.04em;
  margin-top:6px;
}
.splash-sub{font-size:13px;color:#656d76;margin-top:4px;letter-spacing:.08em}
.splash-ctrl{display:flex;align-items:center;gap:18px;margin-top:8px}
.splash .play-btn{width:64px;height:64px;font-size:24px}
.splash .spd-btn{padding:6px 12px;font-size:12px}
.splash .nav-btn.primary{padding:10px 22px;font-size:14px}
</style>
</head>
<body>

<!-- Splash (initial top screen) -->
<div class="splash" id="splash">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="splash-clinic">SEISHOKAI</div>
    <div class="splash-title">矯正アドバンス</div>
    <div class="splash-sub">音声解説動画</div>
  </div>
  <div class="splash-ctrl">
    <button class="play-btn" onclick="startFromSplash(true)">▶</button>
    <div class="speed-wrap">
      <button class="spd-btn on" id="s1_sp" onclick="setSpeed(1)">1x</button>
      <button class="spd-btn" id="s15_sp" onclick="setSpeed(1.5)">1.5x</button>
      <button class="spd-btn" id="s2_sp" onclick="setSpeed(2)">2x</button>
    </div>
    <button class="nav-btn primary" onclick="startFromSplash(false)">次へ →</button>
  </div>
</div>

<div class="wrap">

  <!-- Top bar -->
  <div class="topbar">
    <div class="logo-wrap">
      <div class="logo-mark">🦷</div>
      <div class="logo-text">
        <div class="logo-clinic">SEISHOKAI</div>
        <div class="logo-title">矯正アドバンス&emsp;解説動画</div>
      </div>
    </div>
    <div class="prog-wrap">
      <div class="prog-bg"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
      <div class="prog-num" id="progNum">1 / 16</div>
    </div>
  </div>

  <!-- Stage -->
  <div class="stage">

    <!-- LEFT: visual -->
    <div class="visual-pane">
      <div class="ch-pill" id="chPill"></div>
      <div class="scene-title-big" id="sceneTitle"></div>
      <div class="img-box" id="imgBox" onclick="openLB()"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="wave" id="wave">
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <span style="font-size:11px;color:var(--muted)" id="waveLabel">▶ 再生ボタンで音声解説スタート</span>
      </div>
    </div>

    <!-- RIGHT: narration + points -->
    <div class="narration-pane">
      <div class="speaker-row">
        <div class="avatar">👨‍⚕️</div>
        <div class="bubble">
          <span id="bubbleText"></span><span class="cursor" id="cur"></span>
        </div>
      </div>
      <div class="pts-label">このシーンのポイント</div>
      <div class="pts-list" id="ptsList"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="nav-btn" id="btnPrev" onclick="goPrev()">← 前へ</button>

    <div class="center-ctrl">
      <button class="nav-btn" onclick="replay()" style="padding:8px 12px">↺ 繰り返し</button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <div class="timeline" id="tl" onclick="seekTimeline(event)">
        <div class="tl-fill" id="tlFill" style="width:0%"></div>
      </div>
    </div>

    <div class="speed-wrap">
      <button class="spd-btn on" id="s1" onclick="setSpeed(1)">1x</button>
      <button class="spd-btn" id="s15" onclick="setSpeed(1.5)">1.5x</button>
      <button class="spd-btn" id="s2" onclick="setSpeed(2)">2x</button>
    </div>
    <select class="voice-select" id="voiceSel" onchange="onVoiceChange()"></select>
    <button class="nav-btn primary" id="btnNext" onclick="goNext()">次へ →</button>
  </div>
</div>

<div class="lb" id="lb" onclick="document.getElementById('lb').classList.remove('open')">
  <img id="lbImg" src="" alt="">
</div>

let cur = 0, spd = 1, voices = [], selVoice = null;
let utter = null, isPlaying = false;
let tlTimer = null, tlVal = 0;
let ptTimer = null;
let typeTimer = null;
let charIdx = 0, fullText = '';

// ── Voice setup ──
function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('ja'));
  const sel = document.getElementById('voiceSel');
  sel.innerHTML = voices.map((v,i) => `<option value="${i}">${v.name.slice(0,14)}</option>`).join('');
  // prefer female / Kyoko / Google
  const pref = voices.findIndex(v => /Kyoko|Haruka|Google.*日本|Zira/i.test(v.name));
  if (pref >= 0) { sel.value = pref; selVoice = voices[pref]; }
  else if (voices.length) { selVoice = voices[0]; }
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function onVoiceChange() {
  const i = parseInt(document.getElementById('voiceSel').value);
  selVoice = voices[i] || null;
}

// ── Scene render ──
function renderScene(idx, autoPlay) {
  stopAll();
  const s = SCENES[idx];

  document.getElementById('chPill').textContent = s.chIcon + ' ' + s.ch;
  document.getElementById('chPill').style.cssText = `background:${s.color}22;border:1px solid ${s.color}55;color:${s.color}`;
  document.getElementById('sceneTitle').textContent = s.title;
  document.getElementById('progBar').style.width = Math.round(idx/(SCENES.length-1)*100) + '%';
  document.getElementById('progNum').textContent = (idx+1) + ' / ' + SCENES.length;
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').textContent = idx === SCENES.length-1 ? '↩ 最初から' : '次へ →';
  document.getElementById('tlFill').style.width = '0%';

  // Image
  const box = document.getElementById('imgBox');
  if (s.img) {
    box.innerHTML = `<img src="${s.img}" alt="${s.title}" style="width:100%;height:100%;object-fit:cover">`;
    box.style.cursor = 'zoom-in';
  } else {
    box.innerHTML = `<div class="no-img"><div class="no-img-icon">🎧</div><div>音声解説を聞こう</div></div>`;
    box.style.cursor = 'default';
  }

  // Bubble
  fullText = '';
  charIdx = 0;
  document.getElementById('bubbleText').textContent = '';
  document.getElementById('cur').style.display = 'inline-block';

  // Points
  document.getElementById('ptsList').innerHTML = s.points
    .map(p => `<div class="pt-item"><div class="pt-dot"></div><div>${p}</div></div>`).join('');

  // Wave
  setWave(false);
  document.getElementById('waveLabel').textContent = '▶ 再生ボタンで音声解説スタート';

  if (autoPlay) startPlay();
}

// ── Play / Stop ──
function startPlay() {
  stopAll();
  const s = SCENES[cur];
  isPlaying = true;
  setPlayBtn(true);
  setWave(true);
  document.getElementById('waveLabel').textContent = '🔊 音声再生中...';

  // Text typing
  fullText = s.narration;
  charIdx = 0;
  typeChar();

  // TTS
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    utter = new SpeechSynthesisUtterance(s.narration);
    utter.lang = 'ja-JP';
    utter.rate = spd * 1.05;
    utter.pitch = 1.05;
    if (selVoice) utter.voice = selVoice;

    const dur = estimateDur(s.narration);
    startTimeline(dur);

    utter.onend = () => {
      showPoints(0);
      setWave(false);
      document.getElementById('waveLabel').textContent = '✓ ナレーション完了';
      document.getElementById('cur').style.display = 'none';
      clearInterval(tlTimer);
      document.getElementById('tlFill').style.width = '100%';
    };
    utter.onerror = () => {
      setWave(false);
      document.getElementById('waveLabel').textContent = '⚠ 音声エラー（テキストで確認）';
      showPoints(0);
    };
    speechSynthesis.speak(utter);
  } else {
    document.getElementById('waveLabel').textContent = '⚠ このブラウザは音声合成非対応';
    showPoints(0);
  }
}

function stopAll() {
  isPlaying = false;
  speechSynthesis.cancel && speechSynthesis.cancel();
  clearTimeout(typeTimer);
  clearTimeout(ptTimer);
  clearInterval(tlTimer);
  setPlayBtn(false);
  setWave(false);
}

function togglePlay() {
  if (isPlaying) {
    speechSynthesis.cancel();
    clearTimeout(typeTimer);
    clearInterval(tlTimer);
    setWave(false);
    setPlayBtn(false);
    document.getElementById('waveLabel').textContent = '⏸ 一時停止中';
    isPlaying = false;
  } else {
    startPlay();
  }
}

function replay() { renderScene(cur, true); }

// ── Text typing effect (synced with speech) ──
function typeChar() {
  if (!isPlaying || charIdx >= fullText.length) {
    if (charIdx >= fullText.length) document.getElementById('cur').style.display = 'none';
    return;
  }
  document.getElementById('bubbleText').textContent = fullText.slice(0, ++charIdx);
  // Scroll bubble
  const b = document.getElementById('bubbleText').parentElement;
  b.scrollTop = b.scrollHeight;
  const delay = Math.max(10, Math.floor(38 / spd));
  typeTimer = setTimeout(typeChar, delay);
}

// ── Points reveal ──
function showPoints(idx) {
  const items = document.querySelectorAll('.pt-item');
  if (idx >= items.length) {
    ptTimer = setTimeout(() => {
      if (isPlaying) return;
      // auto advance 
    }, 1200);
    return;
  }
  items[idx].classList.add('show');
  ptTimer = setTimeout(() => showPoints(idx + 1), Math.floor(500 / spd));
}

// ── Timeline ──
function estimateDur(text) {
  // approx chars per second at rate=1
  return (text.length / 5) * 1000 / spd;
}
function startTimeline(dur) {
  tlVal = 0;
  clearInterval(tlTimer);
  const step = 100 / (dur / 80);
  tlTimer = setInterval(() => {
    tlVal = Math.min(99, tlVal + step);
    document.getElementById('tlFill').style.width = tlVal + '%';
  }, 80);
}
function seekTimeline(e) {
  const pct = (e.offsetX / e.currentTarget.offsetWidth);
  const s = SCENES[cur];
  const charTarget = Math.floor(pct * s.narration.length);
  charIdx = charTarget;
  document.getElementById('bubbleText').textContent = s.narration.slice(0, charIdx);
}

// ── Speed ──
function setSpeed(s) {
  spd = s;
  ['s1','s15','s2','s1_sp','s15_sp','s2_sp'].forEach(id => {
    const el = document.getElementById(id); if (el) el.classList.remove('on');
  });
  const ids = {1:['s1','s1_sp'],1.5:['s15','s15_sp'],2:['s2','s2_sp']};
  ids[s].forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('on'); });
  if (isPlaying) startPlay();
}

function startFromSplash(autoplay) {
  const sp = document.getElementById('splash');
  if (!sp) return;
  sp.classList.add('hide');
  setTimeout(() => sp.remove(), 450);
  if (autoplay) {
    // startPlay requires the current scene to already be rendered
    setTimeout(() => { if (!isPlaying) startPlay(); }, 100);
  }
}

// ── Nav ──
function goNext() {
  if (cur < SCENES.length-1) { cur++; renderScene(cur, true); }
  else { cur = 0; renderScene(cur, false); }
}
function goPrev() {
  if (cur > 0) { cur--; renderScene(cur, false); }
}

// ── UI helpers ──
function setPlayBtn(playing) {
  const b = document.getElementById('playBtn');
  b.textContent = playing ? '⏸' : '▶';
  playing ? b.classList.add('playing') : b.classList.remove('playing');
}
function setWave(playing) {
  const w = document.getElementById('wave');
  playing ? w.classList.remove('paused') : w.classList.add('paused');
}

// ── Lightbox ──
function openLB() {
  const s = SCENES[cur];
  if (!s.img) return;
  document.getElementById('lbImg').src = s.img;
  document.getElementById('lb').classList.add('open');
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') goNext();
  if (e.code === 'ArrowLeft') goPrev();
  if (e.code === 'KeyR') replay();
  if (e.code === 'Escape') document.getElementById('lb').classList.remove('open');
});

// Init
renderScene(0, false);
</script>
</body>
</html>
