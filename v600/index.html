<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Aladdin v717 — 清翔会</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E🧾%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="app.css?v=37">
</head>
<body>
  <div id="app">
    <div id="loading" class="loader"><div class="spinner"></div><div>読み込み中…</div></div>
  </div>

  <!-- Login screen -->
  <template id="tpl-login">
    <div class="login-wrap">
      <div class="login-card">
        <h1 class="login-title">Aladdin <span class="v-badge">v717</span></h1>
        <p class="login-sub">Supabase 単一データ源版 — 入力したものは絶対に消えない</p>
        <div class="field">
          <label>社員 ID (例: adachi / yasui) またはメールアドレス</label>
          <input type="text" id="lg-email" placeholder="adachi" autocomplete="username">
        </div>
        <div class="field">
          <label>パスワード</label>
          <input type="password" id="lg-pw" placeholder="********" autocomplete="current-password">
        </div>
        <button id="lg-btn" class="btn-primary">ログイン</button>
        <div id="lg-err" class="err-msg"></div>
        <div class="login-foot" style="font-size:11px;color:var(--ink-mute);line-height:1.6">
          初回ログインの初期パスワードは共有された値です。<br>
          ログイン後、右上「🔑 PW変更」から必ず変更してください。
        </div>
        <div class="login-foot">
          <a href="../">← ポータルに戻る</a>
        </div>
      </div>
    </div>
  </template>

  <!-- Main shell -->
  <template id="tpl-shell">
    <header class="hdr">
      <div class="hdr-brand">
        <span class="hdr-logo">🧾</span>
        <span class="hdr-title">Aladdin</span>
        <span class="v-badge">v717</span>
      </div>
      <nav class="hdr-nav">
        <button class="nav-btn active" data-view="visits">🏥 来院</button>
        <button class="nav-btn" data-view="bookings">📋 予約一覧</button>
        <button class="nav-btn" data-view="patients">👥 患者</button>
        <button class="nav-btn" data-view="slots">📅 予約枠</button>
        <button class="nav-btn" data-view="activity">📊 アクティビティ</button>
        <a class="nav-btn nav-ext"
           href="https://docs.google.com/spreadsheets/d/167IYM21HW0DGPlL1CrnCn4yTaTyC0KJU4f7gWyKtHf4/edit?usp=sharing"
           target="_blank" rel="noopener">📋 初診管理 <span class="ext-arrow">↗</span></a>
        <a class="nav-btn nav-ext"
           href="https://docs.google.com/spreadsheets/d/10misKpAtMitwIagGDUoMvQS7U9pfEQ0ODxG8A7DLzaQ/edit?usp=sharing"
           target="_blank" rel="noopener">📅 予約管理 <span class="ext-arrow">↗</span></a>
      </nav>
      <div class="hdr-right">
        <span id="v-count" class="count-chip hdr-count" hidden>— 件</span>
        <span id="v-updated" class="update-chip hdr-updated" hidden>更新: —</span>
        <span id="save-status" class="save-status"></span>
        <button id="sheet-sync-btn" class="link-btn sheet-sync-btn" title="初診管理シートから今すぐ取り込み">
          <span class="ss-icon">📥</span>
          <span id="ss-label" class="ss-label">シート同期: —</span>
        </button>
        <button id="ver-check-btn" class="link-btn ver-check-btn" title="最新版があるかチェック">🔍 更新確認</button>
        <span id="user-email" class="user-email"></span>
        <button id="pw-change-btn" class="link-btn" title="パスワード変更">🔑 PW変更</button>
        <a href="../" class="link-btn" title="v521 に戻る">v521 ↗</a>
        <button id="logout-btn" class="link-btn">ログアウト</button>
      </div>
    </header>

    <main id="main"></main>

    <div id="toast-host" class="toast-host"></div>
  </template>

  <!-- Visits view -->
  <template id="tpl-visits">
    <div class="view visits-view">
      <div class="toolbar">
        <!-- v717: モバイルでは検索だけ常時表示、他フィルタは折りたたみ -->
        <div class="tb-row tb-row-search">
          <input type="search" id="v-search" placeholder="🔍 患者名で検索" class="tb-search">
          <button type="button" id="v-filter-toggle" class="link-btn tb-filter-toggle" aria-expanded="false">▸ 絞込</button>
        </div>
        <div class="tb-row tb-row-filters" id="v-filters">
          <select id="v-facility" class="tb-select"></select>
          <select id="v-treatment" class="tb-select">
            <option value="">治療:全て</option>
            <option value="BF">BF</option>
            <option value="矯正">矯正</option>
            <option value="インプラント">インプラント</option>
            <option value="ラブリエ">ラブリエ</option>
            <option value="保険">保険</option>
            <option value="WT">WT</option>
            <option value="審美">審美</option>
            <option value="補綴">補綴</option>
            <option value="転院">転院</option>
          </select>
          <select id="v-promo" class="tb-select">
            <option value="">プロモ:全て</option>
          </select>
          <select id="v-status" class="tb-select">
            <option value="">ステータス:全て</option>
          </select>
          <!-- v717: 今月/先月 のクイックボタン -->
          <button type="button" class="quick-period-btn" data-period="thisMonth">今月</button>
          <button type="button" class="quick-period-btn" data-period="lastMonth">先月</button>
          <!-- v717: 重複だけを表示するトグル。同日同患者に複数行あるものが該当 -->
          <button type="button" class="quick-dup-btn" id="v-dup-toggle" title="同日同患者に複数行ある行だけ表示">重複</button>
          <select id="v-period" class="tb-select">
            <option value="all" selected>期間:すべて</option>
            <option value="thisMonth">今月</option>
            <option value="lastMonth">先月</option>
            <option value="30">直近 30 日</option>
            <option value="90">直近 90 日</option>
            <option value="365">直近 1 年</option>
            <option value="month">月指定 →</option>
            <option value="range">期間指定 →</option>
          </select>
          <input type="month" id="v-month" class="tb-select v-period-extra" hidden>
          <span id="v-range-wrap" class="v-range-wrap v-period-extra" hidden>
            <input type="date" id="v-from" class="tb-select v-date-inp">
            <span class="v-range-sep">〜</span>
            <input type="date" id="v-to" class="tb-select v-date-inp">
          </span>
          <button id="v-reset" class="link-btn">リセット</button>
          <button id="v-export-csv" class="link-btn" title="現在のフィルタ結果を CSV でダウンロード">📥 CSV</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="v-table">
          <thead>
            <tr>
              <th class="c-book">来院</th>
              <th class="c-name">名前</th>
              <th class="c-treatment">治療</th>
              <th class="c-facility">医院</th>
              <th class="c-promo">プロモ</th>
              <th class="c-status">ステータス</th>
              <th class="c-next">次回予定</th>
              <th class="c-cs">成約商材</th>
              <th class="c-cmonth">成約月</th>
              <th class="c-amount">売上</th>
              <th class="c-memo">メモ</th>
              <th class="c-updated">最終更新</th>
            </tr>
          </thead>
          <tbody id="v-tbody"></tbody>
        </table>
        <div id="v-empty" class="empty-msg" hidden>該当する予約がありません</div>
      </div>
    </div>
  </template>

  <!-- Patients view -->
  <template id="tpl-patients">
    <div class="view patients-view">
      <div class="toolbar">
        <div class="tb-row">
          <input type="search" id="p-search" placeholder="🔍 患者名で検索" class="tb-search">
          <span id="p-count" class="count-chip">— 患者</span>
        </div>
      </div>
      <div class="table-wrap">
        <table class="v-table">
          <thead><tr>
            <th class="c-name">名前</th>
            <th>電話 (下4桁)</th>
            <th>主医院</th>
            <th>予約回数</th>
            <th>最終アクティビティ</th>
          </tr></thead>
          <tbody id="p-tbody"></tbody>
        </table>
      </div>
    </div>
  </template>

  <!-- Bookings view (予約一覧 — read-only from Google Sheets) -->
  <template id="tpl-bookings">
    <div class="view bookings-view">
      <div class="toolbar">
        <div class="tb-row">
          <input type="search" id="b-search" placeholder="🔍 患者名で検索" class="tb-search">
          <select id="b-facility" class="tb-select"></select>
          <select id="b-tool" class="tb-select">
            <option value="">ソース:全て</option>
            <option value="DXHUB">DXHUB</option>
            <option value="セレクト">セレクト</option>
          </select>
          <button id="b-refresh" class="link-btn">🔄 再取得</button>
          <span class="modal-hint" style="margin-left:8px">📄 スプレッドシートから read-only 表示 (編集は 来院タブで)</span>
        </div>
        <div class="tb-row tb-summary">
          <span id="b-count" class="count-chip">— 件</span>
          <span id="b-updated" class="update-chip">更新: —</span>
        </div>
      </div>
      <div class="table-wrap">
        <table class="v-table">
          <thead><tr>
            <th class="c-book">予約日</th>
            <th class="c-name">名前</th>
            <th class="c-facility">医院</th>
            <th class="c-treatment">治療</th>
            <th class="c-promo">プロモ</th>
            <th style="width:150px">相談内容</th>
            <th style="width:150px">メール</th>
            <th style="width:110px">電話</th>
            <th class="c-book">申込日</th>
          </tr></thead>
          <tbody id="b-tbody"></tbody>
        </table>
        <div id="b-empty" class="empty-msg" hidden>該当する予約がありません</div>
      </div>
    </div>
  </template>

  <!-- Slots view (予約枠確認) -->
  <template id="tpl-slots">
    <div class="view slots-view">
      <div class="slots-header">
        <h2 class="slots-title">予約枠確認</h2>
        <span id="slots-updated" class="update-chip">最終確認: —</span>
        <button id="slots-refresh" class="link-btn">🔄 再取得</button>
      </div>
      <div id="slots-body">
        <div class="loader" style="min-height:200px"><div class="spinner"></div><div>読み込み中…</div></div>
      </div>
    </div>
  </template>

  <!-- Activity view -->
  <template id="tpl-activity">
    <div class="view activity-view">
      <div class="toolbar">
        <div class="tb-row">
          <select id="a-scope" class="tb-select">
            <option value="today">今日</option>
            <option value="yesterday">昨日</option>
            <option value="7">直近 7 日</option>
            <option value="30">直近 30 日</option>
            <option value="date">日付指定 →</option>
          </select>
          <input type="date" id="a-date" class="tb-select" hidden>
          <select id="a-user" class="tb-select">
            <option value="">社員:全員</option>
          </select>
          <button id="a-refresh" class="link-btn">🔄 更新</button>
          <span id="a-count" class="count-chip">— 件</span>
        </div>
      </div>
      <div class="activity-summary" id="a-summary"></div>
      <div class="table-wrap">
        <table class="v-table activity-table">
          <thead>
            <tr>
              <th style="width:110px">日時</th>
              <th style="width:100px">社員</th>
              <th style="width:130px">患者</th>
              <th style="width:80px">医院</th>
              <th style="width:110px">ステータス</th>
              <th>メモ</th>
              <th style="width:100px">売上</th>
            </tr>
          </thead>
          <tbody id="a-tbody"></tbody>
        </table>
        <div id="a-empty" class="empty-msg" hidden>該当する変更ログがありません</div>
      </div>
    </div>
  </template>

  <!-- Password change modal -->
  <template id="tpl-pw">
    <div class="modal-backdrop">
      <div class="modal">
        <header class="modal-hdr">
          <h3>🔑 パスワード変更</h3>
          <button class="modal-close" data-close>×</button>
        </header>
        <div class="modal-body">
          <div class="field">
            <label>新しいパスワード (8 文字以上)</label>
            <input type="password" id="pw-new" placeholder="新パスワード" autocomplete="new-password">
          </div>
          <div class="field">
            <label>確認のためもう一度</label>
            <input type="password" id="pw-new2" placeholder="もう一度入力" autocomplete="new-password">
          </div>
          <div id="pw-err" class="err-msg" style="min-height:18px"></div>
        </div>
        <footer class="modal-foot">
          <span class="modal-hint">パスワードは 8 文字以上を推奨</span>
          <button class="btn-secondary" data-close>キャンセル</button>
          <button id="pw-save" class="btn-primary">変更する</button>
        </footer>
      </div>
    </div>
  </template>

  <!-- Memo modal -->
  <template id="tpl-memo">
    <div class="modal-backdrop">
      <div class="modal">
        <header class="modal-hdr">
          <h3 id="mm-title">メモ</h3>
          <button class="modal-close" data-close>×</button>
        </header>
        <div class="modal-body">
          <textarea id="mm-text" rows="6" placeholder="メモを入力…"></textarea>
        </div>
        <footer class="modal-foot">
          <span id="mm-hint" class="modal-hint"></span>
          <button class="btn-secondary" data-close>キャンセル</button>
          <button id="mm-save" class="btn-primary">保存</button>
        </footer>
      </div>
    </div>
  </template>

  <script src="app.js?v=51"></script>
</body>
</html>
