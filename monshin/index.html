<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>事前問診票 | 清翔会</title>
<style>
  :root {
    --bg: #f8faf9;
    --bg-gradient: linear-gradient(180deg, #f4faf7 0%, #f8faf9 100%);
    --card: #ffffff;
    --text: #0f172a;
    --text-sub: #64748b;
    --text-mute: #94a3b8;
    --primary: #10b981;
    --primary-dark: #059669;
    --primary-soft: #d1fae5;
    --primary-tint: rgba(16, 185, 129, 0.06);
    --primary-glow: rgba(16, 185, 129, 0.18);
    --accent: #0ea5e9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --error: #dc2626;
    --error-soft: #fee2e2;
    --warn: #f59e0b;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -1px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 10px 30px -8px rgba(16, 185, 129, 0.25), 0 4px 12px -2px rgba(15, 23, 42, 0.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif;
    background: var(--bg-gradient);
    color: var(--text);
    font-size: 17px;
    line-height: 1.7;
    padding-bottom: 100px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  header {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid rgba(226, 232, 240, 0.6);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    text-align: center;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  header .sub {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 4px;
    letter-spacing: 0.05em;
  }
  main { max-width: 680px; margin: 0 auto; padding: 20px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s ease;
  }
  .card:hover { box-shadow: var(--shadow); }
  .card h2 {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 6px 0;
    color: var(--text);
    line-height: 1.4;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card h2::before {
    content: '';
    width: 3px;
    height: 18px;
    background: var(--primary);
    border-radius: 2px;
    flex-shrink: 0;
  }
  .card .section-desc {
    font-size: 14px;
    color: var(--text-sub);
    margin: 0 0 22px 14px;
    line-height: 1.7;
  }

  .field { margin-bottom: 26px; }
  .field:last-child { margin-bottom: 0; }
  .field label.label {
    display: block;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 10px;
    color: var(--text);
    line-height: 1.5;
  }
  .field .req {
    color: #b45309;
    font-size: 10px;
    margin-left: 8px;
    background: #fef3c7;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.05em;
    vertical-align: 2px;
  }
  .field .opt {
    color: var(--text-mute);
    font-size: 11px;
    margin-left: 8px;
    background: #f1f5f9;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.05em;
    vertical-align: 2px;
  }
  .field .desc {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 12px;
    line-height: 1.7;
    background: #f8fafc;
    padding: 10px 14px;
    border-radius: 10px;
    border-left: 3px solid var(--border-strong);
  }

  input[type=text], input[type=number], input[type=tel], input[type=email],
  input[type=date], textarea, select {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
    line-height: 1.6;
    transition: all 0.15s ease;
  }
  textarea { min-height: 110px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--text-mute); }
  input:hover, textarea:hover, select:hover { border-color: var(--border-strong); }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-glow);
    background: #fff;
  }

  /* ラジオ・チェックボックス: タップしやすいカード型 */
  .options { display: flex; flex-direction: column; gap: 10px; }
  label.opt-item {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    background: #fff;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
    position: relative;
  }
  label.opt-item:hover {
    border-color: var(--border-strong);
    background: #f8fafc;
  }
  label.opt-item input {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    accent-color: var(--primary);
    cursor: pointer;
  }
  label.opt-item.checked {
    background: #ecfdf5;
    border-color: var(--primary);
  }
  label.opt-item.checked .opt-text {
    color: var(--primary-dark);
    font-weight: 600;
  }
  label.opt-item .opt-text {
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    transition: color 0.15s;
  }

  /* スマートルーター中の表示 */
  .loader { text-align: center; padding: 80px 24px; }
  .loader .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--primary-soft);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p {
    color: var(--text-sub);
    font-size: 15px;
    margin: 0;
    letter-spacing: 0.02em;
  }

  /* 治療選択画面 (フォールバック) */
  .treatment-select {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
  }
  .treatment-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    text-align: left;
    background: #fff;
    cursor: pointer;
    transition: all 0.15s ease;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    font-family: inherit;
  }
  .treatment-card:hover {
    border-color: var(--primary);
    background: var(--primary-tint);
  }
  .treatment-card:active { transform: scale(0.99); }
  .treatment-card .label-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }
  .treatment-card .name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    letter-spacing: 0.01em;
  }
  .treatment-card .sub {
    font-size: 12px;
    color: var(--text-sub);
    line-height: 1.4;
    font-weight: 400;
    letter-spacing: 0.02em;
  }
  .treatment-card .arrow {
    color: var(--text-mute);
    font-size: 18px;
    flex-shrink: 0;
    transition: all 0.15s ease;
    font-weight: 300;
  }
  .treatment-card:hover .arrow {
    color: var(--primary);
    transform: translateX(2px);
  }

  /* 患者情報サマリー (shareconnect 予約完了画面と統一感) */
  .info-summary {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 18px;
    font-size: 14px;
    margin-bottom: 22px;
    margin-top: 6px;
  }
  .info-summary .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #f3f4f6;
  }
  .info-summary .row:last-child { border-bottom: none; }
  .info-summary .key {
    color: var(--text-sub);
    width: 70px;
    flex-shrink: 0;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.03em;
  }
  .info-summary .val {
    font-weight: 600;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }

  /* 送信ボタン */
  .submit-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-top: 1px solid rgba(226, 232, 240, 0.7);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .submit-bar .inner { max-width: 680px; margin: 0 auto; }
  button.submit-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    letter-spacing: 0.05em;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  button.submit-btn:hover { transform: translateY(-1px); }
  button.submit-btn:active { transform: translateY(0); }
  button.submit-btn:disabled {
    background: #cbd5e1;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* エラー表示 */
  .field.error input, .field.error textarea, .field.error select {
    border-color: var(--error);
    background: var(--error-soft);
  }
  .field.error label.opt-item { border-color: var(--error); }
  .field-error-msg {
    color: var(--error);
    font-size: 13px;
    margin-top: 8px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field-error-msg::before { content: '⚠'; font-size: 14px; }

  /* 完了画面 */
  .thanks {
    text-align: center;
    padding: 60px 24px;
    background: linear-gradient(180deg, #ffffff 0%, #ecfdf5 100%);
  }
  .thanks .icon {
    font-size: 80px;
    margin-bottom: 20px;
    display: inline-block;
    animation: pop 0.5s cubic-bezier(0.16, 1.5, 0.4, 1) both;
  }
  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .thanks h2 {
    font-size: 22px;
    margin: 0 0 12px;
    border: none;
    padding: 0;
    font-weight: 700;
  }
  .thanks h2::before { display: none; }
  .thanks p {
    color: var(--text-sub);
    font-size: 15px;
    line-height: 1.8;
  }

  /* その他自由記入欄 */
  .other-input { margin-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>事前問診票</h1>
  <div class="sub" id="header-sub">ご来院前のご記入をお願いいたします</div>
</header>

<main id="app">
  <!-- スマートルーター中 -->
  <div id="screen-loading" class="card">
    <div class="loader">
      <div class="spinner"></div>
      <p>ご予約内容を確認しています...</p>
    </div>
  </div>

  <!-- フォールバック: 治療選択 -->
  <div id="screen-select" class="card" style="display:none">
    <h2>ご予約内容を選択してください</h2>
    <p class="section-desc">該当するご相談内容をタップしてください</p>
    <div class="treatment-select" id="treatmentSelect">
      <button class="treatment-card" data-treatment="kyosei">
        <span class="label-block">
          <span class="name">無料矯正相談</span>
          <span class="sub">歯並び・噛み合わせ</span>
        </span>
        <span class="arrow">›</span>
      </button>
      <button class="treatment-card" data-treatment="bf">
        <span class="label-block">
          <span class="name">削らないラミネートベニア</span>
          <span class="sub">ブラックフィルム・ラブリエ</span>
        </span>
        <span class="arrow">›</span>
      </button>
      <button class="treatment-card" data-treatment="implant">
        <span class="label-block">
          <span class="name">インプラント</span>
          <span class="sub">歯を失った方へ</span>
        </span>
        <span class="arrow">›</span>
      </button>
      <button class="treatment-card" data-treatment="whitening">
        <span class="label-block">
          <span class="name">ホワイトニング</span>
          <span class="sub">歯を白く明るく</span>
        </span>
        <span class="arrow">›</span>
      </button>
      <button class="treatment-card" data-treatment="general">
        <span class="label-block">
          <span class="name">一般診療・その他</span>
          <span class="sub">むし歯・歯周病・定期検診など</span>
        </span>
        <span class="arrow">›</span>
      </button>
    </div>
  </div>

  <!-- 入力フォーム -->
  <div id="screen-form" style="display:none"></div>

  <!-- 完了 -->
  <div id="screen-thanks" class="card thanks" style="display:none">
    <div class="icon">🎉</div>
    <h2>ご記入ありがとうございました</h2>
    <p>ご来院お待ちしております。<br>当日のご相談がスムーズになります。</p>
  </div>

  <!-- エラー -->
  <div id="screen-error" class="card" style="display:none">
    <h2 style="border-color:var(--error)">エラー</h2>
    <p id="errorMsg" style="color:var(--error)"></p>
  </div>
</main>

<div class="submit-bar" id="submitBar" style="display:none">
  <div class="inner">
    <button class="submit-btn" id="submitBtn">送信する</button>
  </div>
</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 治療別テンプレート -->
<script src="./templates.js?v=8"></script>

<script>
// =====================================================================
// 設定
// =====================================================================
const SUPABASE_URL = 'https://ndlfqrvoejwgqfdtghmg.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kbGZxcnZvZWp3Z3FmZHRnaG1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1ODIxNjcsImV4cCI6MjA5MTE1ODE2N30.pE-l-4NgQTpEb9DvjeRptargvrsYH9YKyRLt06flPik';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// =====================================================================
// URL パラメータ取得
// =====================================================================
function getParams() {
  const u = new URL(location.href);
  const get = k => u.searchParams.get(k) || '';
  return {
    treatment: get('treatment').trim(),
    name: get('name').trim(),
    clinic: get('clinic').trim(),
    date: get('date').trim(),
    time: get('time').trim(),
    email: get('email').trim(),
    phone: get('phone').trim(),
    raw: Object.fromEntries(u.searchParams.entries()),
  };
}

// '2026/5/19' or '2026-05-19' → 'YYYY-MM-DD'
function normalizeDate(s) {
  if (!s) return '';
  const m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (!m) return s;
  return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
}

// =====================================================================
// スマートルーター
//   1. URL の treatment パラメータ (最優先)
//   2. Supabase RPC (manual_bookings + 同期データ)
//   3. フォールバック (患者が選択)
//
// ※ 以前は Google Sheets を直接 fetch する B方式 を実装していたが、
//   フォームのソースに Sheets ID が露出して、誰でも全患者データを
//   ダウンロード可能になるプライバシー上の重大な問題があるため廃止。
// =====================================================================
async function smartRouteTreatment(params) {
  // 1. URL 指定優先
  const fromUrl = detectTreatment(params.treatment);
  if (fromUrl) return { resolvedTreatment: fromUrl, via: 'url_param', booking: null };

  if (!params.name || !params.date) {
    return { resolvedTreatment: null, via: 'no_params', booking: null };
  }

  // 2. Supabase RPC で照会
  try {
    const { data, error } = await sb.rpc('lookup_questionnaire_treatment', {
      p_name: params.name,
      p_book_date: normalizeDate(params.date),
      p_clinic: params.clinic,
    });
    if (!error && data && data.found) {
      const t = detectTreatment(data.service) || detectTreatment(data.source);
      if (t) return { resolvedTreatment: t, via: 'smart_router_supabase', booking: data };
    }
  } catch(e) { console.warn('[supabase rpc exception]', e); }

  // 3. ヒットしない → フォールバック (患者に治療種別を選んでもらう)
  return { resolvedTreatment: null, via: 'fallback_select', booking: null };
}

// =====================================================================
// レンダリング
// =====================================================================
const screens = {
  loading: document.getElementById('screen-loading'),
  select:  document.getElementById('screen-select'),
  form:    document.getElementById('screen-form'),
  thanks:  document.getElementById('screen-thanks'),
  error:   document.getElementById('screen-error'),
};
function showScreen(name) {
  Object.entries(screens).forEach(([k, el]) => { el.style.display = (k === name) ? '' : 'none'; });
  document.getElementById('submitBar').style.display = (name === 'form') ? '' : 'none';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function interpolate(text, params) {
  if (!text) return '';
  return text.replace(/\{clinic_name\}/g, params.clinic || 'クリニック');
}

let currentTemplate = null;
let currentParams   = null;
let currentBooking  = null;

function renderForm(template, params, booking) {
  currentTemplate = template;
  currentParams   = params;
  currentBooking  = booking;

  const sections = [...(template.sections || [])];
  if (template.includeCommonMedical) sections.push(...COMMON_MEDICAL_FIELDS);

  // 質問数を計算 (showWhen でデフォルト非表示の任意設問は除外しないシンプル版)
  const totalFields = sections.reduce((sum, s) => sum + (s.fields || []).length, 0);
  const headerSub = document.getElementById('header-sub');
  if (headerSub) {
    headerSub.textContent = `全${totalFields}問・所要時間約1分`;
  }

  const html = `
    <div class="card">
      <h2>${escapeHtml(template.title)}</h2>
      ${template.description ? `<p class="section-desc">${escapeHtml(template.description)}</p>` : ''}
      <div class="info-summary">
        <div class="row"><span class="key">お名前</span><span class="val">${escapeHtml(params.name || '-')}</span></div>
        <div class="row"><span class="key">医院</span><span class="val">${escapeHtml(params.clinic || '-')}</span></div>
        <div class="row"><span class="key">予約日時</span><span class="val">${escapeHtml(params.date || '-')} ${escapeHtml(params.time || '')}</span></div>
      </div>
    </div>
    ${sections.map(sec => renderSection(sec, params)).join('')}
  `;
  screens.form.innerHTML = html;
  showScreen('form');
  attachFieldListeners();
}

function renderSection(sec, params) {
  return `
    <div class="card" data-section="${escapeHtml(sec.id)}">
      <h2>${escapeHtml(sec.title)}</h2>
      ${sec.description ? `<p class="section-desc">${escapeHtml(sec.description)}</p>` : ''}
      ${(sec.fields || []).map(f => renderField(f, params)).join('')}
    </div>
  `;
}

function renderField(f, params) {
  const label = interpolate(f.label, params);
  const desc = f.description ? `<div class="desc">${escapeHtml(f.description)}</div>` : '';
  const reqBadge = f.required ? '<span class="req">必須</span>' : '<span class="opt">任意</span>';
  const showWhenAttr = f.showWhen
    ? `data-showwhen-field="${escapeHtml(f.showWhen.field)}" data-showwhen-equals="${escapeHtml(Array.isArray(f.showWhen.equals) ? f.showWhen.equals.join('|') : f.showWhen.equals)}"`
    : '';
  let inner;
  switch (f.type) {
    case 'textarea':
      inner = `<textarea name="${f.name}" ${f.required ? 'required' : ''} placeholder="${escapeHtml(f.placeholder || '')}"></textarea>`;
      break;
    case 'number':
      inner = `<input type="number" name="${f.name}" ${f.required ? 'required' : ''}
                 ${f.min !== undefined ? `min="${f.min}"` : ''}
                 ${f.max !== undefined ? `max="${f.max}"` : ''}
                 ${f.step !== undefined ? `step="${f.step}"` : ''}
                 placeholder="${escapeHtml(f.placeholder || '')}"
                 inputmode="numeric" />`;
      break;
    case 'tel':
      inner = `<input type="tel" name="${f.name}" ${f.required ? 'required' : ''} placeholder="${escapeHtml(f.placeholder || '')}" />`;
      break;
    case 'email':
      inner = `<input type="email" name="${f.name}" ${f.required ? 'required' : ''} placeholder="${escapeHtml(f.placeholder || '')}" />`;
      break;
    case 'date':
      inner = `<input type="date" name="${f.name}" ${f.required ? 'required' : ''} />`;
      break;
    case 'radio':
      inner = `<div class="options">${(f.options || []).map((o, i) => `
        <label class="opt-item">
          <input type="radio" name="${f.name}" value="${escapeHtml(o.value)}" ${f.required && i === -1 ? 'required' : ''} />
          <span class="opt-text">${escapeHtml(o.label)}</span>
        </label>`).join('')}
      </div>`;
      break;
    case 'checkbox':
      inner = `<div class="options">${(f.options || []).map(o => `
        <label class="opt-item">
          <input type="checkbox" name="${f.name}" value="${escapeHtml(o.value)}" />
          <span class="opt-text">${escapeHtml(o.label)}</span>
        </label>`).join('')}
        ${f.allowOther ? `
          <label class="opt-item">
            <input type="checkbox" name="${f.name}" value="__other__" data-other-toggle="${f.name}" />
            <span class="opt-text">その他</span>
          </label>
          <input type="text" class="other-input" name="${f.name}__other" placeholder="その他の内容をご記入ください" style="display:none" />
        ` : ''}
      </div>`;
      break;
    case 'select':
      inner = `<select name="${f.name}" ${f.required ? 'required' : ''}>
        <option value="">選択してください</option>
        ${(f.options || []).map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('')}
      </select>`;
      break;
    default:
      inner = `<input type="text" name="${f.name}" ${f.required ? 'required' : ''} placeholder="${escapeHtml(f.placeholder || '')}" />`;
  }
  return `
    <div class="field" data-field="${f.name}" ${showWhenAttr}>
      <label class="label">${escapeHtml(label)}${reqBadge}</label>
      ${desc}
      ${inner}
    </div>
  `;
}

function attachFieldListeners() {
  // チェック / ラジオ の選択状態をカード型に反映
  screens.form.querySelectorAll('input[type=radio], input[type=checkbox]').forEach(input => {
    input.addEventListener('change', () => {
      // ラジオは name 単位で全部更新
      if (input.type === 'radio') {
        screens.form.querySelectorAll(`input[type=radio][name="${input.name}"]`).forEach(r => {
          r.closest('label.opt-item').classList.toggle('checked', r.checked);
        });
      } else {
        input.closest('label.opt-item').classList.toggle('checked', input.checked);
      }
      // showWhen 評価
      evaluateShowWhen();
      // その他トグル
      const otherKey = input.dataset.otherToggle;
      if (otherKey) {
        const other = screens.form.querySelector(`input[name="${otherKey}__other"]`);
        if (other) other.style.display = input.checked ? '' : 'none';
      }
      // ラジオ選択時のみ次のフィールドへ自動スクロール (Typeform 風)
      if (input.type === 'radio' && input.checked) {
        scrollToNextField(input.closest('.field'));
      }
    });
  });
  evaluateShowWhen();
}

// 次に表示されてるフィールドにスムーズスクロール
function scrollToNextField(currentField) {
  if (!currentField) return;
  // 250ms 待つ (選択フィードバックを見せてから)
  setTimeout(() => {
    const allFields = Array.from(screens.form.querySelectorAll('.field'))
      .filter(f => f.offsetParent !== null);  // 表示中のもののみ
    const idx = allFields.indexOf(currentField);
    const nextField = allFields[idx + 1];
    if (!nextField) return;
    // 次のフィールドの先頭が、ヘッダー (sticky 60px) より下に来るようスクロール
    const headerH = 80;
    const targetY = nextField.getBoundingClientRect().top + window.scrollY - headerH;
    window.scrollTo({ top: targetY, behavior: 'smooth' });
    // テキスト系ならフォーカスする
    const inp = nextField.querySelector('input[type=text], input[type=number], input[type=tel], input[type=email], textarea');
    if (inp) {
      // モバイル ではフォーカスしてもキーボードが出ない場合があるが、PC では入力しやすい
      setTimeout(() => { try { inp.focus({ preventScroll: true }); } catch(_){} }, 400);
    }
  }, 250);
}

function evaluateShowWhen() {
  screens.form.querySelectorAll('[data-showwhen-field]').forEach(div => {
    const field = div.dataset.showwhenField;
    const equalsRaw = div.dataset.showwhenEquals;
    const equalsList = String(equalsRaw).split('|');
    // ラジオの選択値
    const checked = screens.form.querySelector(`input[name="${field}"]:checked`);
    const val = checked ? checked.value : '';
    div.style.display = equalsList.includes(val) ? '' : 'none';
  });
}

// =====================================================================
// 送信
// =====================================================================
async function submitForm() {
  if (!currentTemplate) return;
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '送信中...';

  try {
    const sections = [...(currentTemplate.sections || [])];
    if (currentTemplate.includeCommonMedical) sections.push(...COMMON_MEDICAL_FIELDS);

    const treatmentAnswers = {};
    const commonAnswers    = {};
    const errors           = [];

    for (const sec of sections) {
      const isCommon = sec.id === 'common_medical';
      for (const f of sec.fields) {
        // 表示中のみ対象
        const div = screens.form.querySelector(`[data-field="${f.name}"]`);
        if (!div || div.style.display === 'none') continue;

        let val;
        if (f.type === 'checkbox') {
          val = Array.from(screens.form.querySelectorAll(`input[name="${f.name}"]:checked`)).map(i => i.value);
          // その他自由記入を結合
          const otherInput = screens.form.querySelector(`input[name="${f.name}__other"]`);
          if (otherInput && val.includes('__other__')) {
            val = val.filter(v => v !== '__other__');
            if (otherInput.value.trim()) val.push('other:' + otherInput.value.trim());
          }
          if (f.required && val.length === 0) errors.push({ field: f.name, msg: '選択してください' });
        } else if (f.type === 'radio') {
          const checked = screens.form.querySelector(`input[name="${f.name}"]:checked`);
          val = checked ? checked.value : '';
          if (f.required && !val) errors.push({ field: f.name, msg: '選択してください' });
        } else {
          const el = screens.form.querySelector(`[name="${f.name}"]`);
          val = el ? el.value : '';
          if (f.required && !String(val).trim()) errors.push({ field: f.name, msg: '入力してください' });
        }
        if (isCommon) commonAnswers[f.name]    = val;
        else          treatmentAnswers[f.name] = val;
      }
    }

    // エラーハイライト
    screens.form.querySelectorAll('.field').forEach(d => d.classList.remove('error'));
    screens.form.querySelectorAll('.field-error-msg').forEach(d => d.remove());
    if (errors.length) {
      errors.forEach(({ field, msg }) => {
        const div = screens.form.querySelector(`[data-field="${field}"]`);
        if (!div) return;
        div.classList.add('error');
        const m = document.createElement('div');
        m.className = 'field-error-msg';
        m.textContent = msg;
        div.appendChild(m);
      });
      // 最初のエラーへスクロール
      const firstErr = screens.form.querySelector('.field.error');
      if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    // INSERT
    const payload = {
      treatment: currentTemplate.treatment,
      patient_name: currentParams.name || null,
      patient_email: currentParams.email || null,
      patient_phone: currentParams.phone || null,
      clinic_name: currentParams.clinic || null,
      booking_book_date: normalizeDate(currentParams.date) || null,
      booking_book_time: currentParams.time || null,
      common_answers: commonAnswers,
      treatment_answers: treatmentAnswers,
      upload_files: [],
      user_agent: navigator.userAgent.slice(0, 500),
      source: 'shareconnect_email',
      resolved_via: routerResolvedVia,
      raw_url_params: currentParams.raw,
    };

    const { error } = await sb.from('medical_questionnaires').insert(payload);
    if (error) {
      console.error(error);
      alert('送信に失敗しました: ' + (error.message || JSON.stringify(error)));
      submitBtn.disabled = false;
      submitBtn.textContent = '送信する';
      return;
    }

    showScreen('thanks');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    console.error(e);
    alert('エラー: ' + e.message);
    submitBtn.disabled = false;
    submitBtn.textContent = '送信する';
  }
}

// =====================================================================
// 起動
// =====================================================================
let routerResolvedVia = '';

(async function init() {
  const params = getParams();
  console.log('[monshin] params', params);

  // 名前等が無い場合はエラー画面 (悪意あるアクセス対策)
  // ただし開発時に直接開けるよう、name 必須は緩めにする
  if (!params.name && !params.treatment) {
    // テスト時はフォールバック画面を出す
    routerResolvedVia = 'no_params_dev_fallback';
    showScreen('select');
  } else {
    showScreen('loading');
    const { resolvedTreatment, via, booking } = await smartRouteTreatment(params);
    routerResolvedVia = via;
    if (resolvedTreatment && TEMPLATES[resolvedTreatment]) {
      renderForm(TEMPLATES[resolvedTreatment], params, booking);
    } else {
      showScreen('select');
    }
  }

  // 治療選択 ボタン
  document.getElementById('treatmentSelect').addEventListener('click', e => {
    const card = e.target.closest('.treatment-card');
    if (!card) return;
    const t = card.dataset.treatment;
    if (TEMPLATES[t]) {
      routerResolvedVia = (routerResolvedVia || '') + '+manual_select';
      renderForm(TEMPLATES[t], params, null);
    }
  });

  // 送信ボタン
  document.getElementById('submitBtn').addEventListener('click', submitForm);
})();
</script>
