<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>事務ダッシュボード / Aladdin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<style>
:root{
  --bg:#f8f9fa; --card:#fff; --border:#e5e7eb; --border-light:#f0f0f0;
  --text:#1a1a1a; --text-sub:#6b7280; --text-muted:#9ca3af;
  --accent:#1a1a1a; --gold:#c9a55c; --paper:#fdfaf3;
  --green:#22c55e; --blue:#3b82f6; --red:#dc2626; --orange:#f97316; --purple:#8b5cf6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;
  -webkit-font-smoothing:antialiased;font-size:14px;
}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;font-size:16px}
a{color:inherit}

/* ======== Header ======== */
.app{min-height:100dvh}
.header{
  background:#fff;border-bottom:1px solid var(--border);
  padding:0 18px;height:52px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:50;
}
.header-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.header-brand .b{font-family:'Great Vibes',cursive;font-size:26px;line-height:1}
.header-brand .t{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--text-sub);text-transform:uppercase}
.spacer{flex:1}
.search-box{
  display:flex;align-items:center;gap:6px;border:1px solid var(--border);
  background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px;min-width:200px;
}
.search-box input{background:none;border:none;outline:none;flex:1;font-size:13px}

.wrap{max-width:1280px;margin:0 auto;padding:24px 24px 60px}
.page-header{margin-bottom:24px}
.page-header h1{font-size:24px;font-weight:700;letter-spacing:.05em}
.page-header p{color:var(--text-sub);font-size:13px;margin-top:4px}

/* ======== Section / Category ======== */
.section-block{margin-bottom:36px}
.section-head{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
  padding-bottom:8px;border-bottom:2px solid var(--accent);
}
.section-head .ico{
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;background:var(--bg);
}
.section-head .nm{font-size:16px;font-weight:700;letter-spacing:.06em;color:var(--text)}
.section-head .lock{font-size:11px;color:var(--text-muted);font-weight:600;margin-left:6px;letter-spacing:.06em}
.section-head .lock.locked{color:#9a3412}
.section-head .lock.unlocked{color:#15803d}

/* オープンセクションのアクセント */
.section-block[data-open="1"] .section-head{border-bottom-color:var(--green)}
.section-block[data-open="1"] .section-head .ico{background:#dcfce7}

/* ロックセクションのアクセント */
.section-block[data-locked="1"] .section-head{border-bottom-color:#fdba74}
.section-block[data-locked="1"] .section-head .ico{background:#fff7ed}
.section-block[data-locked="1"].unlocked .section-head{border-bottom-color:#86efac}
.section-block[data-locked="1"].unlocked .section-head .ico{background:#dcfce7}

.cat-block{margin-bottom:24px}
.cat-head{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
  padding-bottom:6px;border-bottom:1px solid var(--border);
}
.cat-head .ico{
  width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;background:var(--bg);
}
.cat-head .nm{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--text-sub);text-transform:uppercase}
.cat-head .ct{font-size:11px;color:var(--text-muted);font-weight:500;margin-left:4px}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

/* ======== Tool Card ======== */
.tool-card{
  background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:6px;
  text-decoration:none;color:var(--text);transition:all .15s;
  cursor:pointer;position:relative;min-height:96px;
}
.tool-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.tool-card.empty{background:#fafafa;border-style:dashed;color:var(--text-muted);cursor:default}
.tool-card.empty:hover{transform:none;box-shadow:none;border-color:var(--border)}
.tool-card .tc-head{display:flex;align-items:center;gap:8px}
.tool-card .tc-ico{font-size:18px;flex-shrink:0}
.tool-card .tc-title{font-size:13.5px;font-weight:700;color:var(--text);letter-spacing:.02em;line-height:1.3;flex:1;min-width:0;word-break:break-all}
.tool-card.empty .tc-title{color:var(--text-muted)}
.tool-card .tc-desc{font-size:11.5px;color:var(--text-sub);line-height:1.55;flex:1}
.tool-card .tc-meta{
  display:flex;align-items:center;gap:6px;margin-top:auto;
  font-size:10.5px;color:var(--text-muted);font-weight:600;letter-spacing:.04em;
}
.tool-card .tc-ext{display:inline-flex;align-items:center;gap:3px}
.tool-card .tc-badge{padding:2px 6px;border-radius:4px;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tc-badge.sheets{background:#dcfce7;color:#15803d}
.tc-badge.internal{background:#dbeafe;color:#1d4ed8}
.tc-badge.todo{background:#fef3c7;color:#92400e}

/* ======== Lock UI ======== */
.lock-box{
  background:linear-gradient(135deg, #fff7ed 0%, #fef3c7 100%);
  border:1.5px dashed #fdba74; border-radius:14px;
  padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;
}
.lock-box .lock-ico{font-size:36px;opacity:.7}
.lock-box .lock-msg{font-size:13px;color:#9a3412;font-weight:600;line-height:1.7}
.lock-box .lock-msg b{color:#7c2d12}
.lock-box form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:380px;width:100%}
.lock-box input[type=password]{
  flex:1;min-width:0;padding:12px 14px;border:1px solid #fdba74;border-radius:8px;
  font-size:15px;outline:none;background:#fff;color:var(--text);
}
.lock-box input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(253,186,116,.25)}
.lock-box button{
  padding:12px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.05em;
}
.lock-box button:hover{opacity:.85}
.lock-box .lock-err{font-size:12px;color:var(--red);margin-top:2px;font-weight:600;display:none}
.lock-box .lock-err.show{display:block}
.unlock-meta{
  display:flex;justify-content:flex-end;margin-top:6px;
}
.btn-relock{
  padding:5px 10px;border:1px solid var(--border);background:#fff;border-radius:6px;
  font-size:11px;color:var(--text-sub);cursor:pointer;
}
.btn-relock:hover{border-color:var(--red);color:var(--red)}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-sub)}
.empty-state h3{color:var(--text);font-size:16px;margin-bottom:6px}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--accent);color:#fff;padding:11px 22px;border-radius:10px;
  font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}

@media(max-width:920px){
  .wrap{padding:18px 14px 60px}
  .search-box{min-width:auto;flex:1}
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .tool-card{padding:12px 14px;min-height:88px}
  .tool-card .tc-title{font-size:13px}
  .section-head .nm{font-size:14px}
  .lock-box{padding:20px 16px}
}
</style>
</head>
<body>

<!-- ===== App (no main gate — open access for top-level page) ===== -->
<div class="app" id="app">
  <header class="header">
    <a href="../sales/" class="header-brand" title="HOME へ戻る">
      <span class="b">Aladdin</span>
      <span class="t">Back Office</span>
    </a>
    <div class="spacer"></div>
    <div class="search-box">
      <span>🔍</span>
      <input type="search" id="search" placeholder="ツール検索 (名前)" autocomplete="off">
    </div>
  </header>

  <div class="wrap">
    <div class="page-header">
      <h1>事務ダッシュボード</h1>
      <p>シフト・入社・予約などはオープンです。<strong>人事・労務 / 財務・給料</strong>のフォルダはそれぞれ別パスワードでロック。</p>
    </div>

    <div id="sections"></div>

    <div class="empty-state" id="emptyState" style="display:none">
      <h3>該当するツールがありません</h3>
      <p>検索ワードを変えてみてください。</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ============================================================
   セクション定義
   - open: 認証なし
   - locked: それぞれ独立のパスワード (sessionStorage 単位で記憶)
   各ツール: cat (小カテゴリ), ico, title, desc, url, badge
   url 空文字 → 準備中
   ============================================================ */

// 🟢 オープンセクション — 全員アクセス可能
const OPEN_SECTION = {
  key: 'open',
  title: 'オープン — 全員アクセス可',
  icon: '🟢',
  tools: [
    // ===== 入社・退社 =====
    {cat:'入社・退社処理', ico:'🌸', title:'入社時',               desc:'入社手続きのご案内ページ (4ステップ)', url:'../welcome/', badge:'internal'},
    {cat:'入社・退社処理', ico:'📇', title:'社員名簿追加',         desc:'新入社員情報の追加申請フォーム',     url:'https://docs.google.com/forms/d/e/1FAIpQLSchDqkAKsmQuJPlP7aI8_b6dQopDOnnB503jigFnWdjATZYUA/viewform', badge:'sheets'},
    {cat:'入社・退社処理', ico:'📤', title:'退職手続き',           desc:'退職時の手続きフォーム',           url:'https://forms.gle/8bvCP99ZHuTXrTxo9', badge:'sheets'},

    // ===== 運営・予約 =====
    {cat:'運営・予約',     ico:'📅', title:'予約枠監視',           desc:'shareconnect の枠状況',           url:'../sales/', badge:'internal'},
    {cat:'運営・予約',     ico:'🦷', title:'ドクターシフト',       desc:'医院別ドクター配置 (Google Sheets)', url:'https://docs.google.com/spreadsheets/d/1tKjXNJNPInAl0CTXHKd3G-792JNiU37inY0p6hlUPwM/edit?usp=sharing', badge:'sheets'},
    {cat:'運営・予約',     ico:'🗓️', title:'アポツール (stransa)',  desc:'外部アポ管理ツール',              url:'https://user.stransa.co.jp/login', badge:'sheets'},
    {cat:'運営・予約',     ico:'📆', title:'新予約ツール',          desc:'shareconnect 予約管理ダッシュ',    url:'https://reserve.shareconnect.co.jp/admin/dashboard', badge:'sheets'},
    {cat:'運営・予約',     ico:'📈', title:'追いかけリスト',       desc:'再アプローチ対象一覧',             url:'../#follow-up', badge:'internal'},

    // ===== その他 =====
    {cat:'その他重要事項', ico:'🎓', title:'スキル評価',           desc:'ドクター・スタッフのスキル評価',   url:'https://skill-eval.tkm-koike.workers.dev', badge:'internal'},
    {cat:'その他重要事項', ico:'📢', title:'重要連絡事項',         desc:'社内お知らせ・告知事項',           url:'', badge:'sheets'},
    {cat:'その他重要事項', ico:'📝', title:'議事録',               desc:'会議録の蓄積',                   url:'', badge:'sheets'},
  ]
};

// 🔒 ロックセクション 1: 人事・労務
const HR_SECTION = {
  key: 'hr',
  title: '人事・労務',
  icon: '🏢',
  password: 'jinji1234',
  hint: '人事・労務担当のスタッフのみアクセス可',
  tools: [
    {cat:'入社処理 (機密)', ico:'📥', title:'新入社員 連絡票',     desc:'新入社員の基本情報・配属を一覧集約', url:'', badge:'sheets'},
    {cat:'入社処理 (機密)', ico:'📄', title:'雇用契約書テンプレ',   desc:'医院・職種別の契約書ひな形',       url:'', badge:'sheets'},
    {cat:'勤怠・労務',     ico:'⏰', title:'勤怠管理',             desc:'タイムカード集計',                url:'', badge:'sheets'},
    {cat:'勤怠・労務',     ico:'📑', title:'社労情報',             desc:'労務関係資料・各種申請書',          url:'', badge:'sheets'},
    {cat:'勤怠・労務',     ico:'🗂️', title:'休暇・有給管理',        desc:'有給・特別休暇の集計',             url:'', badge:'sheets'},
    {cat:'評価',           ico:'⭐', title:'評価面談記録',          desc:'年次・半期面談の記録',              url:'', badge:'sheets'},
  ]
};

// 🔒 ロックセクション 2: 財務・給料
const FIN_SECTION = {
  key: 'fin',
  title: '財務・給料',
  icon: '💼',
  password: 'keiri1234',
  hint: '財務・経理担当のスタッフのみアクセス可',
  tools: [
    {cat:'給与',           ico:'💰', title:'給与計算',             desc:'月次給与計算ワークシート',          url:'', badge:'sheets'},
    {cat:'給与',           ico:'🏆', title:'ボーナス計算',         desc:'賞与の集計表',                    url:'', badge:'sheets'},
    {cat:'インセン管理',   ico:'🎯', title:'PBM 申請管理',         desc:'スタッフからのPBM 申請を承認',      url:'../pbm.html', badge:'internal'},
    {cat:'インセン管理',   ico:'📊', title:'PBM 集計表',            desc:'月次の支給額一覧',                url:'', badge:'sheets'},
    {cat:'インセン管理',   ico:'💎', title:'矯正・BFインセンティブ', desc:'矯正/BFの個別実績と支給計算',       url:'', badge:'sheets'},
    {cat:'経理',           ico:'💹', title:'月次売上集計',         desc:'医院別の月次売上',                url:'', badge:'sheets'},
    {cat:'経理',           ico:'💴', title:'入金管理',             desc:'デンタルローン入金確認',           url:'', badge:'sheets'},
    {cat:'経理',           ico:'🧾', title:'経費精算',             desc:'経費申請のとりまとめ',             url:'', badge:'sheets'},
  ]
};

const LOCKED_SECTIONS = [HR_SECTION, FIN_SECTION];

/* ---------- helpers ---------- */
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m, isErr){
  const t = document.getElementById('toast');
  t.textContent = m; t.className = 'toast show' + (isErr?' err':'');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
}
function isUnlocked(sectionKey){
  try{ return sessionStorage.getItem('admin_unlock_' + sectionKey) === '1'; }
  catch{ return false; }
}
function unlockSection(sectionKey){
  try{ sessionStorage.setItem('admin_unlock_' + sectionKey, '1'); }catch{}
}
function relockSection(sectionKey){
  try{ sessionStorage.removeItem('admin_unlock_' + sectionKey); }catch{}
}

/* ---------- rendering ---------- */
function renderToolCard(t){
  const ready = !!t.url;
  const isExternal = ready && /^https?:\/\//.test(t.url) && !/seishokai\.github\.io|tkm-koike|skill-eval/.test(t.url);
  const badgeKey = ready ? (t.badge || (isExternal ? 'sheets' : 'internal')) : 'todo';
  const badgeText = {'sheets':'SHEETS', 'internal':'INTERNAL', 'todo':'準備中'}[badgeKey];
  if (ready){
    return `<a class="tool-card" href="${esc(t.url)}" target="_blank" rel="noopener">
      <div class="tc-head"><span class="tc-ico">${t.ico}</span><span class="tc-title">${esc(t.title)}</span></div>
      <div class="tc-desc">${esc(t.desc)}</div>
      <div class="tc-meta">
        <span class="tc-badge ${badgeKey}">${badgeText}</span>
        <span class="tc-ext">${isExternal?'外部 ↗':'内部 →'}</span>
      </div>
    </a>`;
  } else {
    return `<div class="tool-card empty">
      <div class="tc-head"><span class="tc-ico">${t.ico}</span><span class="tc-title">${esc(t.title)}</span></div>
      <div class="tc-desc">${esc(t.desc)}</div>
      <div class="tc-meta"><span class="tc-badge todo">準備中</span></div>
    </div>`;
  }
}

function renderToolsByCategory(tools){
  const byCat = new Map();
  tools.forEach(t => {
    if (!byCat.has(t.cat)) byCat.set(t.cat, []);
    byCat.get(t.cat).push(t);
  });
  let h = '';
  for (const [cat, list] of byCat){
    h += `<div class="cat-block">
      <div class="cat-head">
        <span class="nm">${esc(cat)}</span>
        <span class="ct">${list.length}件</span>
      </div>
      <div class="cat-grid">${list.map(renderToolCard).join('')}</div>
    </div>`;
  }
  return h;
}

function renderOpenSection(filter){
  const q = (filter || '').trim().toLowerCase();
  const tools = q
    ? OPEN_SECTION.tools.filter(t => (t.title + ' ' + t.desc + ' ' + t.cat).toLowerCase().includes(q))
    : OPEN_SECTION.tools;
  if (!tools.length) return '';
  return `<div class="section-block" data-open="1">
    <div class="section-head">
      <span class="ico">${OPEN_SECTION.icon}</span>
      <span class="nm">${esc(OPEN_SECTION.title)}</span>
      <span class="lock unlocked">✓ オープン</span>
    </div>
    ${renderToolsByCategory(tools)}
  </div>`;
}

function renderLockedSection(section, filter){
  const unlocked = isUnlocked(section.key);
  const q = (filter || '').trim().toLowerCase();

  if (!unlocked){
    // ロック状態 — 検索中はちらつかせない
    if (q) return '';   // ロック中はサーチに引っかけない
    return `<div class="section-block" data-locked="1" data-key="${esc(section.key)}">
      <div class="section-head">
        <span class="ico">${section.icon}</span>
        <span class="nm">${esc(section.title)}</span>
        <span class="lock locked">🔒 ロック中</span>
      </div>
      <div class="lock-box">
        <div class="lock-ico">🔒</div>
        <div class="lock-msg"><b>${esc(section.title)}</b> はパスワード保護されています。<br>${esc(section.hint || '')}</div>
        <form onsubmit="tryUnlock('${section.key}', event); return false;">
          <input type="password" id="pw-${section.key}" autocomplete="off" placeholder="パスワードを入力">
          <button type="submit">開く</button>
        </form>
        <div class="lock-err" id="err-${section.key}">パスワードが違います</div>
      </div>
    </div>`;
  }

  // 解除済み
  const tools = q
    ? section.tools.filter(t => (t.title + ' ' + t.desc + ' ' + t.cat).toLowerCase().includes(q))
    : section.tools;
  if (!tools.length && q) return '';
  return `<div class="section-block unlocked" data-locked="1" data-key="${esc(section.key)}">
    <div class="section-head">
      <span class="ico">${section.icon}</span>
      <span class="nm">${esc(section.title)}</span>
      <span class="lock unlocked">✓ 解除済</span>
    </div>
    ${renderToolsByCategory(tools)}
    <div class="unlock-meta">
      <button class="btn-relock" onclick="relock('${section.key}')">🔒 このフォルダをロックする</button>
    </div>
  </div>`;
}

function renderAll(){
  const filter = document.getElementById('search').value;
  const host = document.getElementById('sections');
  const emp = document.getElementById('emptyState');

  const openHtml = renderOpenSection(filter);
  const lockedHtml = LOCKED_SECTIONS.map(s => renderLockedSection(s, filter)).join('');

  if (!openHtml && !lockedHtml){
    host.innerHTML = '';
    emp.style.display = 'block';
  } else {
    host.innerHTML = openHtml + lockedHtml;
    emp.style.display = 'none';
  }
}

/* ---------- unlock handlers ---------- */
function tryUnlock(sectionKey, evt){
  if (evt && evt.preventDefault) evt.preventDefault();
  const section = LOCKED_SECTIONS.find(s => s.key === sectionKey);
  if (!section) return;
  const inp = document.getElementById('pw-' + sectionKey);
  const err = document.getElementById('err-' + sectionKey);
  if (!inp) return;
  if (inp.value === section.password){
    err.classList.remove('show');
    unlockSection(sectionKey);
    toast(`${section.title} のロック解除`);
    renderAll();
  } else {
    err.classList.add('show');
    inp.focus(); inp.select();
  }
}
function relock(sectionKey){
  const section = LOCKED_SECTIONS.find(s => s.key === sectionKey);
  relockSection(sectionKey);
  toast(`${section ? section.title : '対象'} を再ロックしました`);
  renderAll();
}

/* ---------- search ---------- */
function setupSearch(){
  const box = document.getElementById('search');
  let timer = null;
  box.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(renderAll, 120);
  });
}

(function init(){
  renderAll();
  setupSearch();
})();
</script>
</body>
</html>
